  :root{
    --cream:#FAF5E9; --white:#FFFFFF; --navy:#1B3579; --navy-ghost:#24418C;
    --rule:#E6DEC9; --yellow:#F5B01E;
    --display:"Bravely","Cairo",sans-serif;
    --text:"Galano","Cairo",system-ui,sans-serif;
    /* The rail is a fixed stack designed against 16:9, so it is sized in --ru:
       1vw, capped at its 16:9 worth of height. In plain vw, any window wider
       than 16:9 ran the stack off the bottom and the rows through the QR. At
       true 16:9 the two are equal, so the TV picture is untouched. */
    --ru:min(1vw, 1.7778vh);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;overflow:hidden;background:var(--cream);color:var(--navy);font-family:var(--text);font-synthesis:none;-webkit-font-smoothing:antialiased}
  body.idle{cursor:none}
  body.idle #fsBtn{opacity:0;pointer-events:none}
  .disp{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.98;letter-spacing:.01em}
  .cap{font-weight:900;letter-spacing:.18em;text-transform:uppercase}
  .mark{fill:currentColor}
  .mark.outline{fill:none;stroke:currentColor;stroke-width:12;stroke-linejoin:round}

  .stage{display:flex;width:100vw;height:100vh}

  /* ---------------- the rail ---------------- */
  .rail{
    width:calc(28.125*var(--ru));flex:none;display:flex;flex-direction:column;
    padding:calc(2.08*var(--ru)) calc(2.3*var(--ru)) calc(1.9*var(--ru));background:var(--cream);
  }
  .railtop{display:flex;align-items:center;justify-content:space-between}
  /* The lockup on its clean light plate, never recoloured or crowded. */
  .plate{background:var(--white);padding:calc(.45*var(--ru)) calc(.6*var(--ru))}
  .plate img{height:calc(2.4*var(--ru));width:auto;display:block}
  .fleur{height:calc(2.5*var(--ru));width:auto;display:block}
  .railtitle{margin:calc(1.56*var(--ru)) 0 0;font-size:calc(3.125*var(--ru))}
  .total{display:flex;align-items:baseline;gap:calc(.83*var(--ru));margin-top:calc(.3*var(--ru))}
  .total .n{font-size:calc(6.25*var(--ru));font-weight:900;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .total .n.none{display:inline-block;width:calc(4*var(--ru));height:calc(1.5*var(--ru));background:#BDB3A0;align-self:center}
  .total .cap{font-size:calc(.94*var(--ru));line-height:1.3}
  .rows{display:flex;flex-direction:column;gap:calc(.52*var(--ru));margin-top:calc(1.35*var(--ru))}
  .prow{display:flex;align-items:center;gap:calc(.83*var(--ru));min-height:calc(3.33*var(--ru))}
  .prow .sw{width:calc(1.46*var(--ru));height:calc(1.46*var(--ru));flex:none}
  .prow .sw.wolves{border:calc(.26*var(--ru)) solid var(--yellow)}
  .prow .nm{flex:1;font-family:var(--display);font-size:calc(1.77*var(--ru));line-height:1;text-transform:uppercase}
  .prow .c{font-size:calc(2.29*var(--ru));font-weight:900;line-height:1;min-width:calc(4.2*var(--ru));text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:calc(.625*var(--ru));background:var(--rule);margin-top:calc(-.31*var(--ru))}
  .bar i{display:block;height:100%;transition:width .8s ease}
  .bar i.wolves{box-shadow:inset 0 0 0 calc(.16*var(--ru)) var(--yellow)}
  .railfoot{margin-top:auto;display:flex;align-items:center;gap:calc(1.25*var(--ru))}
  .qr{flex:none;width:calc(12.3*var(--ru));height:calc(12.3*var(--ru));background:var(--white);border:calc(.21*var(--ru)) solid var(--navy);padding:calc(.7*var(--ru))}
  .qr svg{width:100%;height:100%;display:block}
  .qr path{fill:var(--navy)}
  .find{display:flex;flex-direction:column;gap:calc(.52*var(--ru))}
  .find .disp{font-size:calc(2.29*var(--ru))}
  .find .disp[lang="ar"]{font-family:"Cairo",sans-serif;font-weight:800;line-height:1.3}
  .find .url{font-size:calc(1.25*var(--ru));font-weight:900}

  /* ---------------- the spotlight ---------------- */
  .spot{
    flex:1;min-width:0;position:relative;overflow:hidden;display:flex;flex-direction:column;
    padding:2.08vw 2.5vw 1.9vw;color:var(--cream);background:var(--navy);
    animation:fadein .5s ease both;
  }
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  /* Wolves' frame, round the whole panel. */
  .spot.wolves::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 16px var(--yellow);z-index:5}
  .spot .big{position:absolute;right:-4vw;top:-3vw;width:28vw;height:26vw;color:var(--mark)}
  .spothead{position:relative;display:flex;align-items:flex-end;gap:1.46vw}
  .spotname{margin:0;font-size:7.8vw;line-height:.9;color:var(--mark)}
  .spotnums{display:flex;flex-direction:column;gap:.3vw;padding-bottom:.6vw}
  .spotnums .n{font-size:3.75vw;font-weight:900;line-height:.9;font-variant-numeric:tabular-nums}
  .spotnums .cap{font-size:.73vw}
  .dots{position:relative;display:flex;gap:.52vw;margin-top:.94vw}
  .dots i{width:.83vw;height:.83vw;border:.16vw solid var(--cream)}
  .dots i.on{background:var(--cream)}

  /* Big cards with a slide beat more cards: density was tried twice and lost
     both times against the real wall. Four columns fill a 16:9 flood. */
  .cards{position:relative;display:grid;grid-template-columns:repeat(4, var(--cell));gap:1.04vw;margin-top:3.1vw;align-content:start;--cell:min(15.6vw, 27.8vh)}
  .cardstrip{position:relative;margin-top:3.1vw;overflow:visible}
  .strip{display:grid;grid-template-rows:repeat(2, var(--cell));grid-auto-flow:column;grid-auto-columns:var(--cell);gap:1.04vw;will-change:transform;--cell:min(15.6vw, 27.8vh)}
  /* Squarer than 13:9, three bigger columns rather than four shrunken ones. */
  @media (max-aspect-ratio: 13/9){
    .cards{grid-template-columns:repeat(3, var(--cell));--cell:min(21vw, 27.8vh)}
    .strip{--cell:min(21vw, 27.8vh)}
  }
  .wallcard{position:relative;margin:0;width:var(--cell);height:var(--cell);background:rgba(0,0,0,.15)}
  .wallcard img{width:100%;height:100%;object-fit:cover;display:block}
  /* A cream edge, so a card in the patrol's own colour does not melt into
     the flood behind it. Wolves cards carry their own yellow frame. */
  .wallcard::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 .31vw var(--cream);pointer-events:none}
  .spot.wolves .wallcard::after{display:none}
  .wallcard.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{transform:scale(.55) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}

  .empty{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.4vw}
  .empty .mark{width:15vw;height:14vw;color:var(--mark)}
  .empty h2{margin:0;font-size:3.65vw;color:var(--cream)}
  .empty .cap{font-size:1.04vw}
  .ring{position:relative;width:13.5vw;height:13.5vw;display:flex;align-items:center;justify-content:center}
  .ring svg.r{position:absolute;inset:0;width:100%;height:100%;animation:spin 3s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ring .bm{width:3.3vw;height:auto}
  .waiting h2{font-size:5.7vw}
  .waiting .row{display:flex;gap:2.2vw;margin-top:1vw}
  .waiting .row .mark{width:6.4vw;height:6vw;color:var(--cream)}

  .spotfoot{position:relative;margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:1vw}
  .spotfoot .cap{font-size:.73vw}
  .spotfoot svg{width:1.35vw;height:2.03vw}

  #fsBtn{
    position:fixed;right:1.2vw;bottom:1.2vw;z-index:10;
    font:900 .9vw var(--text);letter-spacing:.06em;text-transform:uppercase;padding:.6vw 1vw;
    border:3px solid var(--cream);background:var(--navy);color:var(--cream);cursor:pointer;transition:opacity .3s;
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="stage">
  <aside class="rail">
    <div class="railtop">
      <div class="plate"><img id="lockup" alt="26th World Scout Jamboree, Poland 2027"></div>
      <img class="fleur" id="fleur" alt="Scouts">
    </div>
    <h1 class="disp railtitle">Patrol wall</h1>

const ROTATE_MS = 20000;      /* one patrol on screen at a time */
const POLL_MS   = 10000;      /* the wall and the tally, together */
const SPOT_MAX  = 120;        /* sanity cap; the API caps the wall at 300 */
const HOLD_MS   = 4000;       /* the first screenful holds before the strip slides */
const END_HOLD_MS = 3000;     /* and the last screenful gets its beat too */
const SCROLL_COLS_PER_S = 0.9;/* the slide moves about one column a second */

function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function apiUrl(path){ return API_BASE ? API_BASE.replace(/\/+$/, "") + path : ""; }
function mark(id, cls, outline){
  return `<svg class="mark${cls ? " " + cls : ""}${outline ? " outline" : ""}" aria-hidden="true"><use href="#h-${id}"/></svg>`;
}
function knot(id){
  if(id === "wolves") return '<svg viewBox="0 0 24 36" aria-hidden="true"><path d="M0 0H12V26L0 36Z" fill="#F5B01E"/><path d="M12 0H24V36L12 26Z" fill="#000000" stroke="#F5B01E" stroke-width="2"/></svg>';
  return `<svg viewBox="0 0 24 36" aria-hidden="true"><path d="M0 0H24V36L12 26 0 36Z" fill="${PATROL_HEX[id]}" stroke="#FAF5E9" stroke-width="2"/></svg>`;
}
function hhmm(d){ return d.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"}); }

/* ------------------------------------------------------------
   State. The numbers are only ever what the API said: with no
   answer yet there is a dash, not a zero.
   ------------------------------------------------------------ */
let tally = null;            /* {wolves,bulls,curlews,ravens} once /tally answers */
let photos = null;           /* newest first, once /photos answers */
let wallOff = false;
let fetchedOnce = false;     /* first /photos answer primes "seen" silently */
const seen = new Set();
const popIds = new Set();    /* cards that arrived since the last paint, animated in */
const showNext = [];         /* patrols owed a turn because a card just landed */
let spotIdx = 0;
let lastOkAt = null;
let spotKey = "";            /* what the spotlight shows, so a poll that changes
                                nothing does not restart the hold or the slide */
let rotTimer = null;
let slideTimer = null;

async function fetchJson(path){
  const res = await fetch(apiUrl(path), {headers:{"Accept":"application/json"}, cache:"no-store"});
  if(!res.ok) throw new Error(path);
  return res.json();
}

async function poll(){
  if(!apiUrl("")) return;
  let ok = false;
  try{
    const t = await fetchJson("/tally");
    if(t && typeof t === "object"){ tally = t; ok = true; }
  }catch(_){ /* keep the last real numbers */ }
  try{
    const data = await fetchJson("/photos");
    const items = (data && data.items) || [];
    wallOff = !!(data && data.off);
    items.sort((a, b) => (b.created || 0) - (a.created || 0));
    for(const item of items){
      if(seen.has(item.id)) continue;
      seen.add(item.id);
      /* Everything present at first load is old news; only cards that appear
         while the screen is up get the pop and jump the queue. */
      if(fetchedOnce){
        popIds.add(item.id);
        if(item.patrol !== PATROL_IDS[spotIdx] && !showNext.includes(item.patrol)) showNext.push(item.patrol);
      }
    }
    photos = items;
    fetchedOnce = true;
    ok = true;
  }catch(_){ /* a failed refresh keeps the cards that are already up */ }
  if(ok) lastOkAt = new Date();
  paintRail();
  if(computeSpotKey() !== spotKey) paintSpot(false);
  else updateSpotNumbers();
}

/* ------------------------------------------------------------
   The rail: the total and the four counts. Dashes, never zeros,
   until the API has answered.
   ------------------------------------------------------------ */
function paintRail(){
  const host = document.getElementById("tallyBlock");
  const total = tally ? PATROL_IDS.reduce((n, p) => n + (Number(tally[p]) || 0), 0) : null;
  host.innerHTML = `
    <div class="total">${total === null ? '<span class="n none" aria-label="Waiting for the count"></span>' : `<span class="n">${total.toLocaleString("en-GB")}</span>`}<span class="cap">${total === 1 ? "patrol<br>found" : "patrols<br>found"}</span></div>
    <div class="rows">
      ${PATROL_IDS.map(p => {
        const n = tally ? (Number(tally[p]) || 0) : null;
        return `<div>
          <div class="prow"><span class="sw ${p}" style="background:${PATROL_HEX[p]}"></span><span class="nm">${NAMES[p]}</span><span class="c">${n === null ? "&ndash;" : n.toLocaleString("en-GB")}</span></div>
          <div class="bar"><i class="${p}" style="width:${n === null || !total ? 0 : (n / total * 100).toFixed(1)}%;background:${PATROL_HEX[p]}"></i></div>
        </div>`;
      }).join("")}
    </div>`;
}

/* ------------------------------------------------------------
   The spotlight: one patrol's colour, its count, its newest cards.
   ------------------------------------------------------------ */
function paintSpot(entrance){
  const spot = document.getElementById("spot");
  const id = PATROL_IDS[spotIdx];
  const connected = !!lastOkAt;
  const mine = photos ? photos.filter(i => i.patrol === id) : [];
  const shown = mine.slice(0, SPOT_MAX);
  const waiting = !connected && photos === null;

  /* No connection: the whole panel goes navy, so a stale patrol colour never
     sits there pretending to be live. The QR in the rail still scans. */
  spot.className = "spot" + (waiting || wallOff ? "" : (id === "wolves" ? " wolves" : ""));
  spot.style.background = waiting || wallOff ? "" : PATROL_HEX[id];
  spot.style.setProperty("--mark", PATROL_ACCENT[id] || CREAM);

  let body, foot;
  if(waiting){
    body = `<div class="empty waiting">
      <div class="ring"><svg class="r" viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="104" fill="none" stroke="#24418C" stroke-width="8"/><circle cx="110" cy="110" r="104" fill="none" stroke="#FAF5E9" stroke-width="8" stroke-dasharray="160 494"/></svg>
        <svg class="bm" viewBox="0 0 24 36" aria-hidden="true"><path d="M2 2H22V33L12 25 2 33Z" fill="none" stroke="#FAF5E9" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
      <h2 class="disp">Waiting</h2>
      <div class="row" aria-hidden="true">${PATROL_IDS.map(p => mark(p, "", true)).join("")}</div>
    </div>`;
    foot = `<span class="cap">${apiUrl("") ? "No connection &middot; the wall comes back on its own" : "No API configured"}</span>`;
  }else if(wallOff){
    body = `<div class="empty"><h2 class="disp">The wall is off just now</h2><p class="cap">The counts keep going</p></div>`;
    foot = `<span class="cap">Updated ${hhmm(lastOkAt)}</span>`;
  }else{
    const n = tally ? (Number(tally[id]) || 0) : null;
    const sliding = shown.length > 8;
    const head = `
      ${mark(id, "big")}
      <header class="spothead">
        <h2 class="disp spotname">${NAMES[id]}</h2>
        <div class="spotnums">
          ${n === null ? "" : `<div class="n">${n.toLocaleString("en-GB")}</div>`}
          <div class="cap">${shown.length} on the wall${sliding ? " &middot; sliding" : ""}</div>
        </div>
      </header>
      <div class="dots" aria-hidden="true">${PATROL_IDS.map(p => `<i class="${p === id ? "on" : ""}"></i>`).join("")}</div>`;
    const card = i => `<figure class="wallcard${popIds.has(i.id) ? " pop" : ""}"><img src="${esc(i.url)}" alt="A ${NAMES[id]} card from the wall"></figure>`;
    if(!shown.length){
      body = head + `<div class="empty">${mark(id, "", true)}<h2 class="disp">No cards yet</h2><p class="cap">Scan. Be first.</p></div>`;
    }else if(!sliding){
      body = head + `<div class="cards">${shown.map(card).join("")}</div>`;
    }else{
      /* Newest first, two rows, filling column by column. What overflows the
         screen is what the slide will bring in. */
      body = head + `<div class="cardstrip"><div class="strip">${shown.map(card).join("")}</div></div>`;
    }
    foot = `<span class="cap">Newest first &middot; updated ${hhmm(lastOkAt)}</span>${knot(id)}`;
  }
  spot.innerHTML = body + `<div class="spotfoot">${foot}</div>`;

  /* A card pulled off the wall between the list and the image request would
     otherwise sit there as a broken frame. */
  spot.querySelectorAll(".wallcard img").forEach(im => {
    im.addEventListener("error", () => { const f = im.closest(".wallcard"); if(f) f.remove(); });
  });
  for(const i of shown) popIds.delete(i.id);
  spotKey = computeSpotKey();
  if(entrance){
    spot.style.animation = "none";
    void spot.offsetWidth;
    spot.style.animation = "";
  }
  armSpot();
}

/* What the spotlight would show right now. A poll that leaves this unchanged
   must not repaint: rebuilding the grid restarts the hold and the slide. */
function computeSpotKey(){
  const id = PATROL_IDS[spotIdx];
  if(!lastOkAt && photos === null) return id + "|wait";
  if(wallOff) return id + "|off";
  const mine = (photos || []).filter(i => i.patrol === id).slice(0, SPOT_MAX);
  return id + "|" + (tally ? "t" : "-") + "|" + mine.map(i => i.id).join(",");
}

/* The numbers and the time can move without the cards changing; touch only
   the text. */
function updateSpotNumbers(){
  const id = PATROL_IDS[spotIdx];
  const nEl = document.querySelector(".spotnums .n");
  if(nEl && tally) nEl.textContent = (Number(tally[id]) || 0).toLocaleString("en-GB");
  const foot = document.querySelector(".spotfoot .cap");
  if(foot && lastOkAt && photos) foot.innerHTML = wallOff ? `Updated ${hhmm(lastOkAt)}` : `Newest first &middot; updated ${hhmm(lastOkAt)}`;
}

/* Sizes the dwell to what is on screen and starts the slide when the strip
   overflows: hold the first screenful, slide at about a column a second to
   the last card, hold that, then move on. The dwell stretches so every card
   gets its moment. */
function armSpot(){
  clearTimeout(rotTimer);
  clearTimeout(slideTimer);
  let dwell = ROTATE_MS;
  const wrap = document.querySelector(".cardstrip");
  const strip = wrap ? wrap.querySelector(".strip") : null;
  if(strip){
    const avail = document.getElementById("spot").clientWidth - wrap.offsetLeft * 2;
    const overflow = strip.scrollWidth - avail;
    if(overflow > 4){
      const col = strip.firstElementChild ? strip.firstElementChild.offsetWidth : 0;
      const gap = parseFloat(getComputedStyle(strip).columnGap) || 0;
      const slideMs = Math.max(1000, overflow / (Math.max(1, col + gap) * SCROLL_COLS_PER_S) * 1000);
      slideTimer = setTimeout(() => {
        strip.style.transition = `transform ${Math.round(slideMs)}ms linear`;
        strip.style.transform = `translateX(${-overflow}px)`;
      }, HOLD_MS);
      dwell = Math.max(ROTATE_MS, HOLD_MS + slideMs + END_HOLD_MS);
    }
  }
  rotTimer = setTimeout(rotate, dwell);
}

function rotate(){
  /* A patrol whose card just landed jumps the queue, so the wall answers the
     person stood in front of it holding their phone. */
  const owed = showNext.shift();
  spotIdx = owed && PATROL_IDS.includes(owed) ? PATROL_IDS.indexOf(owed) : (spotIdx + 1) % PATROL_IDS.length;
  paintSpot(true);
}

/* "Find your patrol", in each ready language in turn. */
let findIdx = 0;
function cycleFind(){
  const el = document.getElementById("findText");
  if(FIND.length < 2) return;
  findIdx = (findIdx + 1) % FIND.length;
  el.textContent = FIND[findIdx].text;
  el.lang = FIND[findIdx].code;
  el.dir = FIND[findIdx].code === "ar" ? "rtl" : "ltr";
}

/* ------------------------------------------------------------
   Chrome: full screen and an idle cursor.
   ------------------------------------------------------------ */
const fsBtn = document.getElementById("fsBtn");
function fsLabel(){ fsBtn.textContent = document.fullscreenElement ? "Exit full screen" : "Full screen"; }
fsBtn.addEventListener("click", () => {
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});
document.addEventListener("fullscreenchange", fsLabel);
document.addEventListener("keydown", e => { if(e.key === "f" || e.key === "F") fsBtn.click(); });
let idleTimer = null;
function wake(){
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add("idle"), 4000);
}
["mousemove","pointerdown","keydown"].forEach(ev => document.addEventListener(ev, wake));
wake();

/* ------------------------------------------------------------
   Boot.
   ------------------------------------------------------------ */
document.body.insertAdjacentHTML("afterbegin",
  `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${
    PATROL_IDS.map(p => `<symbol id="h-${p}" viewBox="0 0 ${HEADS[p].w} ${HEADS[p].h}"><path fill-rule="evenodd" d="${HEADS[p].d}"/></symbol>`).join("")
  }</defs></svg>`);
document.getElementById("lockup").src = LOCKUP;
document.getElementById("fleur").src = FLEUR;
paintRail();
paintSpot(false);          /* also arms the rotation; each repaint re-arms it */
poll();
setInterval(poll, POLL_MS);
setInterval(cycleFind, 4000);
</script>
</body>
