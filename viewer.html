  :root{
    --paper:#FAF5E9;
    --navy:#1B3579;
    --sky-line:#D2E8F5;
    --wolves:#2A5CAD;
    --bulls:#2F7D3F;
    --curlews:#F5B01E;
    --ravens:#C02D24;
    --rule:rgba(27,53,121,.14);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --grot:"Galano Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--serif);
    color:var(--navy);
    background:var(--navy);
    overflow:hidden;
  }
  /* The display goes idle: no cursor parked in a corner of the TV. */
  body.idle{cursor:none}
  body.idle #fsBtn{opacity:0;pointer-events:none}

  .stage{display:flex;width:100vw;height:100vh}

  /* ============ the rail: masthead, live count, ticker ============ */
  .rail{
    width:26vw;min-width:26vw;
    background:var(--paper);
    display:flex;flex-direction:column;
    border-right:.35vw solid var(--navy);
  }
  /* Official lockup on a clean white bar, same as the app's masthead. */
  .masthead{
    background:#fff;
    border-bottom:1px solid var(--sky-line);
    padding:1vw 1.6vw;
    display:flex;align-items:center;justify-content:space-between;gap:1vw;
  }
  .masthead img{height:4.2vw;display:block}
  .masthead .postmark{width:4.6vw;height:4.6vw;color:var(--navy)}
  .masthead .postmark svg{width:100%;height:100%;display:block}

  .railbody{flex:1;display:flex;flex-direction:column;padding:1.6vw;min-height:0}

  .eyebrow{
    font-family:var(--sans);font-size:.85vw;font-weight:800;
    letter-spacing:.16em;text-transform:uppercase;color:var(--navy);
  }
  .live{color:#B0271E}
  .livedot{
    display:inline-block;width:.62vw;height:.62vw;border-radius:50%;
    background:#B0271E;margin-right:.35vw;vertical-align:baseline;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .railtitle{
    font-family:"Bravely",var(--serif);font-weight:400;
    font-size:2.5vw;line-height:1.02;margin-top:.5vw;
  }

  .totalblock{margin-top:1.7vw}
  .total{font-family:var(--grot);font-weight:700;font-size:4.6vw;line-height:1}
  .totallabel{font-family:var(--sans);font-size:1vw;font-weight:600;margin-top:.2vw}

  .rows{margin-top:1.5vw;display:flex;flex-direction:column;gap:1.05vw}
  .prow{display:grid;grid-template-columns:2.7vw 1fr auto;column-gap:.8vw;align-items:center}
  .prow .head{width:2.7vw;height:2.5vw}
  .prow .pname{font-family:var(--serif);font-weight:700;font-size:1.5vw}
  .prow .pcount{font-family:var(--grot);font-weight:700;font-size:1.7vw;font-variant-numeric:tabular-nums}
  .prow .bar{
    grid-column:1 / -1;height:.62vw;border-radius:.31vw;
    background:rgba(27,53,121,.10);overflow:hidden;
  }
  .prow .bar i{display:block;height:100%;border-radius:.31vw;transition:width .8s ease}
  /* The spotlighted patrol's row is marked with its own colour, not by dimming
     the others: dimmed rows read as switched off. */
  .prow.now .pname::after{
    content:"ON SCREEN";font-family:var(--sans);font-weight:800;font-size:.62vw;
    letter-spacing:.12em;margin-left:.55vw;vertical-align:.22em;
    color:var(--navy);border:1px solid var(--rule);border-radius:.6vw;padding:.1vw .4vw;
  }
  .waiting{font-family:var(--sans);font-size:1.05vw;font-weight:600;line-height:1.5;margin-top:1.6vw}

  .ticker{
    margin-top:auto;
    border-top:2px solid var(--rule);
    padding-top:1vw;min-height:3.4vw;
  }
  .ticker .tnew{display:flex;align-items:center;gap:.7vw;animation:slidein .45s ease both}
  .ticker .dot{width:1vw;height:1vw;border-radius:50%;flex:none}
  .ticker .twords{font-family:var(--sans);font-size:1.02vw;font-weight:600;line-height:1.35}
  .ticker .twords b{font-weight:800}
  .ticker .ttime{font-family:var(--sans);font-size:.8vw;font-weight:600;color:rgba(27,53,121,.75)}
  @keyframes slidein{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
  .ticker .twait{font-family:var(--sans);font-size:.92vw;font-weight:600;color:rgba(27,53,121,.75)}

  .railfoot{border-top:2px solid var(--rule);padding:1.1vw 1.6vw 1.3vw}
  /* The QR is the invitation made tappable-from-a-phone: dark modules on a
     white plate, big enough to scan from a step or two back. */
  .qrrow{display:flex;align-items:center;gap:1.1vw;margin-bottom:.4vw}
  .qr{
    flex:none;width:9.5vw;height:9.5vw;
    background:#fff;border:1px solid var(--sky-line);border-radius:.5vw;
    padding:.5vw;
  }
  .qr svg{width:100%;height:100%;display:block}
  .cta{font-family:var(--sans);font-size:1.25vw;font-weight:800}
  .ctasub{font-family:var(--sans);font-size:.9vw;font-weight:600;margin-top:.15vw}
  .smallprint{
    font-family:var(--sans);font-size:.78vw;font-weight:600;
    color:rgba(27,53,121,.75);margin-top:.7vw;line-height:1.45;
  }
  .stamp{
    font-family:var(--sans);font-size:.78vw;font-weight:600;
    color:rgba(27,53,121,.75);margin-top:.35vw;
  }

  /* ============ the spotlight: one patrol at a time ============ */
  .spot{
    flex:1;min-width:0;
    display:flex;flex-direction:column;
    padding:2vw 2.2vw 1.6vw;
    animation:fadeup .5s ease both;
  }
  @keyframes fadeup{from{opacity:0;transform:translateY(1.2vh)}to{opacity:1;transform:none}}

  .spothead{display:flex;align-items:flex-start;gap:1.8vw}
  .spothead .head{width:8.2vw;height:7.6vw;flex:none;margin-top:.4vw}
  .spotname{
    font-family:"Bravely",var(--serif);font-weight:400;
    font-size:6vw;line-height:.95;letter-spacing:.01em;
  }
  .spottag{font-family:var(--serif);font-size:1.6vw;font-weight:600;margin-top:.5vw}

  .spotcount{margin-left:auto;text-align:right;flex:none}
  .spotcount .n{font-family:var(--grot);font-weight:700;font-size:5.4vw;line-height:1}
  .spotcount .nl{font-family:var(--sans);font-size:1.05vw;font-weight:700;margin-top:.15vw}
  .spotcount .nc{font-family:var(--sans);font-size:.95vw;font-weight:600;margin-top:.5vw}

  .dots{display:flex;gap:.55vw;justify-content:center;margin:.9vw 0 .9vw}
  .dots i{width:.72vw;height:.72vw;border-radius:50%;border:.14vw solid currentColor;opacity:1}
  /* No opacity tricks on a flood: the off dots are hollow, the on dot filled. */
  .dots i.on{background:currentColor}

  /* Flex, not grid: an odd last row centres itself instead of hanging off the
     left. Every cell is the same square, so the wall stays one design. */
  .cards{
    flex:1;min-height:0;
    display:flex;flex-wrap:wrap;
    justify-content:center;align-content:center;align-items:center;
    gap:1.1vw;
    --cell:min(16vw, 27.5vh);
  }
  /* A handful of cards fills the flood rather than huddling: bigger squares
     when one row is all there is. */
  .cards.few{--cell:min(19.5vw, 34vh)}

  /* Past eight cards the spotlight becomes a strip: three rows filling
     column by column, about 24 squares in view. A patrol with more than
     fits holds the first screenful, then the strip slides sideways through
     the rest - nobody's card is the one that never appears. */
  .cardstrip{
    flex:1;min-height:0;
    display:flex;align-items:center;
    overflow:hidden;
  }
  .cardstrip.fits{justify-content:center}
  .strip{
    --cell:min(7.2vw, 19vh);
    display:grid;
    grid-template-rows:repeat(3, var(--cell));
    grid-auto-flow:column;
    grid-auto-columns:var(--cell);
    gap:1.1vw;
    will-change:transform;
  }
  /* Nine cards are not a wall yet: up to twelve they get two rows at nearly
     double the area, and the dense three-row strip waits for thirteen. Without
     this step, nine cards fell off a cliff from the eight-card layout. */
  .strip.rows2{
    --cell:min(11.5vw, 28vh);
    grid-template-rows:repeat(2, var(--cell));
  }
  .strip .wallcard{width:var(--cell);height:var(--cell)}
  .wallcard{
    width:var(--cell);height:var(--cell);
    position:relative;border-radius:.6vw;overflow:hidden;
    background:var(--paper);
    box-shadow:0 .35vw 1.2vw rgba(0,0,0,.28);
  }
  .wallcard img{width:100%;height:100%;object-fit:cover;display:block}
  .wallcard.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{transform:scale(.55) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}

  .spotempty{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:.6vw;
  }
  .spotempty .big{font-family:var(--serif);font-weight:700;font-size:2.2vw;max-width:36vw;line-height:1.3}
  .spotempty .small{font-family:var(--sans);font-weight:600;font-size:1.15vw}

  /* ============ chrome ============ */
  #fsBtn{
    position:fixed;right:1.2vw;bottom:1.2vw;z-index:5;
    font-family:var(--sans);font-weight:700;font-size:.95vw;
    color:#fff;background:rgba(16,28,60,.72);
    border:1px solid rgba(255,255,255,.5);border-radius:2vw;
    padding:.55vw 1.1vw;cursor:pointer;
    transition:opacity .4s ease;
  }
  #fsBtn:hover{background:rgba(16,28,60,.92)}
  #fsBtn:focus-visible{outline:.2vw solid #fff;outline-offset:.15vw}

  /* The four heads, lifted from the app: alpha masks tinted by background. */
  .head{
    display:block;
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;

function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function apiUrl(path){ return API_BASE ? API_BASE.replace(/\/+$/,"") + path : ""; }

function purgeDateText(){
  const d = new Date(REUNION_ENDS + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + 7);
  return d.toLocaleDateString("en-GB", {day:"numeric", month:"long", year:"numeric", timeZone:"UTC"});
}

/* ------------------------------------------------------------
   State. The numbers are only ever what the API said: with no
   answer yet there is no bar and no count, not a zero.
   ------------------------------------------------------------ */
let tally = null;            /* {wolves,bulls,curlews,ravens} once /tally answers */
let photos = null;           /* newest first, once /photos answers */
let wallOff = false;
let fetchedOnce = false;     /* first /photos answer primes "seen" silently */
const seen = new Set();
const popIds = new Set();    /* cards that arrived since the last paint, animated in */
let latestArrival = null;    /* {patrol, at} for the ticker */
const showNext = [];         /* patrols owed a turn because a card just landed */
let spotIdx = 0;
let lastOkAt = null;
let spotKey = "";            /* what the spotlight currently shows, so a poll that
                                changes nothing does not restart the hold or the slide */
let rotTimer = null;
let slideTimer = null;

async function fetchJson(path){
  const res = await fetch(apiUrl(path), {headers:{"Accept":"application/json"}, cache:"no-store"});
  if(!res.ok) throw new Error(path);
  return res.json();
}

async function poll(){
  if(!apiUrl("")) return;
  let ok = false;
  try{
    const t = await fetchJson("/tally");
    if(t && typeof t === "object"){ tally = t; ok = true; }
  }catch(_){ /* keep the last real numbers */ }
  try{
    const data = await fetchJson("/photos");
    const items = (data && data.items) || [];
    wallOff = !!(data && data.off);
    items.sort((a,b) => (b.created || 0) - (a.created || 0));
    for(const item of items){
      if(seen.has(item.id)) continue;
      seen.add(item.id);
      /* Everything present at first load is old news; only cards that appear
         while the screen is up get the pop and the ticker. */
      if(fetchedOnce){
        popIds.add(item.id);
        latestArrival = {patrol: item.patrol, at: new Date()};
        if(item.patrol !== PATROL_IDS[spotIdx] && !showNext.includes(item.patrol)){
          showNext.push(item.patrol);
        }
      }
    }
    photos = items;
    fetchedOnce = true;
    ok = true;
  }catch(_){ /* a failed refresh keeps the cards that are already up */ }
  if(ok) lastOkAt = new Date();
  paintRail();
  if(computeSpotKey() !== spotKey) paintSpot(false);
  else updateSpotNumbers();
}

/* ------------------------------------------------------------
   The rail: the four counts and the newest arrival.
   ------------------------------------------------------------ */
function paintRail(){
  const host = document.getElementById("tallyBlock");
  const now = PATROL_IDS[spotIdx];
  if(!tally){
    host.innerHTML = `<p class="waiting">Waiting for the live count&hellip; the wall keeps going without it.</p>`;
  }else{
    const total = PATROL_IDS.reduce((n,p) => n + (Number(tally[p]) || 0), 0);
    const max = Math.max(1, ...PATROL_IDS.map(p => Number(tally[p]) || 0));
    host.innerHTML = `
      <div class="totalblock">
        <p class="total">${total.toLocaleString("en-GB")}</p>
        <p class="totallabel">${total === 1 ? "patrol" : "patrols"} found so far</p>
      </div>
      <div class="rows">
        ${PATROL_IDS.map(p => {
          const n = Number(tally[p]) || 0;
          return `
          <div class="prow${p === now ? " now" : ""}">
            <span class="head head-${p}" style="background:${NAVY}" aria-hidden="true"></span>
            <span class="pname">${esc(PATROLS[p].name)}</span>
            <span class="pcount">${n.toLocaleString("en-GB")}</span>
            <span class="bar"><i style="width:${(n / max * 100).toFixed(1)}%;background:${PATROL_HEX[p]}"></i></span>
          </div>`;
        }).join("")}
      </div>`;
  }

  const ticker = document.getElementById("ticker");
  if(latestArrival && PATROLS[latestArrival.patrol]){
    const p = latestArrival.patrol;
    const hhmm = latestArrival.at.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
    ticker.innerHTML = `
      <div class="tnew">
        <span class="dot" style="background:${PATROL_HEX[p]}"></span>
        <span class="twords"><b>${esc(PATROLS[p].one).replace(/^a /,"A ").replace(/^an /,"An ")}</b> just joined the wall
        <span class="ttime">&middot; ${hhmm}</span></span>
      </div>`;
  }else{
    /* An empty slot reads as a mistake; say what the space is for instead. */
    ticker.innerHTML = `<p class="twait">New cards land here the moment they&rsquo;re shared.</p>`;
  }

  const stamp = document.getElementById("updStamp");
  stamp.textContent = lastOkAt
    ? "Updated " + lastOkAt.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit", second:"2-digit"})
    : (apiUrl("") ? "Reaching the wall…" : "No API configured.");
}

/* ------------------------------------------------------------
   The spotlight: one patrol's flood, its count, its newest cards.
   ------------------------------------------------------------ */
function paintSpot(entrance){
  const spot = document.getElementById("spot");
  const id = PATROL_IDS[spotIdx];
  const ink = onFlood(id);
  const pt = PATROLS[id];
  spot.style.background = PATROL_HEX[id];
  spot.style.color = ink;

  const mine = photos ? photos.filter(i => i.patrol === id) : [];
  const shown = mine.slice(0, SPOT_MAX);

  let body;
  if(wallOff){
    body = `<div class="spotempty">
      <p class="big">The patrol wall is switched off just now.</p>
      <p class="small">The counts keep ticking &mdash; come and see us at the Pavilion stand.</p>
    </div>`;
  }else if(photos === null){
    body = `<div class="spotempty">
      <p class="big">Waiting for the wall&hellip;</p>
      <p class="small">Cards appear here the moment someone shares one.</p>
    </div>`;
  }else if(!shown.length){
    body = `<div class="spotempty">
      <p class="big">Nothing on the wall for the ${esc(pt.name)} yet. Be the first.</p>
      <p class="small">Take the quiz at wsjpatrol.com and share your patrol card.</p>
    </div>`;
  }else if(shown.length <= 8){
    body = `<div class="cards${shown.length <= 4 ? " few" : ""}">
      ${shown.map(i => `
        <figure class="wallcard${popIds.has(i.id) ? " pop" : ""}">
          <img src="${esc(i.url)}" alt="A ${esc(pt.name)} card from the wall">
        </figure>`).join("")}
    </div>`;
  }else{
    /* Newest first, filling column by column: two generous rows up to twelve
       cards, three dense rows past that. What overflows the screen is what
       the slide will bring in. */
    body = `<div class="cardstrip"><div class="strip${shown.length <= 12 ? " rows2" : ""}">
      ${shown.map(i => `
        <figure class="wallcard${popIds.has(i.id) ? " pop" : ""}">
          <img src="${esc(i.url)}" alt="A ${esc(pt.name)} card from the wall">
        </figure>`).join("")}
    </div></div>`;
  }

  const n = tally ? (Number(tally[id]) || 0) : null;
  spot.innerHTML = `
    <div class="spothead">
      <span class="head head-${id}" style="background:${ink}" aria-hidden="true"></span>
      <div>
        <h2 class="spotname">${esc(pt.name).toUpperCase()}</h2>
        <p class="spottag">${esc(pt.tagline)}</p>
      </div>
      <div class="spotcount">
        ${n === null ? "" : `
          <p class="n">${n.toLocaleString("en-GB")}</p>
          <p class="nl">${esc(pt.name)} found so far</p>`}
        ${photos !== null && !wallOff ? `<p class="nc">${mine.length ? mine.length.toLocaleString("en-GB") : "No"} card${mine.length === 1 ? "" : "s"} on the wall</p>` : ""}
      </div>
    </div>
    <div class="dots" aria-hidden="true">
      ${PATROL_IDS.map(p => `<i class="${p === id ? "on" : ""}"></i>`).join("")}
    </div>
    ${body}`;

  /* A card pulled off the wall between the list and the image request would
     otherwise sit there as a broken frame. */
  spot.querySelectorAll(".wallcard img").forEach(im => {
    im.addEventListener("error", () => { const f = im.closest(".wallcard"); if(f) f.remove(); });
  });

  for(const i of shown) popIds.delete(i.id);
  spotKey = computeSpotKey();
  if(entrance){
    /* Restart the entrance so each patrol arrives, rather than snapping. */
    spot.style.animation = "none";
    void spot.offsetWidth;
    spot.style.animation = "";
  }
  paintRailHighlight();
  armSpot();
}

/* What the spotlight would show right now. A poll that leaves this unchanged
   must not repaint: rebuilding the grid restarts the hold and the slide. */
function computeSpotKey(){
  const id = PATROL_IDS[spotIdx];
  if(wallOff) return id + "|off";
  if(photos === null) return id + "|wait";
  const mine = photos.filter(i => i.patrol === id).slice(0, SPOT_MAX);
  return id + "|" + (tally ? "t" : "-") + "|" + mine.map(i => i.id).join(",");
}

/* The numbers can move without the cards changing; touch only the text. */
function updateSpotNumbers(){
  const id = PATROL_IDS[spotIdx];
  const nEl = document.querySelector(".spotcount .n");
  if(nEl && tally) nEl.textContent = (Number(tally[id]) || 0).toLocaleString("en-GB");
}

/* Sizes the dwell to what is on screen and starts the slide when the strip
   overflows: hold the first screenful, slide at about a column a second to
   the last card, hold that, then move on. Fitting content keeps the 12s. */
function armSpot(){
  clearTimeout(rotTimer);
  clearTimeout(slideTimer);
  let dwell = ROTATE_MS;
  const wrap = document.querySelector(".cardstrip");
  const strip = wrap ? wrap.querySelector(".strip") : null;
  if(strip){
    const overflow = strip.scrollWidth - wrap.clientWidth;
    if(overflow > 4){
      const col = strip.firstElementChild ? strip.firstElementChild.offsetWidth : 0;
      const gap = parseFloat(getComputedStyle(strip).columnGap) || 0;
      const slideMs = Math.max(1000, overflow / (Math.max(1, col + gap) * SCROLL_COLS_PER_S) * 1000);
      slideTimer = setTimeout(() => {
        strip.style.transition = `transform ${Math.round(slideMs)}ms linear`;
        strip.style.transform = `translateX(${-overflow}px)`;
      }, HOLD_MS);
      dwell = Math.max(ROTATE_MS, HOLD_MS + slideMs + END_HOLD_MS);
    }else{
      wrap.classList.add("fits");
    }
  }
  rotTimer = setTimeout(rotate, dwell);
}

/* Only the "ON SCREEN" tag moves between rotations; repainting the whole rail
   for it would fight the bar transitions. */
function paintRailHighlight(){
  const now = PATROL_IDS[spotIdx];
  document.querySelectorAll(".prow").forEach((row, i) => {
    row.classList.toggle("now", PATROL_IDS[i] === now);
  });
}

function rotate(){
  /* A patrol whose card just landed jumps the queue, so the wall answers the
     person who is stood in front of it holding their phone. */
  const owed = showNext.shift();
  if(owed && PATROL_IDS.includes(owed)){
    spotIdx = PATROL_IDS.indexOf(owed);
  }else{
    spotIdx = (spotIdx + 1) % PATROL_IDS.length;
  }
  paintSpot(true);
}

/* ------------------------------------------------------------
   Chrome: full screen and an idle cursor.
   ------------------------------------------------------------ */
const fsBtn = document.getElementById("fsBtn");
function fsLabel(){
  fsBtn.textContent = document.fullscreenElement ? "Exit full screen" : "Full screen";
}
fsBtn.addEventListener("click", () => {
  if(document.fullscreenElement){ document.exitFullscreen(); }
  else{ document.documentElement.requestFullscreen().catch(() => {}); }
});
document.addEventListener("fullscreenchange", fsLabel);
document.addEventListener("keydown", e => {
  if(e.key === "f" || e.key === "F") fsBtn.click();
});

let idleTimer = null;
function wake(){
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add("idle"), 4000);
}
["mousemove","pointerdown","keydown"].forEach(ev => document.addEventListener(ev, wake));
wake();

/* ------------------------------------------------------------
   Boot.
   ------------------------------------------------------------ */
document.getElementById("wsjMark").src = WSJ_MARK;
document.getElementById("postmark").innerHTML = POSTMARK;
document.getElementById("purgeDate").textContent = purgeDateText();
paintRail();
paintSpot(false);          /* also arms the rotation; each repaint re-arms it */
poll();
setInterval(poll, POLL_MS);
</script>
