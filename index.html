            <div class="ghostcard post">4:5</div>
            <canvas id="ctaPreview" width="300" height="300" aria-label="A preview of your ${pt.name} card"></canvas>
            <div class="ghostcard story">9:16</div>
          </div>
          <button class="btn primary" id="cardBtn">Make my ${pt.name} card</button>
        </div>

        <div class="quietrow">
          <button class="linkbtn" id="shareBtn">Share my patrol</button>
          <button class="linkbtn" id="againBtn">Start again</button>
        </div>
        <p class="history">Real patrol, real names, real colour. The personalities are just for fun. BP mixed everyone up on purpose.</p>
      </div>
    </div>`;

  document.getElementById("againBtn").addEventListener("click", ()=>{ sharedPatrol = null; finished = null; renderIntro(); });
  document.getElementById("cardBtn").addEventListener("click", ()=>renderCardStudio(id));
  document.getElementById("shareBtn").addEventListener("click", (e)=>sharePatrol(id, e.currentTarget));
  applyFlags();

  /* A picture of the thing sells it better than a sentence about it. */
  paintCtaPreview(id);

  /* The outcome was already counted at the interstitial; a forced render
     (console, screenshots) never counts. */
  loadTally().then(()=>paintTally(id));
}

async function paintCtaPreview(id){
  const c = document.getElementById("ctaPreview");
  if(!c) return;
  const [head, fleur] = await Promise.all([loadHead(id), loadFleur()]);
  drawCard(c.getContext("2d"), c.width, c.height, newStudioState(id, head, fleur));
}

/* ============================================================
   RENDER — CARD STUDIO
   ============================================================ */
async function renderCardStudio(id, keep){
  if(FLAGS.cards === false){ renderResult(id); toast("Patrol cards are switched off just now."); return; }
  const pt = PATROLS[id];
  const [head, fleur] = await Promise.all([loadHead(id), loadFleur()]);
  studio = keep && keep.patrol === id ? keep : newStudioState(id, head, fleur);
  toTop();
  document.body.className = "result-mode studio-mode result-" + id;

  app.innerHTML = `
    <div class="screen studio">
      <h1 class="banner centered">Your ${esc(pt.name)} card</h1>

      <div class="card">
        <div class="stagewrap"><canvas id="stage" width="540" height="540" tabindex="0"
             aria-label="Preview of your ${esc(pt.name)} card. With a photo added, drag to move it and pinch, scroll or press plus and minus to zoom."></canvas></div>
        <p class="stagenote" id="stageNote"></p>

        <div class="segrow" role="group" aria-label="Card shape">
          ${Object.keys(FORMATS).filter(k=>!FORMATS[k].wall).map(k=>`
            <button type="button" data-fmt="${k}" aria-pressed="${k==="profile"}">
              ${esc(FORMATS[k].label)}<br><span class="segsub">${esc(FORMATS[k].sub)}</span>
            </button>`).join("")}
        </div>

        <div class="photorow">
          <label class="filebtn">
            <span id="fileLabel">Add a photo</span>
            <input type="file" accept="image/*" id="photoIn">
          </label>
          <button class="linkbtn" id="removePhoto" hidden>Take the photo back off</button>
        </div>

        <p class="micro">Drag the picture to move it, pinch to zoom. No photo? The card works on its own.</p>

        <div class="privacy">
          <b>Your photo stays on your phone.</b> The card is put together here, inside this page,
          the same way a filter works in your camera app. The picture is never sent to us and
          we never see it. Close the tab and it is gone.
        </div>

        <div class="stack">
          <button class="btn primary" id="saveBtn">Save the card</button>
          <button class="btn" id="shareCardBtn">Share the card</button>
        </div>
      </div>

      <div class="wallcta" id="logbox" data-needs="wall uploads">
        <p class="eyebrow">The wall at Gilwell Reunion</p>
        <h2>Put yourself on the wall</h2>
        <p>There's a wall of patrol cards at the Pavilion, filling up all day. Add yours and find the rest of your patrol on it.</p>
        <div class="wallstrip" id="wallStrip" aria-hidden="true"></div>
        <div class="wallfacts">
          <span>Anyone can see it</span>
          <span>${FLAGS.moderate ? "We check it first" : "Up straight away"}</span>
          <span>Gone ${esc(purgeDateShort())}</span>
          <span>Totally optional</span>
        </div>
        <label class="consent"><input type="checkbox" id="logConsent"> Yes, put my card on the wall. I'm happy for anyone to see it until it's deleted.</label>
        <div class="stack">
          <button class="btn go" id="uploadBtn">Add me to the wall</button>
        </div>
        <p class="wallnote">Only the card and the patrol are stored &mdash; no name, no email. Anyone can report a card and it comes down on the spot. Changed your mind? Find the Jamboree Team in the International Tent.</p>
      </div>

      <div class="stack">
        <button class="btn" id="seeLogBtn" data-needs="wall">See the patrol log</button>
        <button class="btn" id="backBtn">Back to my patrol</button>
      </div>
    </div>`;

  if(studio.img){
    document.getElementById("removePhoto").hidden = false;
    document.getElementById("fileLabel").textContent = "Use a different photo";
  }
  app.querySelectorAll(".segrow button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.fmt === studio.fmt)));
  paintPreview();

  document.getElementById("photoIn").addEventListener("change", (e)=>{
    openPhoto(e.target.files && e.target.files[0]);
    document.getElementById("fileLabel").textContent = "Use a different photo";
  });
  document.getElementById("removePhoto").addEventListener("click", (e)=>{
    studio.img = null; studio.zoom = 1; studio.ox = 0; studio.oy = 0;
    document.getElementById("fileLabel").textContent = "Add a photo";
    e.target.hidden = true;
    paintPreview();
  });
  app.querySelectorAll(".segrow button").forEach(b=>{
    b.addEventListener("click", ()=>{
      studio.fmt = b.dataset.fmt;
      app.querySelectorAll(".segrow button").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
      paintPreview();
    });
  });

  /* Reframe on the picture itself: one finger drags, two pinch. A slider
     underneath was the thing people missed, because the picture is what they
     reach for. The canvas already sets touch-action:none, so the browser
     hands over both fingers instead of zooming the page.

     Every gesture is measured from a baseline taken when the number of
     fingers changes, so lifting one finger out of a pinch carries on panning
     from where it is rather than jumping. */
  const stage = document.getElementById("stage");
  const pointers = new Map();
  let base = null;

  const clampZoom = (z)=> Math.min(ZOOM_MAX, Math.max(1, z));
  const spread = (a, b)=> Math.hypot(a.x - b.x, a.y - b.y);
  function midpoint(){
    const pts = [...pointers.values()];
    let x = 0, y = 0;
    for(const p of pts){ x += p.x; y += p.y; }
    return {x: x/pts.length, y: y/pts.length, n: pts.length, pts: pts};
  }
  function rebase(){
    if(!studio.img || !pointers.size){ base = null; return; }
    const m = midpoint();
    const r = stage.getBoundingClientRect();
    base = {
      x: m.x, y: m.y, w: r.width, h: r.height,
      dist: m.n > 1 ? spread(m.pts[0], m.pts[1]) : 0,
      ox: studio.ox, oy: studio.oy, zoom: studio.zoom
    };
  }

  stage.addEventListener("pointerdown", (e)=>{
    if(!studio.img) return;
    /* Capture keeps hold of a finger that slides off the canvas mid-gesture.
       It throws if the pointer has already lifted, and that must not stop the
       rest of this handler running or the gesture starts with no baseline. */
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    rebase();
    stage.classList.add("dragging");
  });
  stage.addEventListener("pointermove", (e)=>{
    if(!base || !pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const m = midpoint();
    if(m.n > 1 && base.dist > 0){
      studio.zoom = clampZoom(base.zoom * spread(m.pts[0], m.pts[1]) / base.dist);
    }
    studio.ox = base.ox + (m.x - base.x) / base.w;
    studio.oy = base.oy + (m.y - base.y) / base.h;
    paintPreview();
  });
  const lift = (e)=>{
    if(!pointers.delete(e.pointerId)) return;
    if(pointers.size) rebase();
    else { base = null; stage.classList.remove("dragging"); }
  };
  stage.addEventListener("pointerup", lift);
  stage.addEventListener("pointercancel", lift);

  /* No second finger on a laptop. A trackpad pinch arrives here too. */
  stage.addEventListener("wheel", (e)=>{
    if(!studio.img) return;
    e.preventDefault();
    studio.zoom = clampZoom(studio.zoom * Math.exp(-e.deltaY * 0.0016));
    paintPreview();
  }, {passive:false});

  /* Neither gesture reaches a keyboard, and losing the slider would otherwise
     have taken zoom away from anyone using one. */
  stage.addEventListener("keydown", (e)=>{
    if(!studio.img) return;
    const step = 0.08, pan = 0.04;
    const moves = {
      ArrowLeft:  ()=>studio.ox -= pan,
      ArrowRight: ()=>studio.ox += pan,
      ArrowUp:    ()=>studio.oy -= pan,
      ArrowDown:  ()=>studio.oy += pan,
      "+":        ()=>studio.zoom = clampZoom(studio.zoom + step),
      "=":        ()=>studio.zoom = clampZoom(studio.zoom + step),
      "-":        ()=>studio.zoom = clampZoom(studio.zoom - step),
      _:          ()=>studio.zoom = clampZoom(studio.zoom - step)
    };
    const fn = moves[e.key];
    if(!fn) return;
    e.preventDefault();
    fn();
    paintPreview();
  });

  document.getElementById("saveBtn").addEventListener("click", saveCard);
  document.getElementById("shareCardBtn").addEventListener("click", async (e)=>{
    const btn = e.currentTarget;
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "Getting it ready...";
    const done = await shareCard(null, shareTextFor(studio.patrol) + " " + shareUrlFor(studio.patrol));
    btn.disabled = false; btn.textContent = label;
    if(!done){ toast("This browser can't share images. Saving it instead."); saveCard(); }
  });
  document.getElementById("uploadBtn").addEventListener("click", (e)=>uploadToLog(e.currentTarget));
  paintWallStrip();
  document.getElementById("seeLogBtn").addEventListener("click", ()=>renderLog(id));
  document.getElementById("backBtn").addEventListener("click", ()=>renderResult(id));
  applyFlags();
}

/* ============================================================
   RENDER — PATROL LOG
   ============================================================ */
async function renderLog(fromPatrol){
  if(FLAGS.wall === false){
    if(fromPatrol) renderCardStudio(fromPatrol); else renderIntro();
    toast("The patrol wall is switched off just now.");
    return;
  }
  toTop();
  document.body.className = "log";
  app.innerHTML = `
    <div class="ptr" id="ptr" aria-hidden="true"><i></i><span>Pull to refresh</span></div>
    <div class="screen logscreen">
     <div class="pullwrap" id="pullWrap">
      <p class="eyebrow">The wall at Gilwell Reunion</p>
      <h1 class="banner">Patrol log</h1>
      <p class="sub">Cards people chose to share at Gilwell Reunion. Everything here comes down on ${esc(purgeDateText())}.</p>
      <div class="logfilter" role="group" aria-label="Filter by patrol">
        <button data-p="all" aria-pressed="true">All</button>
        ${PATROL_IDS.map(p=>`<button data-p="${p}" aria-pressed="false">${esc(PATROLS[p].name)}</button>`).join("")}
      </div>
      <div class="logstatus">
        <span id="logStamp"></span>
        <button class="linkbtn" id="refreshBtn">Refresh</button>
      </div>
      <div id="logBody" aria-busy="true"><p class="logempty">Loading the wall...</p></div>
      <p class="reportlink">Something on here that shouldn't be? Tell the Jamboree Team in the International Tent, or tap Report on the card, and it comes down.</p>
      <div class="stack">
        <button class="btn primary" id="backBtn">${fromPatrol ? "Back to my card" : "Find my patrol"}</button>
      </div>
     </div>
    </div>`;

  const keep = studio && fromPatrol && studio.patrol === fromPatrol ? studio : null;
  document.getElementById("backBtn").addEventListener("click", ()=>{
    if(fromPatrol) renderCardStudio(fromPatrol, keep); else renderIntro();
  });

  let items = null;
  let filter = "all";

  function paint(){
    const body = document.getElementById("logBody");
    if(!body) return;
    body.setAttribute("aria-busy", "false");
    if(items === null){
      body.innerHTML = `<p class="logempty">The patrol log isn't switched on yet. Come and see the wall at the Pavilion.</p>`;
      return;
    }
    const shown = filter === "all" ? items : items.filter(i => i.patrol === filter);
    if(!shown.length){
      body.innerHTML = `<p class="logempty">Nothing on the wall yet${filter === "all" ? "" : " for the " + esc(PATROLS[filter].name)}. Be the first.</p>`;
      return;
    }
    body.innerHTML = `<div class="loggrid">${shown.map(i=>`
      <figure class="logcard" data-id="${esc(i.id)}">
        <img src="${esc(i.url)}" alt="A ${esc(PATROLS[i.patrol] ? PATROLS[i.patrol].name : i.patrol)} card someone shared" loading="lazy">
        <button class="reportbtn" data-report="${esc(i.id)}"><span>Report</span></button>
      </figure>`).join("")}</div>`;
    body.querySelectorAll("[data-report]").forEach(b=>{
      b.addEventListener("click", ()=>reportPhoto(b.dataset.report, b.closest(".logcard")));
    });
    /* A card pulled off the wall between the list and the image request would
       otherwise sit there as a broken frame. */
    body.querySelectorAll(".logcard img").forEach(im=>{
      im.addEventListener("error", ()=>{ const f = im.closest(".logcard"); if(f) f.remove(); });
    });
  }

  app.querySelectorAll(".logfilter button").forEach(b=>{
    b.addEventListener("click", ()=>{
      filter = b.dataset.p;
      app.querySelectorAll(".logfilter button").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
      paint();
    });
  });

  /* A refresh that fails keeps whatever is already on the screen: at a stand
     with patchy signal, blanking the wall would be worse than showing a
     slightly old one. */
  async function load(){
    if(!apiUrl("")){ items = null; return; }
    try{
      const res = await fetch(apiUrl("/photos"), {headers:{"Accept":"application/json"}, cache:"no-store"});
      const data = await res.json();
      items = Array.isArray(data) ? data : (data && data.items) || [];
    }catch(_){ items = items || []; }
  }

  function stamp(){
    const el = document.getElementById("logStamp");
    if(!el) return;
    el.textContent = items === null ? ""
      : "Updated " + new Date().toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
  }

  const screen = document.getElementById("pullWrap");
  const ptr = document.getElementById("ptr");
  const ptrText = ptr.querySelector("span");
  const PULL_AT = 64, PULL_MAX = 96;
  let pullFrom = null, pulled = 0, busy = false;

  function showPull(px, msg){
    pulled = px;
    screen.style.transform = px ? `translateY(${px}px)` : "";
    ptr.style.height = px + "px";
    ptr.style.opacity = px ? String(Math.min(1, px/PULL_AT)) : "0";
    if(msg) ptrText.textContent = msg;
  }

  async function refresh(){
    if(busy) return;
    busy = true;
    screen.classList.add("snap");
    ptr.classList.add("spin");
    showPull(PULL_AT, "Refreshing");
    document.getElementById("logBody").setAttribute("aria-busy", "true");
    await load();
    paint();
    stamp();
    showPull(0);
    ptr.classList.remove("spin");
    setTimeout(()=>{ screen.classList.remove("snap"); busy = false; }, 240);
  }

  /* One finger, only from the very top, and only downwards - anything else is
     an ordinary scroll and must be left alone. */
  screen.addEventListener("touchstart", (e)=>{
    if(busy || e.touches.length !== 1 || window.scrollY > 0) return;
    pullFrom = e.touches[0].clientY;
  }, {passive:true});

  screen.addEventListener("touchmove", (e)=>{
    if(pullFrom === null) return;
    const dy = e.touches[0].clientY - pullFrom;
    if(dy <= 0){ showPull(0); pullFrom = null; return; }
    e.preventDefault();
    const px = Math.min(PULL_MAX, dy*0.5);
    showPull(px, px >= PULL_AT ? "Release to refresh" : "Pull to refresh");
  }, {passive:false});

  const letGo = ()=>{
    if(pullFrom === null) return;
    const go = pulled >= PULL_AT;
    pullFrom = null;
    if(go){ refresh(); }
    else { screen.classList.add("snap"); showPull(0); setTimeout(()=>screen.classList.remove("snap"), 240); }
  };
  screen.addEventListener("touchend", letGo);
  screen.addEventListener("touchcancel", letGo);

  /* There is no pull on a laptop, and the wall is shown on one at the stand. */
  document.getElementById("refreshBtn").addEventListener("click", refresh);

  await load();
  paint();
  stamp();
}

/* ============================================================
   BOOT
   ?patrol=  a shared result, so the link carries the patrol
   ?log=1    straight to the wall (also a home-screen shortcut)
   ?start=1  straight into the quiz (also a home-screen shortcut)
   ============================================================ */
let sharedPatrol = null;

(function boot(){
  const q = new URLSearchParams(window.location.search);
  const shared = q.get("patrol");
  if(shared && PATROLS[shared]) sharedPatrol = shared;
  loadFlags();                      /* answers late; applyFlags catches up */
  if(q.get("log") === "1"){ renderLog(null); return; }
  renderIntro();
  if(q.get("start") === "1") startQuiz();
})();
</script>
