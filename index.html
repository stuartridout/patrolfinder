  :root{
    --cream:#FAF5E9;
    --white:#FFFFFF;
    --navy:#1B3579;
    --navy-ghost:#24418C;       /* decoration on navy only */
    --red:#E13327;              /* house red, matches the lockup */
    --red-ink:#D42B20;          /* white text on red needs this one */
    --sky:#AEDCF2;
    --sky-ghost:#C4E6F7;
    --paper-ghost:#EEE5CB;
    --purple:#7413DC;
    --green:#2F7D3F;            /* ticks and confirmations, not a patrol */
    --green-ink:#2A6E38;
    --ink-soft:#3E4F7D;         /* secondary text on cream or white, 8:1 */
    --ink-muted:#6B6150;        /* small labels on cream, 5.6:1 */
    --rule:#D9D0BC;
    /* The Patrol Shoulder Knots, as the Heritage Team checked them: Bulls
       red, Curlews green, Ravens black, Wolves yellow and black. Two black
       grounds would be one colour twice, so Wolves is black with a yellow
       border and yellow accents and Ravens stays pure black. */
    --wolves:#000000;
    --wolves-accent:#F5B01E;
    --bulls:#C02D24;
    --curlews:#2F7D3F;
    --ravens:#000000;
    --text:"Galano","Cairo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --display:"Bravely","Cairo",sans-serif;
    /* What sits behind a pennant, so its notch can be cut in the right colour. */
    --ground:var(--cream);
  }

  /* Each patrol sets the same handful of names, and every screen that shows
     a patrol reads them rather than knowing which one it is. --mark is the
     animal and anything that marks the patrol; --on is running text on the
     patrol colour; --ink is the patrol's colour as type on cream. */
  .p-wolves {--p:var(--wolves); --ink:#000000;--mark:var(--wolves-accent);--on:var(--cream);--plate:var(--wolves-accent);--plate-ink:#000000;--plate-edge:#000000;--btn:#000000;--btn-ink:var(--wolves-accent);--focus-on:var(--wolves-accent)}
  .p-bulls  {--p:var(--bulls);  --ink:#B0271E;--mark:var(--cream);--on:var(--cream);--plate:var(--bulls);  --plate-ink:var(--cream);--plate-edge:var(--cream);--btn:var(--bulls);  --btn-ink:var(--cream);--focus-on:var(--cream)}
  .p-curlews{--p:var(--curlews);--ink:#2A6E38;--mark:var(--cream);--on:var(--cream);--plate:var(--curlews);--plate-ink:var(--cream);--plate-edge:var(--cream);--btn:var(--curlews);--btn-ink:var(--cream);--focus-on:var(--cream)}
  .p-ravens {--p:var(--ravens); --ink:#000000;--mark:var(--cream);--on:var(--cream);--plate:var(--ravens); --plate-ink:var(--cream);--plate-edge:var(--cream);--btn:var(--ravens); --btn-ink:var(--cream);--focus-on:var(--cream)}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;min-height:100dvh;
    background:var(--cream);color:var(--navy);
    font-family:var(--text);font-synthesis:none;
    -webkit-font-smoothing:antialiased;
  }
  /* Arabic runs about two sizes up and taller, in Cairo throughout. */
  html[lang="ar"] body{font-family:"Cairo","Galano",system-ui,sans-serif;line-height:1.6}
  html[lang="ar"] .disp{font-family:"Cairo",sans-serif;font-weight:800;line-height:1.3;letter-spacing:0}
  html[lang="ar"] .cap{letter-spacing:0;text-transform:none;font-size:14px;font-weight:800}
  /* The pull-to-refresh gesture is ours on the wall. Without this the
     browser's own one reloads the page and lands you back on the intro,
     because a screen here is a render and not a URL. */
  body.s-wall{overscroll-behavior-y:contain}
  body.g-sky{background:var(--sky)}
  body.g-navy{background:var(--navy)}
  button,input,select{font:inherit;color:inherit}
  img,svg{display:block}
  /* The UA's [hidden] rule loses to anything that sets display, and plenty
     here does, so the switches need this to actually hide what they hide. */
  [hidden]{display:none !important}
  :focus-visible{outline:3px solid var(--red);outline-offset:3px}
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .screen{flex:1;display:flex;flex-direction:column;position:relative;width:100%;animation:fadeup .25s ease both}
  @keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

  .cap{font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
  .disp{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.98;letter-spacing:.01em}
  .vh{position:absolute !important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  /* Arrows point the way the reading goes. */
  html[dir="rtl"] .flipx{transform:scaleX(-1)}

  /* The patrol marks are one <symbol> each, coloured by currentColor. */
  .mark{fill:currentColor}
  .mark.outline{fill:none;stroke:currentColor;stroke-width:15;stroke-linejoin:round}

  /* ============================================================
     CONTROLS
     ============================================================ */
  /* Top bar: back, where you are, language. Three columns with equal outer
     tracks, so the middle stays centred when either end is missing. */
  .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;position:relative;z-index:4}
  .bar > :first-child{justify-self:start}
  .bar > :last-child{justify-self:end}
  .bar .cap{text-align:center}

  .sq{
    display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;padding:0;cursor:pointer;
    border:3px solid var(--navy);background:transparent;color:var(--navy);
  }
  .langwrap{position:relative}
  .lang{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:44px;min-width:44px;padding:0 12px;cursor:pointer;border:0;
    background:var(--navy);color:var(--cream);
    font-weight:900;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
  }
  .langmenu{
    position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:30;
    min-width:190px;padding:4px;background:var(--white);border:3px solid var(--navy);
    display:flex;flex-direction:column;gap:2px;
  }
  .langmenu button{
    min-height:44px;padding:8px 12px;border:0;background:none;cursor:pointer;
    color:var(--navy);font-weight:800;font-size:16px;text-align:start;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .langmenu button[aria-checked="true"]{background:var(--navy);color:var(--cream)}
  .langmenu .draft{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:1}
  .langmenu button[lang="ar"]{font-family:"Cairo",sans-serif}
  .draftbar{
    background:var(--white);color:var(--navy);border-bottom:3px dashed var(--red);
    font-size:12px;font-weight:800;text-align:center;padding:6px 12px;
    font-family:"Galano",system-ui,sans-serif;
  }

  /* Pennant button. The notch is a pseudo-element painted the colour of the
     ground behind it, so the focus outline is not clipped the way a
     clip-path on the button itself would clip it. */
  .pen{
    position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;min-height:60px;padding:10px 34px 10px 18px;cursor:pointer;border:0;
    background:var(--navy);color:var(--cream);text-decoration:none;
    font-weight:900;font-size:18px;letter-spacing:.04em;text-transform:uppercase;text-align:center;
  }
  .pen::after{content:"";position:absolute;right:0;top:0;bottom:0;width:16px;background:var(--ground);clip-path:polygon(100% 0,0 50%,100% 100%)}
  html[dir="rtl"] .pen{padding:10px 18px 10px 34px}
  html[dir="rtl"] .pen::after{right:auto;left:0;clip-path:polygon(0 0,100% 50%,0 100%)}
  .pen-cream{background:var(--cream);color:var(--navy)}
  .pen-out{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 3px var(--navy);padding:10px 18px}
  .pen-out::after{display:none}
  html[dir="rtl"] .pen-out{padding:10px 18px}
  .pen:disabled{cursor:wait;opacity:1}

  .out{
    display:flex;align-items:center;justify-content:center;gap:8px;flex:1;
    min-height:52px;padding:8px 10px;cursor:pointer;text-decoration:none;text-align:center;
    border:3px solid var(--navy);background:transparent;color:var(--navy);
    font-weight:900;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  }
  .row2{display:flex;gap:10px}
  .btnp{
    display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
    min-height:62px;padding:10px 16px;cursor:pointer;
    background:var(--btn);color:var(--btn-ink);border:3px solid var(--btn);
    font-weight:900;font-size:20px;letter-spacing:.03em;text-transform:uppercase;
  }
  .box{border:3px solid var(--navy);padding:16px;background:var(--white)}
  html[lang="ar"] .pen,html[lang="ar"] .out,html[lang="ar"] .btnp,html[lang="ar"] .lang{letter-spacing:0;text-transform:none}

  /* Swatches. Wolves keeps its yellow border even this small, or the key
     shows two Ravens. */
  .sw{width:14px;height:14px;flex:none;background:var(--p)}
  .sw.p-wolves{border:3px solid var(--wolves-accent)}

  /* The swallowtail knot, drawn as it was worn: Wolves split yellow and
     black down the notch, one tail each. */
  .knot{width:18px;height:27px;flex:none}

  .toast{
    position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:40;max-width:min(26rem,calc(100vw - 32px));padding:12px 16px;
    background:var(--navy);color:var(--cream);font-weight:700;font-size:15px;line-height:1.4;text-align:center;
    box-shadow:0 6px 0 rgba(27,53,121,.18);
  }
  .toast.bad{background:var(--red-ink)}

  /* ============================================================
     INTRO
     ============================================================ */
  .mast{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(14px + env(safe-area-inset-top)) 20px 14px;background:var(--white);
  }
  /* The Poland 2027 lockup lives on this white bar: a clean light ground,
     never rotated, recoloured or crowded. */
  .lockup{height:44px;width:auto}
  .mast nav{display:flex;align-items:center;gap:16px}
  .walllink{display:none;align-items:center;min-height:44px;padding:0 4px;background:none;border:0;cursor:pointer;color:var(--navy);font-weight:900;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
  .introgrid{display:flex;flex-direction:column;position:relative;flex:1}
  /* The heading and the two choices share one navy block, and it stretches
     to the room the screen has so the choices sit low, near the thumb. There
     are no patrol tiles here: four coloured squares read as four buttons, and
     the only thing to press on this screen is a question set. */
  .ihero{
    flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;
    background:var(--navy);color:var(--cream);--ground:var(--navy);
    padding:26px 20px 50px;clip-path:polygon(0 0,100% 0,100% 100%,0 calc(100% - 26px));
  }
  html[dir="rtl"] .ihero{clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),0 100%)}
  .ihero :focus-visible{outline-color:var(--cream)}
  .icol{display:flex;flex-direction:column;flex:1;width:100%;max-width:560px;margin:0 auto;position:relative;z-index:1}
  .ihero .kick{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
  .ihero h1{margin:8px 0 0;font-size:clamp(40px,12.8vw,50px);color:var(--cream)}
  .ihero .lede{margin:12px 0 0;font-size:17px;line-height:1.4;font-weight:700;max-width:320px}
  .ihero .friend{margin:14px 0 0;font-size:15px;line-height:1.4;font-weight:700;padding:10px 12px;border:3px solid var(--cream);max-width:340px}
  html[lang="ar"] .ihero h1{font-size:44px;line-height:1.25}

  .pick{margin-top:auto;padding-top:36px;display:flex;flex-direction:column;gap:12px}
  .pick .cap{color:var(--cream)}
  .pick .pen{min-height:72px;padding:10px 40px 10px 18px;font-size:22px;justify-content:flex-start;gap:12px;letter-spacing:.02em;text-align:start;background:var(--cream);color:var(--navy)}
  .pick .pen::after{width:18px}
  html[dir="rtl"] .pick .pen{padding:10px 18px 10px 40px}
  .pick .yr{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:44px;padding:0 8px;background:var(--navy);color:var(--cream);font-size:15px;font-weight:900;flex:none}
  .pick .pen-sky{background:var(--sky)}
  .pick .same{margin:2px 0 0;font-size:14px;font-weight:700;color:var(--cream)}
  .wallrow{padding:20px 20px 0}
  .wallrow .pen{font-size:18px}

  .ifoot{
    margin-top:auto;padding:26px 20px calc(24px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:14px;
  }
  /* The fleur stays 38px or more. */
  .fleur{width:44px;height:auto;flex:none}
  .ifoot .where{flex:1;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;line-height:1.5}
  .ifoot .where .sep{display:none}
  .ifoot .big{font-family:var(--display);font-size:34px;line-height:1;color:var(--red)}

  /* ============================================================
     QUESTIONS
     The two sets are one template on two grounds: cream paper with a
     ghosted 1907, sky blue with a ghosted 2027.
     ============================================================ */
  .quiz{
    min-height:100vh;min-height:100dvh;overflow:hidden;
    padding:calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  }
  .quiz.set-1907{background:var(--cream)}
  .quiz.set-today{background:var(--sky);--ground:var(--sky)}
  .qin{display:flex;flex-direction:column;flex:1;width:100%;max-width:620px;margin:0 auto;position:relative}
  .ghost{
    position:absolute;right:-14px;bottom:-70px;z-index:0;pointer-events:none;user-select:none;
    font-size:220px;line-height:1;font-weight:900;letter-spacing:-.04em;
    color:var(--paper-ghost);direction:ltr;font-family:"Galano",sans-serif;
  }
  /* Drawn from CSS rather than written as text: it is decoration, not
     something to read, so it should not be read as low-contrast text. */
  .ghost::before{content:attr(data-g)}
  .set-today .ghost{color:var(--sky-ghost)}
  html[dir="rtl"] .ghost{right:auto;left:-14px}
  .flags{display:flex;justify-content:space-between;margin-top:24px;position:relative}
  .flag{
    width:36px;height:44px;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);
    display:flex;align-items:flex-start;justify-content:center;padding-top:6px;
    font-size:16px;font-weight:900;background:var(--rule);color:var(--navy);
    font-family:"Galano",sans-serif;
  }
  .set-today .flag{background:var(--white)}
  .flag.on{background:var(--navy);color:var(--cream)}
  .prompt{margin:28px 0 0;font-size:30px;line-height:1.15;font-weight:900;position:relative}
  html[lang="ar"] .prompt{font-size:32px;line-height:1.45}
  .opts{display:flex;flex-direction:column;gap:12px;margin-top:24px;position:relative}
  /* Answers are navy and white only. No patrol colour, animal or knot ever
     goes near one: the answers are recorded to check the quiz for bias. */
  .ans{
    display:flex;align-items:stretch;width:100%;min-height:64px;margin:0;padding:0;cursor:pointer;
    border:3px solid var(--navy);background:var(--white);color:var(--navy);
    font-weight:700;font-size:17px;line-height:1.35;text-align:start;
  }
  html[lang="ar"] .ans{font-size:18px;line-height:1.55}
  .ans .n{display:flex;align-items:center;justify-content:center;width:44px;flex:none;background:var(--navy);color:var(--cream);font-size:20px;font-weight:900;font-family:"Galano",sans-serif}
  .ans .t{display:flex;align-items:center;padding:12px 14px;flex:1}
  .ans.picked{background:var(--navy);color:var(--cream)}
  .ans.picked .n{background:var(--cream);color:var(--navy)}
  @media (hover:hover){ .ans:hover{box-shadow:inset 0 0 0 2px var(--navy)} }
  .qcount{margin-top:auto;padding-top:20px;position:relative}

  /* ============================================================
     THE REVEAL
     Navy, so it gives nothing away. The four marks flick through,
     the ring fills, then the result cuts in.
     ============================================================ */
  .reveal{
    min-height:100vh;min-height:100dvh;overflow:hidden;background:var(--navy);color:var(--cream);
    padding:calc(16px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  }
  .reveal .ghost{color:var(--navy-ghost)}
  .reveal .flag{background:var(--cream)}
  .reveal .bar{display:flex;justify-content:center}
  .rv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;position:relative}
  .ring{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center}
  .ring svg.r{position:absolute;inset:0;width:220px;height:220px}
  .ring .fill{transition:stroke-dashoffset 2s linear}
  .ring .mark{width:130px;height:122px}
  .rv .row{display:flex;gap:18px;align-items:center}
  .rv .row .mark{width:64px;height:60px}
  .rv h1{margin:0;font-size:36px;text-align:center;color:var(--cream)}
  .reveal .foot{margin:0;text-align:center;position:relative}

  /* ============================================================
     RESULT
     ============================================================ */
  .result{background:var(--p);overflow:hidden}
  /* Wolves' yellow frame goes round the whole screen. */
  .result.p-wolves::after{
    content:"";position:absolute;inset:0;z-index:6;pointer-events:none;
    box-shadow:inset 0 0 0 8px var(--wolves-accent);
  }
  .rhero{position:relative;z-index:2;height:430px;padding:calc(24px + env(safe-area-inset-top)) 28px 0;color:var(--on)}
  .rin{position:relative;height:100%;max-width:560px;margin:0 auto}
  .rhero .mark{position:absolute;color:var(--mark);width:330px;height:310px;top:62px;left:-48px}
  .p-bulls .rhero .mark{left:-20px;top:78px}
  .p-curlews .rhero .mark{left:-18px;top:66px}
  .p-ravens .rhero .mark{left:-24px;top:70px}
  html[dir="rtl"] .rhero .mark{left:auto;right:-48px;transform:scaleX(-1)}
  .rbar{display:flex;align-items:center;justify-content:space-between;position:relative}
  .rbar .where{display:flex;align-items:center;gap:10px}
  .rhero :focus-visible{outline-color:var(--focus-on)}
  .rhero .lang{background:transparent;color:var(--cream);border:3px solid var(--cream)}
  .plate{
    position:absolute;left:0;bottom:-34px;margin:0;z-index:3;
    background:var(--plate);color:var(--plate-ink);border:3px solid var(--plate-edge);
    font-family:var(--display);font-weight:400;font-size:44px;line-height:1;text-transform:uppercase;
    padding:10px 16px;transform:rotate(-3deg);letter-spacing:.01em;white-space:pre-line;max-width:calc(100vw - 56px);
  }
  html[dir="rtl"] .plate{left:auto;right:0;transform:rotate(3deg)}
  html[lang="ar"] .plate{font-family:"Cairo",sans-serif;font-weight:800;line-height:1.3;letter-spacing:0;font-size:40px}
  .rpanel{
    position:relative;z-index:1;flex:1;display:flex;flex-direction:column;
    margin-top:-44px;padding:88px 28px calc(36px + env(safe-area-inset-bottom));
    background:var(--cream);clip-path:polygon(0 44px,100% 0,100% 100%,0 100%);
  }
  html[dir="rtl"] .rpanel{clip-path:polygon(0 0,100% 44px,100% 100%,0 100%)}
  .pin{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
  .tagline{margin:0;font-size:20px;font-weight:700}
  .traits{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tr{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;background:var(--navy);color:var(--cream);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  html[lang="ar"] .tr{letter-spacing:0;font-size:14px}
  .roster{margin-top:22px}
  .roster .cap{color:var(--ink)}
  .roster p{margin:8px 0 0;font-size:17px;line-height:1.4;font-weight:700}
  .roster strong{font-weight:900}
  .roster .lead{color:var(--ink);font-size:11px;margin-inline-start:4px}
  .roster .fact{margin:10px 0 0;font-size:14px;line-height:1.4;font-weight:700;color:var(--ink-soft)}
  .tally{margin-top:12px}
  .tally .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .tally .n{font-size:13px;font-weight:900;white-space:nowrap}
  .tally .wait{font-size:12px;font-weight:800;color:var(--ink-muted);white-space:nowrap}
  .tbar{display:flex;height:22px;margin-top:12px;gap:3px}
  .tbar i{display:block;background:var(--p);min-width:3px}
  .tbar i.p-wolves{box-shadow:inset 0 0 0 3px var(--wolves-accent)}
  .tbar.empty{border:3px dashed var(--rule);gap:0}
  .legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-top:12px}
  .leg{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800}
  .leg.me span:last-child{text-decoration:underline;text-underline-offset:3px}
  .keep{margin:10px 0 0;font-size:13px;line-height:1.4;font-weight:700;color:var(--ink-soft)}
  .rpanel .btnp{margin-top:20px}
  .rpanel .row2{margin-top:10px}
  .honest{margin:22px 0 0;font-size:13px;line-height:1.45;font-weight:700;text-align:center}

  /* ============================================================
     CARD STUDIO
     ============================================================ */
  .studio,.wall{padding:calc(16px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}
  .col{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;flex:1}
  .stitle{margin:22px 0 0;font-size:38px}
  .stagewrap{position:relative;margin:16px auto 0;width:300px;max-width:100%}
  .stagewrap canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
  .stagewrap canvas.dragging{cursor:grabbing}
  .stagewrap:focus-within{outline:3px solid var(--red);outline-offset:3px}
  .stagewrap canvas:focus{outline:none}
  .hint{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:12px;font-size:13px;font-weight:700;text-align:center;flex-wrap:wrap}
  .hint span{display:inline-flex;align-items:center;gap:6px}
  .shapes{display:flex;gap:8px;margin-top:18px}
  .shape{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;flex:1;
    min-height:64px;padding:8px 4px;cursor:pointer;
    border:3px solid var(--navy);background:var(--white);color:var(--navy);
    font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  }
  .shape[aria-pressed="true"]{background:var(--navy);color:var(--cream)}
  html[lang="ar"] .shape{letter-spacing:0;font-size:14px}
  .photorow{display:flex;gap:8px;margin-top:12px}
  .filebtn{position:relative}
  .filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  .filebtn:focus-within{outline:3px solid var(--red);outline-offset:3px}
  .privacy{margin-top:14px;display:flex;gap:12px;align-items:flex-start}
  .privacy p{margin:0;font-size:15px;line-height:1.4;font-weight:700}
  .privacy b{color:var(--green-ink);font-weight:700}
  .studio .pen#saveBtn{margin-top:18px}
  .studio .out.wide{margin-top:10px;min-height:56px;width:100%;flex:none}
  .joinwall{
    margin-top:32px;padding:30px 20px 24px;background:var(--navy);color:var(--cream);--ground:var(--navy);
    clip-path:polygon(0 18px,100% 0,100% 100%,0 100%);
  }
  html[dir="rtl"] .joinwall{clip-path:polygon(0 0,100% 18px,100% 100%,0 100%)}
  .joinwall :focus-visible{outline-color:var(--cream)}
  .joinwall h2{margin:8px 0 0;font-size:34px;color:var(--cream)}
  .joinwall .lede{margin:10px 0 0;font-size:16px;line-height:1.4;font-weight:700}
  .facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;margin-top:18px}
  .facts div{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;line-height:1.3}
  .facts svg{flex:none}
  .consent{display:flex;align-items:center;gap:12px;margin-top:20px;min-height:44px;cursor:pointer;font-size:15px;font-weight:700}
  .consent input{width:26px;height:26px;margin:0;flex:none;accent-color:var(--cream)}
  .joinwall .pen{margin-top:14px}
  .joinwall .done{margin:16px 0 0;font-size:16px;line-height:1.45;font-weight:700}
  .studio .row2.end{margin-top:20px}

  /* ============================================================
     PATROL WALL (phone)
     ============================================================ */
  .wall h1{margin:22px 0 0;font-size:40px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 14px;cursor:pointer;white-space:nowrap;
    border:3px solid var(--navy);background:var(--white);color:var(--navy);
    font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  }
  .chip[aria-pressed="true"]{background:var(--navy);color:var(--cream)}
  .chip .sw{width:12px;height:12px}
  html[lang="ar"] .chip{letter-spacing:0;font-size:15px}
  .wstatus{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
  .wstatus span{font-size:13px;font-weight:700}
  .wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
  .wcard{position:relative;margin:0;aspect-ratio:1/1;background:var(--rule);overflow:hidden}
  .wcard img{width:100%;height:100%;object-fit:cover;display:block}
  /* The report control is a full 44px square, not a pill sized to a word. */
  .rep{position:absolute;top:8px;inset-inline-start:8px;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:0;cursor:pointer;background:var(--cream);color:var(--navy)}
  .rep:focus-visible{outline-offset:2px}
  .wempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:3px dashed var(--rule);margin-top:18px;padding:24px;min-height:300px}
  .wempty .row{display:flex;gap:14px}
  .wempty .mark{width:56px;height:52px;color:var(--navy)}
  .wempty h2{margin:22px 0 0;font-size:32px}
  .wempty p{margin:10px 0 0;font-size:16px;line-height:1.4;font-weight:700}
  .wnote{margin:16px 0 0;font-size:13px;line-height:1.4;font-weight:700;text-align:center}
  .wall .pen.find{margin-top:18px}
  /* The pull moves the wrapper, never .screen: .screen carries a filled
     animation, and a filled animation beats an inline transform. */
  .pullwrap{display:flex;flex-direction:column;flex:1}
  .pullwrap.snap{transition:transform .24s ease}
  .ptr{position:fixed;left:0;right:0;top:0;z-index:20;height:0;overflow:hidden;opacity:0;display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:800;color:var(--navy);pointer-events:none}
  .ptr i{width:18px;height:18px;border:3px solid currentColor;border-top-color:transparent;border-radius:50%}
  .ptr.spin i{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ============================================================
     WIDER SCREENS
     ============================================================ */
  /* From tablet up the thumb is no longer the point, so the column centres
     in the navy instead of pinning the choices to the bottom. */
  @media (min-width:600px){
    .ihero{justify-content:center;padding:56px 40px 88px}
    .icol{flex:none}
    .ihero h1{font-size:60px;max-width:7em}
    html[lang="ar"] .ihero h1{font-size:56px;max-width:none}
    .pick{margin-top:0;padding-top:40px}
  }
  @media (min-width:960px){
    .walllink{display:inline-flex}
    .mast{padding-left:40px;padding-right:40px}
    /* One navy panel, the column centred in it: the heading sits over the
       buttons, which are what the eye is aiming at. */
    .ihero{padding:64px 48px 96px;justify-content:center;clip-path:polygon(0 0,100% 0,100% 100%,0 calc(100% - 44px))}
    html[dir="rtl"] .ihero{clip-path:polygon(0 0,100% 0,100% calc(100% - 44px),0 100%)}
    .icol{flex:none;max-width:640px}
    /* "WHICH PATROL" on the first line, "ARE YOU?" on the second. */
    .ihero h1{font-size:72px;max-width:7em}
    html[lang="ar"] .ihero h1{font-size:64px}
    .ihero .lede{font-size:19px;max-width:460px}
    .pick{margin-top:0;padding-top:44px}
    .wallrow{display:none}
    .ifoot{padding:16px 40px}
    .ifoot .where br{display:none}
    .ifoot .where .sep{display:inline}
    .rhero{height:470px}
    .rhero .mark{width:360px;height:338px}
    .wgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
    .wall .col{max-width:1040px}
    .ghost{font-size:340px;bottom:-110px}
  }
  /* A short laptop window. Must stay after the (min-width:960px) block:
     these queries are one class deep and win on source order. */
  @media (min-width:960px) and (max-height:780px){
    .ihero{padding:32px 48px 64px}
    .ihero h1{font-size:60px}
    .ihero .lede{margin-top:8px}
    .pick{padding-top:26px;gap:10px}
    .pick .pen{min-height:64px}
  }
  @media (max-width:359px){
    .ihero h1{font-size:40px}
    .pick .pen{font-size:19px}
    .flag{width:32px;height:40px}
    .prompt{font-size:26px}
    .plate{font-size:38px}
    .facts{grid-template-columns:1fr}
  }

</style>

<body>
<div id="app" aria-live="polite"></div>
<script>
/* ============================================================
   LANGUAGES
   English is the source. All five are switched on (Stuart, 25 Oct
   2026). French, Polish, Spanish and Arabic were drafted in session:
   no native speaker has read them yet, and the water question in
   each has not been through the Safety Team. A correction is a
   string edit here, nothing more.

   A language only appears in the menu once `ready` is true. Set it
   false and the language drops out of the menu and is reachable by
   link alone (?lang=pl), with a banner that says it is a draft.

   Every string falls back to English, so a gap shows English rather
   than a blank.
   ============================================================ */

   behind each option, with the same weight, in the same order, in
   both: a Wolf in 1907 is a Wolf today, by construction. That is the
   argument the site makes. The words live in STR, per language.

   Question 6 is the Safety Team's water question. It is one entry,
   shared by both sets, because two copies is how one of them
   eventually gets edited.
   ============================================================ */
const PATTERN = [
  {weight:2, ps:["ravens","bulls","curlews","wolves"]},
  {weight:1, ps:["bulls","curlews","wolves","ravens"]},
  {weight:1, ps:["wolves","ravens","bulls","curlews"]},
  {weight:1, ps:["curlews","bulls","wolves","ravens"]},
  {weight:1, ps:["wolves","curlews","ravens","bulls"]},
  {weight:1, ps:["bulls","ravens","wolves","curlews"], water:true},
  {weight:1, ps:["ravens","wolves","curlews","bulls"]}
];

  bulls:  {leader:"Thomas Evans-Lombe", others:["Arthur Primmer","Bert Blandford","James Rodney","Marc Noble"]},
  curlews:{leader:"George Rodney",      others:["Bertie Watts","Alan Vivian","Terry Bonfield","Richard Grant"], probably:"Simon Rodney"},
  ravens: {leader:"Herbert Emley",      others:["Bert Tarrant","William Rodney","Collingbourne","Humphrey Noble"]}

function langInfo(code){ return LANGS.find(l => l.code === (code || lang)) || LANGS[0]; }

function initLang(q){
  const asked = q.get("lang");
  if(asked && STR[asked]){
    lang = asked;
    if(!langInfo(asked).ready) previewLangs = true;
  }else{
    let saved = null;
    try{ saved = localStorage.getItem("pf.lang"); }catch(_){}
    const ready = LANGS.filter(l => l.ready).map(l => l.code);
    if(saved && ready.includes(saved)) lang = saved;
    else{
      const wanted = (navigator.languages || [navigator.language || "en"]).map(s => String(s).slice(0, 2).toLowerCase());
      lang = wanted.find(c => ready.includes(c)) || "en";
    }
  }
  applyLang();
}

function applyLang(){
  const L = langInfo();
  document.documentElement.lang = L.code;
  document.documentElement.dir = L.rtl ? "rtl" : "ltr";
  let bar = document.getElementById("draftbar");
  if(!L.ready){
    if(!bar){
      bar = document.createElement("div");
      bar.id = "draftbar";
      bar.className = "draftbar";
      bar.lang = "en";
      bar.dir = "ltr";
      document.body.insertBefore(bar, app);
    }
    bar.textContent = STR.en.draft + " · " + L.name;
  }else if(bar){ bar.remove(); }

}

function fill(s, vars){
  return String(s).replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars) ? vars[k] : m);
}
/* Every string falls back to English, so a gap shows English, not a blank. */
function t(key, vars){
  const own = STR[lang] && STR[lang][key];
  return fill(own != null ? own : (STR.en[key] != null ? STR.en[key] : key), vars);
}
function tp(key, n, vars){
  const forms = (STR[lang] && STR[lang][key]) || STR.en[key];
  let cat = "other";
  try{ cat = new Intl.PluralRules(langInfo().locale).select(n); }catch(_){}
  return fill(forms[cat] || forms.other, Object.assign({n: fmtNum(n)}, vars));
}
function P(id){
  const own = STR[lang] && STR[lang].patrols && STR[lang].patrols[id];
  return Object.assign({}, STR.en.patrols[id], own || {});
}
function qText(set, i){
  const L = STR[lang] || {};
  if(PATTERN[i].water) return L.water || STR.en.water;
  return (L.sets && L.sets[set] && L.sets[set][i]) || STR.en.sets[set][i];
}
function fmtNum(n){
  try{ return new Intl.NumberFormat(langInfo().locale).format(n); }catch(_){ return String(n); }
}
function fmtPct(p){
  try{ return new Intl.NumberFormat(langInfo().locale, {style:"percent", maximumFractionDigits:0}).format(p/100); }
  catch(_){ return Math.round(p) + "%"; }
}
function upper(s){
  try{ return String(s).toLocaleUpperCase(langInfo().locale.slice(0, 2)); }catch(_){ return String(s).toUpperCase(); }
}

/* ============================================================

function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function apiUrl(path){
  return API_BASE ? API_BASE.replace(/\/+$/, "") + path : "";

/* A screen change is a new page, not a scroll. Every render calls this first,
   or you tap through from the foot of a long result and land halfway down. */
function toTop(){

function setBody(cls, bg){

function toast(msg, bad){
  const old = document.querySelector(".toast");
  if(old) old.remove();
  const el = document.createElement("p");
  el.className = "toast" + (bad ? " bad" : "");
  el.setAttribute("role", "status");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 6000 : 4000);
}
function shuffle(a){
  const arr = a.slice();
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* Cards come down seven days after the event ends. That promise is made to
   people before they upload, so the date is computed, never typed. */
function purgeDate(){
  const d = new Date(REUNION_ENDS + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + 7);
  return d;
}
function purgeDateText(){
  try{ return purgeDate().toLocaleDateString(langInfo().locale, {day:"numeric", month:"long", year:"numeric", timeZone:"UTC"}); }
  catch(_){ return purgeDate().toISOString().slice(0, 10); }
}

/* ============================================================
   FEATURE SWITCHES
   The team can turn the wall, uploads or the card studio off from
   the console mid-event, and turn human checking on. Everything
   defaults to on so an unreachable API never blanks the app, and
   the last known answer is remembered so a phone with no signal
   shows what it last knew.
   ============================================================ */
const FLAGS = {wall:true, uploads:true, cards:true, moderate:false};

try{
  const saved = JSON.parse(localStorage.getItem("pf.flags") || "null");
  if(saved && typeof saved === "object"){
    ["wall","uploads","cards","moderate"].forEach(k => { if(k in saved) FLAGS[k] = !!saved[k]; });
  }
}catch(_){ /* private browsing, or nothing stored yet */ }

/* Hides anything marked with the switch it depends on. Called after every
   render, and again when the API answers. */
function applyFlags(){
  document.querySelectorAll("[data-needs]").forEach(el => {
    el.hidden = !el.dataset.needs.split(" ").every(k => FLAGS[k] !== false);
  });
  const up = document.getElementById("factUp");
  if(up) up.textContent = t(FLAGS.moderate ? "j.checked" : "j.up");
}

async function loadFlags(){
  if(!apiUrl("")) return FLAGS;
  try{
    const res = await fetch(apiUrl("/config"), {headers:{"Accept":"application/json"}});
    if(!res.ok) throw new Error("config");
    const data = await res.json();
    ["wall","uploads","cards","moderate"].forEach(k => { if(k in data) FLAGS[k] = !!data[k]; });
    try{ localStorage.setItem("pf.flags", JSON.stringify(FLAGS)); }catch(_){}
    applyFlags();
    /* If the wall went off while someone is standing on it, take them off it. */
    if(FLAGS.wall === false && document.querySelector(".s-wall")) renderIntro();
    if(FLAGS.cards === false && document.querySelector(".s-studio")) renderIntro();
  }catch(_){ /* keep what we had: an unreachable API is not a reason to hide things */ }
  return FLAGS;
}

/* ============================================================
   PATROL TALLY
   A count of outcomes. Drawn only from real numbers: until the API
   answers, the bar is an empty outline that says it is waiting.
   Never a guessed number, never a zero standing in for one.
   ============================================================ */
let tallyData = null;
let tallyCounted = false;

async function loadTally(){
  if(!apiUrl("")) return null;
  try{
    const res = await fetch(apiUrl("/tally"), {headers:{"Accept":"application/json"}});
    if(!res.ok) throw new Error("tally");
    const data = await res.json();
    if(data && typeof data === "object") tallyData = data;
    return tallyData;
  }catch(_){ return null; }
}

/* One count per finished quiz: the seven answers, the four scores, any
   tie-break, the question set and the language. Nothing about the person.
   The set matters because question three in 1907 is a different question
   from question three today; the language matters for the same reason. */
async function recordOutcome(id, detail){
  if(tallyCounted) return;
  tallyCounted = true;
  if(!apiUrl("")) return;
  try{
    const body = {patrol:id, era:era, lang:lang};
    if(detail){
      body.answers = detail.answers;
      body.scores = detail.totals;
      body.tied = detail.tied && detail.tied.length > 1 ? detail.tied : undefined;
    }
    const res = await fetch(apiUrl("/tally"), {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });
    if(res.ok){
      const data = await res.json().catch(() => null);
      if(data && typeof data === "object") tallyData = data;
      if(view && view.fn === renderResult) paintTally(view.args[0]);
    }
  }catch(_){ /* offline at the campsite is normal; the count is not worth a fuss */ }
}

function tallyTotal(){
  if(!tallyData) return 0;
  return PATROL_IDS.reduce((n, p) => n + (Number(tallyData[p]) || 0), 0);
}

function paintTally(mine){
  const host = document.getElementById("tally");
  if(!host) return;
  const total = tallyTotal();
  const live = total > 0;
  const segs = PATROL_IDS.map(p => {
    const n = live ? (Number(tallyData[p]) || 0) : 0;
    return {p, n, pct: live ? n / total * 100 : 0};
  });
  host.innerHTML = `
    <div class="head"><span class="cap">${esc(t("r.split"))}</span>${live
      ? `<span class="n">${esc(t("r.sofar", {n: fmtNum(total)}))}</span>`
      : `<span class="wait">${esc(t("r.wait"))}</span>`}</div>
    ${live
      ? `<div class="tbar" role="img" aria-label="${esc(segs.map(s => P(s.p).name + " " + fmtPct(s.pct)).join(", "))}">${segs.filter(s => s.n).map(s => `<i class="p-${s.p}" style="flex:${s.n} 1 0"></i>`).join("")}</div>`
      : `<div class="tbar empty" aria-hidden="true"></div>`}
    <div class="legend">${segs.map(s => `<div class="leg${s.p === mine ? " me" : ""}"><span class="sw p-${s.p}"></span><span>${esc(P(s.p).name)}${live ? " " + esc(fmtPct(s.pct)) : ""}</span></div>`).join("")}</div>
    <p class="keep">${esc(t("r.keep"))}</p>`;
}

/* ============================================================
   QUIZ FLOW
   ============================================================ */
function startQuiz(set){
  era = SETS.includes(set) ? set : "1907";
  current = 0;
  answers = [];
  finished = null;
  tallyCounted = false;
  shuffled = PATTERN.map(() => shuffle([0, 1, 2, 3]));
  renderQuestion();
}

function pick(btn, oi){
  if(locked) return;
  locked = true;
  btn.classList.add("picked");
  btn.setAttribute("aria-pressed", "true");
  btn.querySelector(".n").innerHTML = ICON.check;
  answers[current] = PATTERN[current].ps[oi];
  setTimeout(() => {
    locked = false;
    current++;
    if(current < PATTERN.length) renderQuestion();
    else renderReveal();
  }, 220);
}

function goBack(){
  if(locked) return;
  if(current === 0){ renderIntro(); return; }
  current--;
  answers.length = current;
  renderQuestion();
}

/* Returns the working, not just the answer: the four scores and whether a tie
   had to be broken, so the quiz can be checked for bias later. */
function scoreDetail(){
  const totals = {wolves:0, bulls:0, curlews:0, ravens:0};
  answers.forEach((p, i) => { totals[p] += PATTERN[i].weight; });
  const max = Math.max(...Object.values(totals));
  const tied = Object.keys(totals).filter(p => totals[p] === max);
  let patrol = tied[0];
  if(tied.length > 1){
    if(tied.includes(answers[0])) patrol = answers[0];
    else for(const p of answers){ if(tied.includes(p)){ patrol = p; break; } }
  }
  return {patrol, totals, tied};
}
function scoreResult(){ return scoreDetail().patrol; }

/* ============================================================
   CARD DRAWING
   Drawn in the browser from flat shapes, type, one patrol mark and
   the photo. Every number is a fraction of the frame, so the same
   routine draws the preview and the full-size export.
   ============================================================ */
const ZOOM_MAX = 3;
const FORMATS = {
  profile:{w:1080, h:1080},
  /* Not offered in the studio. Every upload is rendered in this one shape so
     the wall is one design rather than three cropped square. */
  wall:   {w:1080, h:1080, wall:true},
  post:   {w:1080, h:1350},
  story:  {w:1080, h:1920}
};
const CARD_FONT_DISPLAY = '"Bravely","Cairo",sans-serif';
const CARD_FONT_TEXT = '"Galano","Cairo",system-ui,sans-serif';

/* The cards use the page's own fonts, which load lazily. Drawing before they
   arrive sets the type in a fallback that then sticks to the export. */
const cardFontsReady = (async () => {
  try{
    await Promise.all(["400 80px Bravely", "900 40px Galano", "700 40px Galano", "800 40px Cairo", "400 40px Cairo"].map(f => document.fonts.load(f)));
  }catch(_){}
})();

const headPaths = {};
function headPath(id){
  return headPaths[id] || (headPaths[id] = new Path2D(HEADS[id].d));
}
/* A patrol mark fitted inside w x h, optionally mirrored for right to left. */
function drawMark(ctx, id, x, y, w, h, colour, mirror){
  const H = HEADS[id];
  const s = Math.min(w / H.w, h / H.h);
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.scale(mirror ? -s : s, s);
  ctx.translate(-H.w / 2, -H.h / 2);
  ctx.fillStyle = colour;
  ctx.fill(headPath(id), "evenodd");
  ctx.restore();
}
function drawKnot(ctx, id, x, y, w){
  const h = w * 1.5, k = w / 24;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k, k);
  if(id === "wolves"){
    ctx.fillStyle = "#F5B01E";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(12, 0); ctx.lineTo(12, 26); ctx.lineTo(0, 36); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#000000"; ctx.strokeStyle = "#F5B01E"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(24, 0); ctx.lineTo(24, 36); ctx.lineTo(12, 26); ctx.closePath(); ctx.fill(); ctx.stroke();
  }else{
    ctx.fillStyle = PATROL_HEX[id]; ctx.strokeStyle = CREAM; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(24, 0); ctx.lineTo(24, 36); ctx.lineTo(12, 26); ctx.lineTo(0, 36); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
  return h;
}

/* Where the photo goes on each card, before its slanted cut. One definition,
   because the drawing and the pan clamp both need it, and they drifted apart
   once when they were separate numbers. The photo is most of the card: the
   patrol colour is a band at the foot, not a flood, so a person in front of
   trees is still the picture rather than a green card with a face in it. */
function photoRegion(fmt, W, H){
  if(fmt === "profile") return {x:0, y:0, w:W, h:H, cut:0, side:"left"};
  if(fmt === "post")    return {x:0, y:0, w:W, h:H*0.80, cut:W*0.07, side:"left"};
  if(fmt === "story")   return {x:0, y:0, w:W, h:H*0.74, cut:W*0.08, side:"left"};
  return {x:0, y:0, w:W, h:H*0.76, cut:W*0.07, side:"left"};
}
/* The y of the photo's slanted bottom edge at x. */
function edgeY(r, x){
  const t = (x - r.x) / r.w;
  return r.side === "left" ? r.y + r.h - r.cut * (1 - t) : r.y + r.h - r.cut * t;
}
function regionPath(ctx, r){
  ctx.beginPath();
  ctx.moveTo(r.x, r.y);
  ctx.lineTo(r.x + r.w, r.y);
  if(r.side === "left"){ ctx.lineTo(r.x + r.w, r.y + r.h); ctx.lineTo(r.x, r.y + r.h - r.cut); }
  else{ ctx.lineTo(r.x + r.w, r.y + r.h - r.cut); ctx.lineTo(r.x, r.y + r.h); }
  ctx.closePath();
}
function drawPhoto(ctx, img, r, st){
  ctx.save();
  regionPath(ctx, r);
  ctx.clip();
  const base = Math.max(r.w / img.width, r.h / img.height);
  const sc = base * st.zoom;
  const dw = img.width * sc, dh = img.height * sc;
  const cx = r.x + r.w / 2 + st.ox * r.w;
  const cy = r.y + r.h / 2 + st.oy * r.h;
  ctx.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh);
  ctx.restore();
}
/* Sets ctx.font, shrinking it until the line fits the space it has. */
function fitFont(ctx, text, maxW, size, weight, family){
  let px = size;
  ctx.font = `${weight} ${px}px ${family}`;
  while(px > size * 0.45 && ctx.measureText(text).width > maxW){
    px -= size * 0.025;
    ctx.font = `${weight} ${px}px ${family}`;
  }
  return px;
}
function spaced(ctx, em){
  if("letterSpacing" in ctx) ctx.letterSpacing = em;
}
/* The fleur, filled in one flat colour: the reversed single-colour mark. */
let fleurImg = null;
const fleurReady = new Promise(res => {
  const im = new Image();
  im.onload = () => { fleurImg = im; res(im); };
  im.onerror = () => res(null);
  im.src = FLEUR;
});
function drawFleur(ctx, cx, cy, h, colour){
  if(!fleurImg) return;
  const w = h * fleurImg.width / fleurImg.height;
  const off = document.createElement("canvas");
  off.width = Math.max(1, Math.round(w)); off.height = Math.max(1, Math.round(h));
  const o = off.getContext("2d");
  o.drawImage(fleurImg, 0, 0, off.width, off.height);
  o.globalCompositeOperation = "source-in";
  o.fillStyle = colour;
  o.fillRect(0, 0, off.width, off.height);
  ctx.drawImage(off, cx - w / 2, cy - h / 2, w, h);
}

function cardText(id){
  const pt = P(id);
  const ar = lang === "ar";
  return {
    ar,
    rtl: !!langInfo().rtl,
    name: ar ? pt.name : upper(pt.name),
    tag: pt.tag,
    sub: ar ? t("c.sub") : upper(t("c.sub")),
    post: ar ? t("c.post") : upper(t("c.post")),
    story: ar ? t("c.story") : upper(t("c.story")),
    display: ar ? '"Cairo",sans-serif' : CARD_FONT_DISPLAY,
    dweight: ar ? 800 : 400
  };
}
/* Text along a baseline, from the start edge of the reading direction. */
function startText(ctx, T, text, x, y, W){
  ctx.direction = T.rtl ? "rtl" : "ltr";
  ctx.textAlign = T.rtl ? "right" : "left";
  ctx.fillText(text, T.rtl ? W - x : x, y);
}
/* Wolves' yellow frame, round the whole card. */
function wolvesFrame(ctx, id, W, H){
  if(!PATROL_ACCENT[id]) return;
  const bw = W * 0.024;
  ctx.save();
  ctx.strokeStyle = PATROL_ACCENT[id];
  ctx.lineWidth = bw;
  ctx.strokeRect(bw / 2, bw / 2, W - bw, H - bw);
  ctx.restore();
}

function drawCard(ctx, W, H, st){
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  ctx.textBaseline = "alphabetic";
  if(st.fmt === "profile") drawProfileCard(ctx, W, H, st);
  else if(st.fmt === "story") drawStoryCard(ctx, W, H, st);
  else if(st.fmt === "wall") drawWallCard(ctx, W, H, st);
  else drawPostCard(ctx, W, H, st);
  ctx.restore();
}

/* The knot and a small-caps caption. Over a photo it sits on a cream plate,
   because the photo could be any colour at all; on the patrol's own colour it
   needs none. x is the start edge, or null to centre the row. */
function captionRow(ctx, T, id, text, x, baseY, W, size, plate){
  const knotW = size * 1.38, gap = size * 0.8;
  ctx.font = `800 ${size}px ${CARD_FONT_TEXT}`;
  spaced(ctx, T.ar ? "0px" : "0.16em");
  const capW = ctx.measureText(text).width, rowW = knotW + gap + capW;
  const left = x === null ? (W - rowW) / 2 : (T.rtl ? W - x - rowW : x);
  const knotTop = baseY - knotW * 1.1;
  if(plate){
    const pad = size * 0.8;
    ctx.fillStyle = CREAM;
    ctx.fillRect(left - pad, knotTop - size * 0.5, rowW + pad * 2, knotW * 1.5 + size);
  }
  drawKnot(ctx, id, T.rtl ? left + capW + gap : left, knotTop, knotW);
  ctx.fillStyle = plate ? NAVY : CREAM;
  ctx.direction = T.rtl ? "rtl" : "ltr";
  ctx.textAlign = "left";
  ctx.fillText(text, T.rtl ? left : left + knotW + gap, baseY);
  spaced(ctx, "0px");
}
/* The ring round the profile circle: the patrol's colour, Wolves' yellow. */
function profileRing(ctx, id, W, H, R){
  ctx.save();
  ctx.strokeStyle = PATROL_ACCENT[id] || PATROL_HEX[id];
  ctx.lineWidth = W * 0.022;
  ctx.beginPath(); ctx.arc(W / 2, H / 2, R - W * 0.011, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
/* The patrol band across the foot of the profile circle, cut on the slant. */
function profileBand(ctx, id, W, H, T){
  const hi = H * 0.705, lo = H * 0.745;
  ctx.fillStyle = PATROL_HEX[id];
  ctx.beginPath();
  ctx.moveTo(0, T.rtl ? lo : hi); ctx.lineTo(W, T.rtl ? hi : lo);
  ctx.lineTo(W, H); ctx.lineTo(0, H);
  ctx.closePath(); ctx.fill();
}

/* Profile, 1080 square, shown as a round avatar: everything important sits
   inside the circle. With a photo, the photo is the whole square and the
   patrol is a ring and a band across the foot of the circle; with none, the
   patrol colour and the mark carry it. */
function drawProfileCard(ctx, W, H, st){
  const id = st.patrol, T = cardText(id), ink = onFlood(id);
  const cx = W / 2, cy = H / 2, R = W * 0.463;
  ctx.fillStyle = PATROL_HEX[id];
  ctx.fillRect(0, 0, W, H);
  if(st.img){
    drawPhoto(ctx, st.img, photoRegion("profile", W, H), st);
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
    profileBand(ctx, id, W, H, T);
    ctx.restore();
    ctx.direction = T.rtl ? "rtl" : "ltr";
    ctx.textAlign = "center";
    ctx.fillStyle = ink;
    fitFont(ctx, T.name, W * 0.56, W * 0.105, T.dweight, T.display);
    ctx.fillText(T.name, cx, H * 0.842);
    ctx.fillStyle = CREAM;
    spaced(ctx, "0.18em");
    fitFont(ctx, T.sub, W * 0.40, W * 0.024, 900, CARD_FONT_TEXT);
    ctx.fillText(T.sub, cx, H * 0.895);
    spaced(ctx, "0px");
  }else{
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
    drawMark(ctx, id, W * 0.30, H * 0.06, W * 0.62, W * 0.62, ink, T.rtl);
    ctx.restore();
    const x = W * 0.167;
    ctx.fillStyle = ink;
    fitFont(ctx, T.name, W * 0.62, W * 0.118, T.dweight, T.display);
    startText(ctx, T, T.name, x, H * 0.724, W);
    ctx.fillStyle = CREAM;
    spaced(ctx, "0.18em");
    fitFont(ctx, T.sub, W * 0.45, W * 0.024, 900, CARD_FONT_TEXT);
    startText(ctx, T, T.sub, x, H * 0.782, W);
    spaced(ctx, "0px");
  }
  if(st.img || PATROL_ACCENT[id]) profileRing(ctx, id, W, H, R);
}

/* Post, 4:5. The photo takes the top 80% with a slanted cut; the patrol band
   below carries the name, one line and the mark cropped off the corner. */
function drawPostCard(ctx, W, H, st){
  const id = st.patrol, T = cardText(id), ink = onFlood(id);
  ctx.fillStyle = PATROL_HEX[id];
  ctx.fillRect(0, 0, W, H);
  const r = photoRegion("post", W, H);
  if(st.img){
    drawPhoto(ctx, st.img, r, st);
    drawMark(ctx, id, T.rtl ? -W * 0.02 : W * 0.72, H * 0.80 + W * 0.005, W * 0.30, W * 0.30, ink, T.rtl);
  }else{
    drawMark(ctx, id, T.rtl ? -W * 0.13 : W * 0.43, -H * 0.03, W * 0.70, W * 0.70, ink, T.rtl);
  }
  captionRow(ctx, T, id, T.sub, W * 0.044, W * 0.084, W, W * 0.024, !!st.img);
  /* The fleur rides the photo's slanted edge, in a patrol-colour disc so it
     reads over any photo. With no photo there is no edge for it to sit on. */
  if(st.img){
    const fx = T.rtl ? W - W * 0.096 : W * 0.096, fy = edgeY(r, fx), fr = W * 0.046;
    ctx.fillStyle = PATROL_HEX[id];
    ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.fill();
    drawFleur(ctx, fx, fy, fr * 1.15, CREAM);
  }
  const x = W * 0.052;
  ctx.fillStyle = ink;
  fitFont(ctx, T.name, W * (st.img ? 0.60 : 0.86), W * (st.img ? 0.115 : 0.141), T.dweight, T.display);
  startText(ctx, T, T.name, x, H * (st.img ? 0.912 : 0.899), W);
  ctx.fillStyle = CREAM;
  spaced(ctx, "0.18em");
  fitFont(ctx, T.post, W * (st.img ? 0.60 : 0.86), W * (st.img ? 0.024 : 0.026), 800, CARD_FONT_TEXT);
  startText(ctx, T, T.post, x, H * (st.img ? 0.958 : 0.956), W);
  spaced(ctx, "0px");
  wolvesFrame(ctx, id, W, H);
}

/* Story, 9:16. The top and bottom 250px stay clear for Instagram's own
   buttons: only the quiet captions live there. The photo takes the top 74%. */
function drawStoryCard(ctx, W, H, st){
  const id = st.patrol, T = cardText(id), ink = onFlood(id);
  ctx.fillStyle = PATROL_HEX[id];
  ctx.fillRect(0, 0, W, H);
  const r = photoRegion("story", W, H);
  if(st.img){
    drawPhoto(ctx, st.img, r, st);
    drawMark(ctx, id, T.rtl ? -W * 0.08 : W * 0.68, H * 0.745, W * 0.40, W * 0.40, ink, T.rtl);
  }else{
    drawMark(ctx, id, T.rtl ? -W * 0.10 : W * 0.14, H * 0.16, W * 0.96, W * 0.96, ink, T.rtl);
  }
  captionRow(ctx, T, id, T.story, null, H * 0.098, W, W * 0.026, !!st.img);
  /* Name and tagline in the band, kept clear of the mark's side. */
  const x = W * 0.067;
  ctx.fillStyle = ink;
  fitFont(ctx, T.name, W * (st.img ? 0.60 : 0.86), W * (st.img ? 0.15 : 0.156), T.dweight, T.display);
  startText(ctx, T, T.name, x, H * (st.img ? 0.818 : 0.735), W);
  ctx.fillStyle = CREAM;
  fitFont(ctx, T.tag, W * (st.img ? 0.58 : 0.86), W * (st.img ? 0.042 : 0.041), 700, T.ar ? '"Cairo",sans-serif' : CARD_FONT_TEXT);
  /* Arabic letters descend below the line, where Bravely's capitals do not. */
  startText(ctx, T, T.tag, x, H * (st.img ? 0.853 : 0.772) + (T.ar ? H * 0.012 : 0), W);
  /* The address, in the quiet bottom band. */
  ctx.fillStyle = CREAM;
  ctx.direction = "ltr";
  ctx.textAlign = "center";
  spaced(ctx, "0.18em");
  ctx.font = `900 ${W * 0.026}px ${CARD_FONT_TEXT}`;
  ctx.fillText("WSJPATROL.COM", W / 2, H * (st.img ? 0.94 : 0.885));
  spaced(ctx, "0px");
  wolvesFrame(ctx, id, W, H);
}

/* Wall card, 1080 square. Looked at about 170px wide in a grid, so it
   carries the patrol name, the mark (or the photo) and "Brownsea 1907", and
   stops. Everything else would be noise pretending to be information. */
function drawWallCard(ctx, W, H, st){
  const id = st.patrol, T = cardText(id), ink = onFlood(id);
  ctx.fillStyle = PATROL_HEX[id];
  ctx.fillRect(0, 0, W, H);
  if(st.img) drawPhoto(ctx, st.img, photoRegion("wall", W, H), st);
  else drawMark(ctx, id, T.rtl ? -W * 0.13 : W * 0.43, -H * 0.04, W * 0.70, W * 0.70, ink, T.rtl);
  const knotW = W * 0.056;
  drawKnot(ctx, id, T.rtl ? W - W * 0.074 - knotW : W * 0.074, PATROL_ACCENT[id] ? W * 0.026 : 0, knotW);
  const x = W * 0.074;
  ctx.fillStyle = ink;
  fitFont(ctx, T.name, W * 0.85, W * (st.img ? 0.13 : 0.156), T.dweight, T.display);
  startText(ctx, T, T.name, x, H * (st.img ? 0.885 : 0.858), W);
  ctx.fillStyle = CREAM;
  spaced(ctx, "0.18em");
  fitFont(ctx, T.sub, W * 0.85, W * (st.img ? 0.034 : 0.037), 900, CARD_FONT_TEXT);
  startText(ctx, T, T.sub, x, H * (st.img ? 0.945 : 0.930), W);
  spaced(ctx, "0px");
  wolvesFrame(ctx, id, W, H);
}

/* ============================================================
   CARD STUDIO
   The photo is opened with createImageBitmap and drawn straight
   onto a canvas in this tab. It is never sent anywhere unless the
   person separately chooses the wall.
   ============================================================ */
let studio = null;

function newStudioState(id){
  return {patrol:id, fmt:"post", img:null, zoom:1, ox:0, oy:0};
}

function clampPan(){
  if(!studio) return;
  if(!studio.img){ studio.ox = 0; studio.oy = 0; return; }
  const F = FORMATS[studio.fmt];
  const r = photoRegion(studio.fmt, F.w, F.h);
  const img = studio.img;
  const sc = Math.max(r.w / img.width, r.h / img.height) * studio.zoom;
  const maxX = Math.max(0, (img.width * sc - r.w) / 2 / r.w);
  const maxY = Math.max(0, (img.height * sc - r.h) / 2 / r.h);
  studio.ox = Math.min(maxX, Math.max(-maxX, studio.ox));
  studio.oy = Math.min(maxY, Math.max(-maxY, studio.oy));
}

function paintPreview(){
  const c = document.getElementById("stage");
  if(!c || !studio) return;
  const F = FORMATS[studio.fmt];
  const W = 540, H = Math.round(540 * F.h / F.w);
  if(c.width !== W || c.height !== H){ c.width = W; c.height = H; }
  clampPan();
  drawCard(c.getContext("2d"), W, H, studio);
  const hint = document.getElementById("stageHint");
  if(hint) hint.innerHTML = studio.img
    ? `<span>${ICON.move}${esc(t("s.drag"))}</span><span>${ICON.zoom}${esc(t("s.pinch"))}</span>`
    : `<span>${esc(t("s.nophoto"))}</span>`;
}

async function openPhoto(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast(t("t.notPhoto"), true); return; }
  try{
    let img;
    if(window.createImageBitmap){
      /* from-image honours the phone's rotation flag, so portraits stay upright */
      img = await createImageBitmap(file, {imageOrientation:"from-image"});
    }else{
      img = await new Promise((res, rej) => {
        const el = new Image();
        el.onload = () => res(el);
        el.onerror = rej;
        el.src = URL.createObjectURL(file);
      });
    }
    studio.img = img;
    studio.zoom = 1; studio.ox = 0; studio.oy = 0;
    paintPreview();
    const rm = document.getElementById("removePhoto");
    if(rm) rm.hidden = false;
    const fl = document.getElementById("fileLabel");
    if(fl) fl.textContent = t("s.change");
    toast(t("t.photoLoaded"));
  }catch(_){
    toast(t("t.photoFail"), true);
  }
}

async function renderExport(fmt){
  await cardFontsReady;
  await fleurReady;
  const F = FORMATS[fmt || studio.fmt];
  const c = document.createElement("canvas");
  c.width = F.w; c.height = F.h;
  drawCard(c.getContext("2d"), F.w, F.h, Object.assign({}, studio, {fmt: fmt || studio.fmt}));
  return await new Promise(res => c.toBlob(res, "image/jpeg", 0.92));
}

function cardFilename(fmt){
  return `wsjpatrol-${studio.patrol}-${fmt || studio.fmt}.jpg`;
}

async function saveCard(){
  try{
    const blob = await renderExport();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = cardFilename();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(t("t.saved"));
  }catch(_){ toast(t("t.saveFail"), true); }
}

/* Share the card itself, not just a link to the quiz. */
async function shareCard(blobIn, text){
  const blob = blobIn || await renderExport();
  const file = new File([blob], cardFilename(), {type:"image/jpeg"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], text:text, title:t("share.title")});
      return true;
    }catch(err){
      if(err && err.name === "AbortError") return true;   /* they changed their mind */
    }
  }
  return false;
}

function shareUrlFor(id){
  try{
    const u = new URL(SITE_URL);
    u.search = "?patrol=" + id;
    return u.toString();
  }catch(_){
    const u = new URL(window.location.href);
    u.hash = ""; u.search = "?patrol=" + id;
    return u.toString();
  }
}
function shareTextFor(id){
  return P(id).me + " " + t("share.ask");
}

async function sharePatrol(id, btn){
  const text = shareTextFor(id);
  const url = shareUrlFor(id);
  const label = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = t("t.ready"); }
  try{
    /* Build a card on the fly so what lands in the chat actually shows the
       patrol. Falls back to text and a link where files can't be shared. */
    const saved = studio;
    studio = newStudioState(id);
    studio.fmt = "profile";
    let blob = null;
    try{ blob = await renderExport(); }catch(_){}
    const ok = blob && await shareCard(blob, text + " " + url);
    studio = saved;
    if(ok) return;
    if(navigator.share){
      try{ await navigator.share({title:t("share.title"), text:text, url:url}); return; }catch(err){
        if(err && err.name === "AbortError") return;
      }
    }
    if(navigator.clipboard){
      await navigator.clipboard.writeText(text + " " + url);
      toast(t("t.copied"));
      return;
    }
    toast(text);
  }catch(_){
    toast(t("t.shareFail"), true);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = label; }
  }
}

async function uploadToLog(btn){
  const consent = document.getElementById("logConsent");
  if(!consent || !consent.checked){ toast(t("t.tick"), true); return; }
  if(FLAGS.uploads === false || FLAGS.wall === false){ toast(t("t.uploadsOff"), true); return; }
  if(!apiUrl("")){ toast(t("t.noApi"), true); return; }
  const label = btn.innerHTML;
  btn.disabled = true;
  btn.textContent = t("j.adding");
  try{
    /* Rendered in the wall's own shape whatever is on screen. */
    const blob = await renderExport("wall");
    const fd = new FormData();
    fd.append("patrol", studio.patrol);
    fd.append("photo", blob, "wall-" + studio.patrol + ".jpg");
    const res = await fetch(apiUrl("/photos"), {method:"POST", body:fd});
    if(!res.ok) throw new Error("upload");
    const out = await res.json().catch(() => ({}));
    const queued = out && out.status === "pending";
    document.getElementById("logbox").innerHTML =
      `<p class="done" role="status">${esc(t(queued ? "j.queued" : "j.done"))} ${esc(t("j.gone", {date: purgeDateText()}))}</p>`;
    toast(t(queued ? "t.sent" : "t.added"));
  }catch(_){
    btn.disabled = false;
    btn.innerHTML = label;
    toast(t("t.uploadFail"), true);
  }
}

async function reportPhoto(id, cardEl){
  cardEl.remove();
  toast(t("t.reported"));
  if(!apiUrl("")) return;
  try{
    await fetch(apiUrl("/report"), {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id:id})
    });
  }catch(_){}
}

  await cardFontsReady;
  await fleurReady;

  document.getElementById("removePhoto").addEventListener("click", (e) => {
    studio.img = null; studio.zoom = 1; studio.ox = 0; studio.oy = 0;
    document.getElementById("fileLabel").textContent = t("s.add");
    e.currentTarget.hidden = true;
    paintPreview();
  });
  app.querySelectorAll(".shape").forEach(b => {
    b.addEventListener("click", () => {
      studio.fmt = b.dataset.fmt;
      app.querySelectorAll(".shape").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
      paintPreview();
    });
  });

  /* Reframe on the picture itself: one finger drags, two pinch. The canvas
     sets touch-action:none, so the browser hands over both fingers instead of
     zooming the page. Every gesture is measured from a baseline taken when the
     number of fingers changes, so lifting one finger out of a pinch carries on
     panning from where it is rather than jumping. */
  const stage = document.getElementById("stage");
  const pointers = new Map();
  let base = null;
  const clampZoom = (z) => Math.min(ZOOM_MAX, Math.max(1, z));
  const spread = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  function midpoint(){
    const pts = [...pointers.values()];
    let x = 0, y = 0;
    for(const p of pts){ x += p.x; y += p.y; }
    return {x: x / pts.length, y: y / pts.length, n: pts.length, pts};
  }
  function rebase(){
    if(!studio.img || !pointers.size){ base = null; return; }
    const m = midpoint();
    const r = stage.getBoundingClientRect();
    base = {x:m.x, y:m.y, w:r.width, h:r.height, dist: m.n > 1 ? spread(m.pts[0], m.pts[1]) : 0, ox:studio.ox, oy:studio.oy, zoom:studio.zoom};
  }
  stage.addEventListener("pointerdown", (e) => {
    if(!studio.img) return;
    /* Capture throws if the pointer has already lifted; that must not stop
       the rest of this handler or the gesture starts with no baseline. */
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    rebase();
    stage.classList.add("dragging");
  });
  stage.addEventListener("pointermove", (e) => {
    if(!base || !pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const m = midpoint();
    if(m.n > 1 && base.dist > 0) studio.zoom = clampZoom(base.zoom * spread(m.pts[0], m.pts[1]) / base.dist);
    studio.ox = base.ox + (m.x - base.x) / base.w;
    studio.oy = base.oy + (m.y - base.y) / base.h;
    paintPreview();
  });
  const lift = (e) => {
    if(!pointers.delete(e.pointerId)) return;
    if(pointers.size) rebase();
    else{ base = null; stage.classList.remove("dragging"); }
  };
  stage.addEventListener("pointerup", lift);
  stage.addEventListener("pointercancel", lift);
  /* No second finger on a laptop. A trackpad pinch arrives here too. */
  stage.addEventListener("wheel", (e) => {
    if(!studio.img) return;
    e.preventDefault();
    studio.zoom = clampZoom(studio.zoom * Math.exp(-e.deltaY * 0.0016));
    paintPreview();
  }, {passive:false});
  /* Neither gesture reaches a keyboard, so arrows pan and +/- zoom. */
  stage.addEventListener("keydown", (e) => {
    if(!studio.img) return;
    const step = 0.08, pan = 0.04;
    const moves = {
      ArrowLeft:()=>studio.ox -= pan, ArrowRight:()=>studio.ox += pan,
      ArrowUp:()=>studio.oy -= pan,   ArrowDown:()=>studio.oy += pan,
      "+":()=>studio.zoom = clampZoom(studio.zoom + step), "=":()=>studio.zoom = clampZoom(studio.zoom + step),
      "-":()=>studio.zoom = clampZoom(studio.zoom - step), "_":()=>studio.zoom = clampZoom(studio.zoom - step)
    };
    const fn = moves[e.key];
    if(!fn) return;
    e.preventDefault();
    fn();
    paintPreview();
  });

  document.getElementById("saveBtn").addEventListener("click", saveCard);
  document.getElementById("shareCardBtn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const label = btn.innerHTML;
    btn.disabled = true; btn.textContent = t("t.ready");
    const done = await shareCard(null, shareTextFor(studio.patrol) + " " + shareUrlFor(studio.patrol));
    btn.disabled = false; btn.innerHTML = label;
    if(!done){ toast(t("t.noShareImg")); saveCard(); }
  });
  document.getElementById("uploadBtn").addEventListener("click", (e) => uploadToLog(e.currentTarget));
  document.getElementById("seeLogBtn").addEventListener("click", () => renderLog(id));
  document.getElementById("backBtn").addEventListener("click", () => renderResult(id));
  document.getElementById("topBack").addEventListener("click", () => renderResult(id));
  applyFlags();
}

   the event. A refresh that fails keeps whatever is already up: at
   a stand with patchy signal, a blank wall is worse than an old one.

async function renderLog(fromPatrol){
  if(FLAGS.wall === false){

  }

    <div class="ptr" id="ptr" aria-hidden="true"><i></i><span>${esc(t("w.pull"))}</span></div>

     <div class="pullwrap" id="pullWrap">

          ${PATROL_IDS.map(p => `<button class="chip" type="button" data-p="${p}" aria-pressed="false"><span class="sw p-${p}"></span>${esc(P(p).name)}</button>`).join("")}
        </div>
        <div class="wstatus">
          <span id="logStamp"></span>
          <button class="chip" type="button" id="refreshBtn">${ICON.refresh}<span>${esc(t("w.refresh"))}</span></button>
        </div>
        <div id="logBody" aria-busy="true"><p class="wnote">${esc(t("w.loading"))}</p></div>
        <p class="wnote">${esc(t("w.note", {date: purgeDateText()}))}</p>
        <button class="pen find" type="button" id="backBtn"><span>${esc(t(fromPatrol ? "w.backCard" : "w.find"))}</span>${ICON.arrow}</button>
      </div>
     </div>
    </div>`;

  const keep = studio && fromPatrol && studio.patrol === fromPatrol ? studio : null;
  const back = () => { if(fromPatrol) renderCardStudio(fromPatrol, keep); else renderIntro(); };
  document.getElementById("backBtn").addEventListener("click", back);
  document.getElementById("topBack").addEventListener("click", back);

  let items = null;
  let filter = "all";
  let loadedAt = null;

  function paint(){
    const body = document.getElementById("logBody");
    if(!body) return;
    body.setAttribute("aria-busy", "false");
    if(items === null){
      body.innerHTML = `<p class="wnote">${esc(t("w.off"))}</p>`;
      return;
    }
    const shown = filter === "all" ? items : items.filter(i => i.patrol === filter);
    if(!shown.length){
      body.innerHTML = `<div class="wempty"><div class="row" aria-hidden="true">${PATROL_IDS.map(p => mark(p, "", true)).join("")}</div>
        <h2 class="disp">${esc(t("w.emptyTitle"))}</h2>
        <p>${esc(filter === "all" ? t("w.empty") : t("w.emptyPatrol", {name: P(filter).name}))}</p></div>`;
      return;
    }
    body.innerHTML = `<div class="wgrid">${shown.map(i => `
      <figure class="wcard" data-id="${esc(i.id)}">
        <img src="${esc(i.url)}" alt="${esc(t("w.alt", {name: ROSTER[i.patrol] ? P(i.patrol).name : i.patrol}))}" loading="lazy">
        <button class="rep" type="button" data-report="${esc(i.id)}" aria-label="${esc(t("w.report"))}">${ICON.flag}</button>
      </figure>`).join("")}</div>`;
    body.querySelectorAll("[data-report]").forEach(b => {
      b.addEventListener("click", () => reportPhoto(b.dataset.report, b.closest(".wcard")));
    });
    /* A card pulled off the wall between the list and the image request would
       otherwise sit there as a broken frame. */
    body.querySelectorAll(".wcard img").forEach(im => {
      im.addEventListener("error", () => { const f = im.closest(".wcard"); if(f) f.remove(); });
    });
  }
  function stamp(){
    const el = document.getElementById("logStamp");
    if(!el) return;
    if(items === null || !loadedAt){ el.textContent = ""; return; }
    let time = "";
    try{ time = loadedAt.toLocaleTimeString(langInfo().locale, {hour:"2-digit", minute:"2-digit"}); }catch(_){}
    el.textContent = tp("w.count", items.length) + " · " + t("w.updated", {time});
  }

  app.querySelectorAll(".chips .chip").forEach(b => {
    b.addEventListener("click", () => {
      filter = b.dataset.p;
      app.querySelectorAll(".chips .chip").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
      paint();
    });
  });

  async function load(){
    if(!apiUrl("")){ items = null; return; }
    try{
      const res = await fetch(apiUrl("/photos"), {headers:{"Accept":"application/json"}, cache:"no-store"});
      const data = await res.json();
      items = Array.isArray(data) ? data : (data && data.items) || [];
      loadedAt = new Date();
    }catch(_){ items = items || []; }
  }

  /* Pull to refresh. The pull moves .pullwrap, never .screen. */
  const wrap = document.getElementById("pullWrap");
  const ptr = document.getElementById("ptr");
  const ptrText = ptr.querySelector("span");
  const PULL_AT = 64, PULL_MAX = 96;
  let pullFrom = null, pulled = 0, busy = false;

  function showPull(px, msg){
    pulled = px;
    wrap.style.transform = px ? `translateY(${px}px)` : "";
    ptr.style.height = px + "px";
    ptr.style.opacity = px ? String(Math.min(1, px / PULL_AT)) : "0";
    if(msg) ptrText.textContent = msg;
  }
  async function refresh(){
    if(busy) return;
    busy = true;
    wrap.classList.add("snap");
    ptr.classList.add("spin");
    showPull(PULL_AT, t("w.refreshing"));
    document.getElementById("logBody").setAttribute("aria-busy", "true");
    await load();
    paint();
    stamp();
    showPull(0);
    ptr.classList.remove("spin");
    setTimeout(() => { wrap.classList.remove("snap"); busy = false; }, 240);
  }
  /* One finger, only from the very top, and only downwards. */
  wrap.addEventListener("touchstart", (e) => {
    if(busy || e.touches.length !== 1 || window.scrollY > 0) return;
    pullFrom = e.touches[0].clientY;
  }, {passive:true});
  wrap.addEventListener("touchmove", (e) => {
    if(pullFrom === null) return;
    const dy = e.touches[0].clientY - pullFrom;
    if(dy <= 0){ showPull(0); pullFrom = null; return; }
    e.preventDefault();
    const px = Math.min(PULL_MAX, dy * 0.5);
    showPull(px, t(px >= PULL_AT ? "w.release" : "w.pull"));
  }, {passive:false});
  const letGo = () => {
    if(pullFrom === null) return;
    const go = pulled >= PULL_AT;
    pullFrom = null;
    if(go) refresh();
    else{ wrap.classList.add("snap"); showPull(0); setTimeout(() => wrap.classList.remove("snap"), 240); }
  };
  wrap.addEventListener("touchend", letGo);
  wrap.addEventListener("touchcancel", letGo);
  /* There is no pull on a laptop. */
  document.getElementById("refreshBtn").addEventListener("click", refresh);

  await load();
  paint();
  stamp();
}

/* ============================================================
   PWA
   Installable and offline, and silent about it: browsers offer
   "Add to home screen" themselves.
   ============================================================ */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ============================================================
   BOOT
   ?patrol=   a shared result, so the link carries the patrol
   ?log=1     straight to the wall (also a home-screen shortcut)
   ?start=    1907 or today, straight into a set
   ?lang=     a language, including drafts not yet in the menu
   ============================================================ */
let sharedPatrol = null;

(function boot(){
  const q = new URLSearchParams(window.location.search);
  initLang(q);
  document.body.insertAdjacentHTML("afterbegin",
    `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>${
      PATROL_IDS.map(p => `<symbol id="h-${p}" viewBox="0 0 ${HEADS[p].w} ${HEADS[p].h}"><path fill-rule="evenodd" d="${HEADS[p].d}"/></symbol>`).join("")
    }</defs></svg>`);
  const shared = q.get("patrol");
  if(shared && ROSTER[shared]) sharedPatrol = shared;
  loadFlags();
  if(q.get("log") === "1"){ renderLog(null); return; }
  renderIntro();
  const s = q.get("start");
  if(s && SETS.includes(s)) startQuiz(s);
})();

</script>
