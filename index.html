<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF5E9">
<title>Which patrol are you?</title>
<meta name="description" content="Seven quick questions to find your 1907 Brownsea patrol. UK Pavilion, Poland 2027.">
<style>
  :root{
    --paper:#FAF5E9;
    --navy:#1B3579;
    --red:#E13327;
    --sky:#AEDCF2;
    --sky-line:#D2E8F5;
    --purple:#7413DC;
    --wolves:#2A5CAD;
    --bulls:#2F7D3F;
    --curlews:#F5B01E;
    --ravens:#C02D24;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    min-height:100vh;min-height:100dvh;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--navy);
    transition:background-color .5s ease;
    -webkit-font-smoothing:antialiased;
    display:flex;
  }
  body.result-wolves{background:var(--wolves);color:#fff}
  body.result-bulls{background:var(--bulls);color:#fff}
  body.result-ravens{background:var(--ravens);color:#fff}
  body.result-curlews{background:var(--curlews);color:var(--navy)}

  .blob{
    position:fixed;z-index:0;background:var(--sky);opacity:.45;pointer-events:none;
    top:10vh;left:-6vw;right:-6vw;height:64vh;
    clip-path:polygon(1% 5%,40% 1%,97% 0%,100% 58%,98% 95%,52% 100%,2% 97%);
    transform:rotate(-1.4deg);
    transition:opacity .5s ease;
  }
  body.result-mode .blob{opacity:0}

  .ribbon{
    position:fixed;top:0;left:24px;width:22px;height:14vh;z-index:2;
    background:rgba(255,255,255,.92);
    clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 14px),0 100%);
    display:none;
  }
  body.result-mode .ribbon{display:block}
  body.result-curlews .ribbon{background:rgba(27,53,121,.9)}

  .wrap{
    position:relative;z-index:1;flex:1;
    max-width:26rem;margin:0 auto;width:100%;
    padding:calc(14px + env(safe-area-inset-top)) 22px calc(18px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;
  }
  .screen{flex:1;display:flex;flex-direction:column;animation:fadeup .3s ease both}
  @keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .topbar{display:flex;justify-content:flex-end}
  .topbar img{height:28px;width:auto}

  .eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
  .banner{
    display:inline-block;align-self:flex-start;
    background:var(--red);color:#fff;
    font-family:var(--serif);font-weight:700;letter-spacing:.01em;text-transform:uppercase;
    padding:12px 18px;transform:rotate(-1.5deg);
    font-size:1.85rem;line-height:1.12;margin:12px 0 6px;
  }
  .centered{align-self:center;text-align:center}

  /* 120 years postmark */
  .postmark{color:var(--red);opacity:.95;pointer-events:none}
  .postmark svg{width:100%;height:auto;display:block}
  .stampzone{flex:1;display:flex;align-items:center;justify-content:flex-end;min-height:0;padding:8px 6px}
  .postmark-intro{width:clamp(104px,34vw,150px);transform:rotate(-8deg)}
  .postmark-result{position:absolute;top:0;right:-4px;width:84px;transform:rotate(8deg)}
  body.result-mode .postmark{color:rgba(255,255,255,.9)}
  body.result-curlews .postmark{color:rgba(27,53,121,.85)}

  /* patrol badges (illustrative, stitched, not buttons) */
  .patrolrow{display:flex;gap:10px;margin:18px 0 4px}
  .tile{
    flex:1;text-align:center;
    background:rgba(255,255,255,.72);
    border:2px dashed rgba(27,53,121,.35);border-radius:14px;
    padding:12px 4px 0;overflow:visible;
  }
  .tile .head{width:100%;height:58px;margin-bottom:6px}
  .tile .tiny{font-size:.6rem;letter-spacing:.1em}
  .knot{width:20px;height:18px;margin:7px auto -9px;
    clip-path:polygon(0 0,100% 0,100% 100%,50% 62%,0 100%)}
  .knot-wolves{background:var(--wolves)}
  .knot-bulls{background:var(--bulls)}
  .knot-curlews{background:var(--curlews)}
  .knot-ravens{background:var(--ravens)}

  .tiny{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
  .sub{font-size:1.05rem;font-weight:600;opacity:.85;line-height:1.5;margin-top:18px}

  .head{
    display:block;background:var(--navy);
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
  }

  }

  .jlink{display:inline-block;margin-top:12px;color:var(--red);font-weight:800;

   ============================================================ */
let current = 0;
let answers = [];
let shuffled = [];
let locked = false;

const app = document.getElementById("app");

function shuffle(a){
  const arr = a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function startQuiz(){
  current = 0;
  answers = [];
  shuffled = QUESTIONS.map(q => shuffle(q.options));
  document.body.className = "";
  renderQuestion();
}

function pick(btn, patrol){
  if(locked) return;
  locked = true;
  btn.classList.add("picked");
  answers[current] = patrol;
  setTimeout(()=>{
    locked = false;
    current++;
    if(current < QUESTIONS.length){ renderQuestion(); }
    else { renderResult(); }
  }, 200);
}

function goBack(){
  if(locked) return;
  if(current === 0){ renderIntro(); return; }
  current--;
  answers.length = current;
  renderQuestion();
}

function scoreResult(){
  const totals = {wolves:0,bulls:0,curlews:0,ravens:0};
  answers.forEach((p,i)=>{ totals[p] += QUESTIONS[i].weight; });
  const max = Math.max(...Object.values(totals));
  const tied = Object.keys(totals).filter(p => totals[p] === max);
  if(tied.length === 1) return tied[0];
  if(tied.includes(answers[0])) return answers[0];
  for(const p of answers){ if(tied.includes(p)) return p; }
  return tied[0];
}

async function submitEmail(id){
  const input = document.getElementById("emailIn");
  const btn = document.getElementById("emailBtn");
  const note = document.getElementById("emailNote");
  const email = (input.value || "").trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    note.textContent = "That email doesn't look quite right.";
    return;
  }
  if(!EMAIL_ENDPOINT){
    note.textContent = "Sign-up isn't switched on yet. Come and find us at Reunion instead.";
    return;
  }
  btn.textContent = "Sending...";
  btn.disabled = true;
  try{
    const res = await fetch(EMAIL_ENDPOINT, {
      method:"POST",
      headers:{"Accept":"application/json","Content-Type":"application/json"},
      body: JSON.stringify({email:email, patrol:PATROLS[id].name, source:"patrolfinder"})
    });
    if(!res.ok) throw new Error("send failed");
    document.getElementById("emailrow").outerHTML =
      '<p class="thanks">You\'re in. We\'ll be in touch about co-designing the Pavilion.</p>';
    note.textContent = "";
  }catch(_){
    note.textContent = "That didn't send. Try again in a moment.";
    btn.textContent = "Count me in";
    btn.disabled = false;
  }
}

function renderQuestion(){
  const q = QUESTIONS[current];
  app.innerHTML = `
    <div class="screen">
      <div>
        <p class="tiny">${current+1} of ${QUESTIONS.length}</p>
        <div class="progress"><i style="width:${Math.round((current)/QUESTIONS.length*100)}%"></i></div>
      </div>
      <div class="qmid">
        <p class="prompt">${q.prompt}</p>
        <div class="opts" id="opts"></div>
      </div>
      <button class="backlink" id="backBtn">&larr; Back</button>
    </div>`;
  const opts = document.getElementById("opts");
  shuffled[current].forEach(o=>{
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = o.t;
    b.addEventListener("click", ()=>pick(b, o.p), {once:true});
    opts.appendChild(b);
  });
  document.getElementById("backBtn").addEventListener("click", goBack);
}

            <p>Help build the UK Pavilion<span class="tinyline">Poland 2027 &middot; 120 years since Brownsea</span></p>
          </div>
          <p class="ctatext">Come and find the Pavilion team at <strong>Gilwell Reunion</strong> and tell us what the UK Pavilion should be. Or leave your email and help us design it.</p>
          <div class="emailrow" id="emailrow">
            <input id="emailIn" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" aria-label="Your email">
            <button class="btn go" id="emailBtn">Count me in</button>
          </div>
          <p class="micro" id="emailNote">Pavilion co-design updates only. No spam.</p>
          <a class="jlink" href="${JAMBOREE_URL}" target="_blank" rel="noopener">More about the Jamboree &rarr;</a>
        </div>
        <div class="stack">
          <button class="btn primary" id="shareBtn">Share my patrol</button>
          <button class="btn" id="againBtn">Start again</button>
        </div>
        <p class="history">Real patrol, real names, real colour. The personalities are just for fun. BP mixed everyone up on purpose.</p>
      </div>
    </div>`;
  document.getElementById("againBtn").addEventListener("click", renderIntro);
  document.getElementById("emailBtn").addEventListener("click", ()=>submitEmail(id));
  document.getElementById("emailIn").addEventListener("keydown", (ev)=>{ if(ev.key==="Enter") submitEmail(id); });
  document.getElementById("shareBtn").addEventListener("click", async (e)=>{
    const text = "I'm " + pt.one + " \u269C Which 1907 Brownsea patrol are you? 120 years of Scouting, Poland 2027.";
    const url = window.location.href;
    if(navigator.share){
      try{ await navigator.share({title:"Brownsea Patrol Finder", text:text, url:url}); }catch(_){}
    } else if(navigator.clipboard){
      try{
        await navigator.clipboard.writeText(text + " " + url);
        e.target.textContent = "Copied to clipboard";
      }catch(_){ e.target.textContent = text; }
    }
  });
}
