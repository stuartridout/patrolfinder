<style>
  :root{
    --paper:#FAF5E9;
    --navy:#1B3579;
    --red:#E13327;
    --sky:#AEDCF2;
    --sky-line:#D2E8F5;
    --purple:#7413DC;
    --wolves:#2A5CAD;
    --bulls:#2F7D3F;
    --curlews:#F5B01E;
    --ravens:#C02D24;
    --rule:rgba(27,53,121,.14);
    --red-ink:#D42B20;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    position:relative;
    min-height:100vh;min-height:100dvh;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--navy);
    transition:background-color .5s ease;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  body.result-wolves{background:var(--wolves);color:#fff}
  body.result-bulls{background:var(--bulls);color:#fff}
  body.result-ravens{background:var(--ravens);color:#fff}
  body.result-curlews{background:var(--curlews);color:var(--navy)}

  /* masthead: official marks live on a clean white strip, always */
  .mast{position:relative;z-index:3;background:#fff;border-bottom:1px solid var(--rule)}
  .mastin{
    max-width:1040px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:calc(12px + env(safe-area-inset-top)) 22px 12px;
  }
  .mast .wsj{width:min(60vw,258px);height:auto;display:block}
  .mast .fleur{height:40px;width:auto;display:block}
  body.quiz .mast,body.result-mode .mast{display:none}

  /* torn sky band, anchored safely below the masthead */
  /* A plain horizon. The torn, rotated edges this used to have wandered
     across the call to action and the postmark at desktop widths, which read
     as a mistake rather than as texture. */
  /* Absolute, not fixed: the horizon belongs to the page and scrolls away with
     everything above it. Fixed left it sliding across the content. */
  .blob{
    position:absolute;z-index:0;background:var(--sky);opacity:.5;pointer-events:none;
    top:150px;left:0;right:0;bottom:0;
    transition:opacity .5s ease;
  }
  body.quiz .blob{top:90px}
  body.result-mode .blob{opacity:0}

  .ribbon{
    position:absolute;top:0;left:22px;width:22px;height:14vh;z-index:2;
    background:#fff;
    clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 14px),0 100%);
    display:none;
  }
  body.result-mode .ribbon{display:block}
  body.result-curlews .ribbon{background:rgba(27,53,121,.9)}
  /* Not on the card studio. Its banner is a full-width white bar hard against
     the top, so the white ribbon runs into it and the two read as one torn
     shape rather than two deliberate ones. */
  body.studio-mode .ribbon{display:none}

  .wrap{
    position:relative;z-index:1;flex:1;
    max-width:26rem;margin:0 auto;width:100%;
    padding:12px 22px calc(22px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;
  }
  body.quiz .wrap,body.result-mode .wrap{padding-top:calc(16px + env(safe-area-inset-top))}
  .screen{flex:1;display:flex;flex-direction:column;animation:fadeup .3s ease both}
  @keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
  .intro .eyebrow{margin-top:10px}
  .banner{
    display:inline-block;align-self:flex-start;
    background:var(--red);color:#fff;
    font-family:var(--serif);font-weight:700;letter-spacing:.01em;text-transform:uppercase;
    padding:12px 18px;transform:rotate(-1.5deg);
    font-size:1.85rem;line-height:1.12;margin:12px 0 6px;
  }
  .centered{align-self:center;text-align:center}
  /* result banners: white slab, patrol colour type. Navy slab on Curlews yellow */
  body.result-mode .banner{background:#fff}
  body.result-wolves .banner{color:var(--wolves)}
  body.result-bulls .banner{color:var(--bulls)}
  body.result-ravens .banner{color:var(--ravens)}
  body.result-curlews .banner{background:var(--navy);color:#fff}

  /* 120 years postmark */
  .postmark{color:var(--red);opacity:.95;pointer-events:none}
  .postmark svg{width:100%;height:auto;display:block}
  .stampzone{flex:1;display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:0;max-height:20vh;padding:6px 24px 6px 6px}
  .stampnote{max-width:11.5rem;font-size:.82rem;line-height:1.5;font-weight:600;opacity:.85}
  .postmark-intro{width:clamp(120px,36vw,170px);transform:rotate(-8deg)}
  .postmark-result{position:absolute;top:0;right:-4px;width:84px;transform:rotate(8deg)}
  body.result-mode .postmark{color:rgba(255,255,255,.9)}
  body.result-curlews .postmark{color:rgba(27,53,121,.85)}

  /* patrol badges (illustrative, stitched, not buttons) */
  .patrolrow{display:flex;gap:10px;margin:18px 0 4px}
  .tile{
    flex:1;text-align:center;
    background:rgba(255,255,255,.72);
    border:2px dashed rgba(27,53,121,.35);border-radius:14px;
    padding:12px 4px 0;overflow:visible;
  }
  .tile .head{width:100%;height:58px;margin-bottom:6px}
  .tile .tiny{font-size:.62rem;letter-spacing:.08em;opacity:.9}
  .knot{width:20px;height:18px;margin:7px auto -9px;
    clip-path:polygon(0 0,100% 0,100% 100%,50% 62%,0 100%)}
  .knot-wolves{background:var(--wolves)}
  .knot-bulls{background:var(--bulls)}
  .knot-curlews{background:var(--curlews)}
  .knot-ravens{background:var(--ravens)}

  .tiny{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.78}
  .sub{font-size:1.05rem;font-weight:600;opacity:.92;line-height:1.5;margin-top:18px}

  .head{
    display:block;background:var(--navy);
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
  }

  .btn{
    display:block;width:100%;cursor:pointer;text-align:left;
    font-family:var(--sans);font-size:1.02rem;font-weight:600;line-height:1.35;
    color:var(--navy);background:#fff;
    border:2px solid var(--sky-line);border-radius:14px;
    padding:16px;
    transition:background-color .12s ease,border-color .12s ease,color .12s ease,transform .06s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.picked{background:var(--red);border-color:var(--red);color:#fff}
  .btn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .btn.primary{
    background:var(--navy);border-color:var(--navy);color:#fff;
    text-align:center;font-weight:800;font-size:1.1rem;letter-spacing:.02em;
    border-radius:999px;padding:17px 16px;
  }
  @media(hover:hover){
    .btn:hover{border-color:var(--navy)}
    .btn.primary:hover{background:#27459B;border-color:#27459B}
    .btn.picked:hover{border-color:var(--red)}
  }
  body.result-mode .btn{background:transparent;border-color:rgba(255,255,255,.85);color:#fff;text-align:center}
  body.result-mode .btn.primary{background:#fff;border-color:#fff;color:var(--navy)}
  body.result-curlews .btn{border-color:rgba(27,53,121,.75);color:var(--navy)}
  body.result-curlews .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}

  .backlink{
    font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    background:none;border:none;color:inherit;opacity:.85;cursor:pointer;
    margin-top:auto;padding:18px 16px 16px 0;align-self:flex-start;
  }
  .backlink:focus-visible{outline:3px solid var(--red);outline-offset:2px}

  .progress{height:6px;background:#fff;border:1px solid var(--sky-line);border-radius:99px;margin:8px 0 22px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .3s ease}

  .qmid{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:13vh 0 4vh}
  .prompt{font-family:var(--serif);font-size:1.6rem;font-weight:700;line-height:1.28;margin-bottom:18px}
  .opts{display:flex;flex-direction:column;gap:12px}

  /* result */
  .rmid{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4vh 0 0}
  .rhero{display:flex;flex-direction:column;align-items:center;text-align:center}
  .rheadtext{display:flex;flex-direction:column;align-items:center}
  .result-head{width:150px;height:128px;background:#fff;margin-bottom:8px;animation:pop .45s cubic-bezier(.2,.8,.3,1.2) both}
  body.result-curlews .result-head{background:var(--navy)}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  .tagline{font-family:var(--serif);font-size:1.25rem;font-weight:700;font-style:italic;line-height:1.35;margin-top:4px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;justify-content:center}
  /* No opacity on any of the three result-screen labels below. Opacity on a
     parent composites the whole subtree, so cream at .9 over Bulls green
     lands at 4.46:1 and fails. They only ever sit on a patrol flood, where
     the full-strength colour is the one that passes. */
  .chip{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    border:2px solid currentColor;border-radius:999px;padding:5px 11px}
  .card{background:#fff;color:var(--navy);border-radius:16px;
    padding:14px 16px;margin-top:16px;font-size:.95rem;line-height:1.5;text-align:left;width:100%}
  .card .fact{font-style:italic;opacity:.8;margin-top:8px}
  .cardhead{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-bottom:8px}

  .rbottom{margin-top:4px}
  body.result-mode .banner{transform:rotate(-1.1deg)}
  .ctarow{display:flex;align-items:center;gap:14px}
  .ctarow img{height:52px;width:auto;background:#fff;border-radius:10px;padding:5px;display:block}
  .ctarow p{font-size:1.02rem;font-weight:800;line-height:1.3}
  .ctarow .tinyline{display:block;font-size:.78rem;font-weight:600;opacity:.8;margin-top:2px}
  .ctatext{margin-top:12px;font-size:.95rem;line-height:1.5}
  .emailrow{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .emailrow input{
    flex:1;min-width:0;font-family:var(--sans);font-size:1rem;color:var(--navy);
    border:2px solid var(--sky-line);border-radius:999px;padding:12px 16px;background:#fff;
  }
  .emailrow input:focus-visible{outline:3px solid var(--red);outline-offset:1px}
  .emailrow input.bad{border-color:var(--red-ink)}
  .micro.err{color:var(--red-ink);opacity:1;font-weight:700}
  .micro.info{color:var(--navy);opacity:.95;font-weight:700}
  :is(.card,.cardcta,.wallcta) .btn.go{
    width:auto;margin:0;text-align:center;border-radius:999px;
    background:var(--red-ink);border-color:var(--red-ink);color:#fff;font-weight:800;padding:12px 16px;
  }
  body.result-mode :is(.card,.cardcta,.wallcta) .btn.go,
  body.result-curlews :is(.card,.cardcta,.wallcta) .btn.go{
    background:var(--red-ink);border-color:var(--red-ink);color:#fff;
  }
  .micro{font-size:.68rem;opacity:.78;margin-top:8px}
  .micro.note{margin:0}
  .micro.note:empty{display:none}
  .jlink{display:inline-flex;align-items:center;min-height:44px;margin-top:2px;color:var(--red-ink);font-weight:800;
    text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
  .jlink .arr{display:inline-block;text-decoration:none;margin-left:7px}
  .jlink:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .thanks{margin-top:12px;font-weight:800;color:var(--bulls)}
  .stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .history{font-size:.7rem;line-height:1.45;margin-top:14px}

  .ibottom{margin-top:auto}
  .microcopy{text-align:center;margin-top:10px}

  /* ---------- desktop ---------- */
  @media (min-width:768px){
    .mastin{padding-left:32px;padding-right:32px;padding-bottom:14px}
    .eyebrow{font-size:.85rem}
    .mast .wsj{width:300px}
    .mast .fleur{height:46px}
    /* No bottom edge at desktop widths. The band is anchored to the viewport
       and the content is centred in it, so any fixed height eventually draws a
       horizon straight through the call to action or the postmark. One clean
       line at the top, sky the rest of the way down. */
    .blob{top:150px;height:auto;bottom:0}
    .ribbon{left:40px;width:26px}
    .wrap{padding:28px 32px 44px}
    body:not(.quiz):not(.result-mode) .wrap{max-width:1040px}
    body.quiz .wrap{max-width:620px}
    body.result-mode .wrap{max-width:760px}

    .screen.intro{
      display:grid;flex:1;
      grid-template-columns:1.05fr .95fr;
      column-gap:64px;row-gap:0;
      align-content:center;
      grid-template-areas:
        "eyebrow tiles"
        "banner tiles"
        "sub tiles"
        "cta stamp";
    }
    .intro .eyebrow{grid-area:eyebrow;align-self:end;margin-top:0}
    .intro .banner{grid-area:banner;justify-self:start;font-size:2.8rem;padding:18px 28px;margin:16px 0 10px}
    .intro .sub{grid-area:sub;align-self:start;font-size:1.2rem;max-width:32rem;margin-top:12px}
    .intro .patrolrow{grid-area:tiles;display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0;align-self:start}
    .intro .tile{padding:22px 8px 0;border-radius:18px}
    .intro .tile .head{height:106px;margin-bottom:10px}
    .intro .tile .tiny{font-size:.72rem}
    .intro .knot{width:24px;height:22px;margin:10px auto -11px}
    .intro .stampzone{grid-area:stamp;justify-content:center;align-items:center;gap:24px;max-height:none;padding:24px 0 0}
    .intro .stampnote{max-width:13rem;font-size:.88rem}
    .intro .postmark-intro{width:176px}
    .intro .ibottom{grid-area:cta;margin-top:26px;align-self:start}
    .intro .btn.primary{max-width:330px}
    .intro .microcopy{text-align:left}

    body.quiz .blob{top:100px;height:auto;bottom:0}
    body.quiz .screen{justify-content:flex-start}
    .qmid{flex:0 0 auto;padding:96px 0 8px}
    .prompt{font-size:2rem;margin-bottom:24px}
    .opts{gap:14px}
    .btn{font-size:1.06rem;padding:18px 20px}
    body.quiz .backlink{margin-top:34px}

    .rmid{padding-top:6vh}
    .rhero{flex-direction:row;text-align:left;align-items:center;gap:34px;align-self:center;padding-right:72px}
    body.result-mode .banner{font-size:2.1rem;white-space:nowrap}
    .rhero .rheadtext{display:flex;flex-direction:column;align-items:flex-start}
    .rhero .chips{justify-content:flex-start}
    .result-head{width:200px;height:172px;margin:0}
    .banner{font-size:2.3rem}
    .tagline{font-size:1.45rem}
    .rcards{display:grid;grid-template-columns:1fr 1.25fr;gap:18px;align-items:stretch;margin-top:22px}
    .rcards .card:first-child{padding:20px 18px}
    .rcards .card:first-child p:not(.cardhead){font-size:1rem;line-height:1.55}
    .rcards .card{margin-top:0}
    .stack{flex-direction:row}
    .stack .btn{flex:1;margin:0}
    body.result-mode .ribbon{left:calc(50% - 372px)}
    .postmark-result{width:100px;right:4px;top:6px}
  }


  /* ============================================================
     TALLY — how the four patrols are running. Only ever drawn
     from real numbers off the API; never a guess.
     ============================================================ */
  /* The UA's [hidden] rule loses to anything that sets display, and plenty
     here does, so the switches need this to actually hide what they hide. */
  [hidden]{display:none !important}

  .tally{margin-top:14px}
  /* Both only exist once real numbers arrive; empty they must not leave a gap. */
  .tally:empty,.countline:empty{display:none;margin:0}
  .tallybar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:rgba(27,53,121,.12)}
  .tallybar i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .tallybar .seg-wolves{background:var(--wolves)}
  .tallybar .seg-bulls{background:var(--bulls)}
  .tallybar .seg-curlews{background:var(--curlews)}
  .tallybar .seg-ravens{background:var(--ravens)}
  .tallykey{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:.72rem;font-weight:700}
  .tallykey span{display:flex;align-items:center;gap:6px}
  .tallykey i{width:10px;height:10px;border-radius:3px;flex:none}
  .tallykey b{font-variant-numeric:tabular-nums}
  .tallykey .me{text-decoration:underline;text-underline-offset:3px}
  .countline{font-size:.8rem;font-weight:700;opacity:.85;margin-top:14px;text-align:center;font-variant-numeric:tabular-nums}
  .countline.left{text-align:left}

  /* ============================================================
     PATROL CARD STUDIO
     ============================================================ */
  .studio .card{margin-top:12px}
  .cardtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .stagewrap{
    position:relative;margin:0 auto;width:100%;max-width:19rem;
    border-radius:14px;overflow:hidden;background:rgba(27,53,121,.1);
    box-shadow:0 10px 30px rgba(0,0,0,.22);
  }
  .stagewrap canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
  .stagewrap canvas.dragging{cursor:grabbing}
  .stagewrap.circlecrop::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:0 0 0 9999px rgba(27,53,121,.32);
    border-radius:50%;
  }
  .stagenote{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    opacity:.75;text-align:center;margin-top:8px}
  .segrow{display:flex;gap:6px;margin-top:12px;background:rgba(27,53,121,.08);padding:4px;border-radius:12px}
  .segrow button{
    flex:1;min-height:44px;cursor:pointer;border:0;border-radius:9px;background:transparent;
    font-family:var(--sans);font-size:.78rem;font-weight:800;line-height:1.2;color:var(--navy);
    padding:8px 4px;
  }
  .segrow button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 4px rgba(27,53,121,.2)}
  /* Full-strength navy: at this size a faded tint drops under 4.5:1. */
  .segrow .segsub{font-weight:700;color:#3B4E86}
  .segrow button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  /* The zoom slider is gone: the picture is pinched and dragged directly.
     The canvas takes focus so the keyboard can still do both. */
  .stagewrap:focus-within{outline:3px solid var(--red);outline-offset:3px}
  .stagewrap canvas:focus{outline:none}
  .photorow{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .filebtn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    min-height:52px;cursor:pointer;text-align:center;
    font-family:var(--sans);font-size:1rem;font-weight:700;color:var(--navy);
    background:#fff;border:2px dashed rgba(27,53,121,.4);border-radius:14px;padding:14px;
  }
  .filebtn:focus-within{outline:3px solid var(--red);outline-offset:2px}
  .filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  .privacy{
    margin-top:12px;padding:12px 14px;border-radius:12px;
    background:rgba(47,125,63,.1);border-left:4px solid var(--bulls);
    font-size:.78rem;line-height:1.5;font-weight:600;color:var(--navy);
  }
  .privacy b{font-weight:800}
  .warnbox{
    margin-top:12px;padding:12px 14px;border-radius:12px;
    background:rgba(225,51,39,.09);border-left:4px solid var(--red);
    font-size:.78rem;line-height:1.5;font-weight:600;color:var(--navy);
  }
  .warnbox ul{margin:8px 0 0 18px;padding:0}
  .warnbox li{margin-bottom:4px}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:.8rem;
    font-weight:700;line-height:1.45;cursor:pointer;color:var(--navy)}
  .consent input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--bulls)}
  .btn.go[disabled],.btn.primary[disabled]{opacity:.5;cursor:not-allowed}

  /* ============================================================
     PATROL LOG — the public wall
     ============================================================ */
  /* All five on one row. They share the width equally rather than each taking
     what its word needs, so "Curlews" sets the size and the rest match it;
     wrapping put Ravens on a line of its own at every phone width. */
  .logfilter{display:flex;flex-wrap:nowrap;gap:5px;margin:14px 0 4px}
  .logfilter button{
    flex:1 1 0;min-width:0;white-space:nowrap;
    min-height:44px;padding:8px 4px;cursor:pointer;
    font-family:var(--sans);font-size:.72rem;font-weight:800;
    color:var(--navy);background:#fff;border:2px solid var(--sky-line);border-radius:99px;
  }
  .logfilter button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
  .logfilter button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .loggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
  .logcard{position:relative;border-radius:12px;overflow:hidden;background:#fff;
    border:2px solid var(--sky-line);aspect-ratio:1/1}
  .logcard img{width:100%;height:100%;object-fit:cover;display:block}
  /* No patrol label over the picture. The card already says its patrol, in
     its own type, and the pill landed straight on the word. */

  /* The button is a transparent 44px target; the pill is the span inside it,
     which can carry its own padding. Painting the button's own background and
     clipping it to the content box gave a pill exactly as wide as the word,
     so the rounded ends cut into the R and the T. */
  .reportbtn{
    position:absolute;right:0;top:0;min-height:44px;min-width:44px;
    display:flex;align-items:flex-start;justify-content:flex-end;
    padding:7px;cursor:pointer;background:none;border:0;
  }
  .reportbtn span{
    padding:5px 10px;border-radius:99px;line-height:1;
    font-family:var(--sans);font-size:.62rem;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;color:#fff;background:rgba(27,53,121,.82);
  }
  .reportbtn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  /* Pull the wall down to refresh it. The browser's own pull-to-refresh
     reloads the page, which on a screen that is a render rather than a URL
     lands you back on the intro, so it is turned off while the wall is up. */
  body.log{overscroll-behavior-y:contain}
  /* Sits in the gap the pull opens up, and is exactly as tall as that gap, so
     the label stays centred in it however far you pull. */
  .ptr{
    position:absolute;left:0;right:0;top:12px;z-index:0;pointer-events:none;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:9px;height:0;
    font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--navy);opacity:0;
  }
  .ptr i{
    flex:none;width:15px;height:15px;border-radius:50%;
    border:2.5px solid currentColor;border-top-color:transparent;
  }
  .ptr.spin i{animation:ptrspin .7s linear infinite}
  @keyframes ptrspin{to{transform:rotate(360deg)}}
  /* The pull moves this inner wrapper, not .screen: .screen carries a fadeup
     animation with fill mode both, and a filled animation beats an inline
     style, so a transform set there is silently ignored. */
  .pullwrap{flex:1;display:flex;flex-direction:column}
  .pullwrap.snap{transition:transform .22s ease}
  .logstatus{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    font-size:.72rem;font-weight:700;opacity:.85;
  }
  .logstatus .linkbtn{font-size:.72rem}
  .logempty{margin-top:18px;font-size:.95rem;font-weight:600;line-height:1.5;opacity:.9}
  .reportlink{display:inline-block;margin-top:16px;font-size:.72rem;font-weight:700;
    color:var(--navy);opacity:.8}

  /* ============================================================
     TOAST + INSTALL
     ============================================================ */
  .toast{
    position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:20;max-width:min(24rem,calc(100vw - 32px));
    background:var(--navy);color:#fff;border-radius:12px;
    padding:12px 16px;font-size:.85rem;font-weight:700;line-height:1.4;
    box-shadow:0 8px 26px rgba(0,0,0,.3);
    animation:fadeup .25s ease both;
  }
  .toast.bad{background:var(--red-ink)}
  .linkbtn{
    background:none;border:0;padding:10px 0;min-height:44px;cursor:pointer;
    font-family:var(--sans);font-size:.82rem;font-weight:800;color:inherit;
    text-decoration:underline;text-underline-offset:4px;
  }
  .linkbtn:focus-visible{outline:3px solid var(--red);outline-offset:3px}

  /* ============================================================
     ALMOST THERE — the beat before the reveal. Paper, never a patrol
     colour: the flood would give the answer away.
     ============================================================ */
  .almost .sub{margin-top:14px}
  .almost .ibottom{margin-top:auto}
  .holding{
    display:flex;align-items:center;gap:12px;margin-top:18px;
    font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--navy);opacity:.8;
  }
  .holding i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--red);
    animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

  /* ============================================================
     THE CARD CTA — the premium thing, sold with a picture of
     itself rather than a line of text in a stack of buttons.
     ============================================================ */
  .cardcta{
    background:#fff;color:var(--navy);border-radius:18px;
    padding:18px 18px 20px;margin-top:20px;text-align:left;width:100%;
    box-shadow:0 12px 34px rgba(0,0,0,.18);
  }
  .cardcta .eyebrow{color:var(--red-ink);opacity:1}
  .cardcta h2{font-family:var(--serif);font-size:1.6rem;line-height:1.15;font-weight:700;margin:6px 0 10px}
  .cardcta p{font-size:.95rem;line-height:1.5}
  .ctapreview{display:flex;align-items:flex-end;gap:12px;margin:16px 0 4px;justify-content:center}
  .ctapreview canvas{
    width:132px;height:132px;border-radius:14px;display:block;
    box-shadow:0 8px 20px rgba(0,0,0,.22);
  }
  .ghostcard{
    border-radius:10px;border:2px dashed rgba(27,53,121,.3);
    display:flex;align-items:flex-end;justify-content:center;
    font-size:.58rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:#5A6A94;padding-bottom:6px;
  }
  .ghostcard.post{width:64px;height:80px}
  .ghostcard.story{width:52px;height:92px}
  .cardcta .btn.primary{margin-top:16px}
  .quietrow{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:center;margin-top:18px}

  /* ============================================================
     GET ON THE WALL — an invitation, not a consent form. The facts
     are all still here; they are just not shouting.
     ============================================================ */
  .wallcta{background:#fff;color:var(--navy);border-radius:18px;padding:18px;margin-top:16px;
    text-align:left;width:100%}
  .wallcta h2{font-family:var(--serif);font-size:1.5rem;line-height:1.15;font-weight:700;margin:4px 0 8px}
  .wallcta p{font-size:.95rem;line-height:1.5}
  .wallstrip{display:flex;gap:8px;margin:14px 0 4px;overflow:hidden}
  .wallstrip img,.wallstrip .ghost{
    width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;
    background:rgba(27,53,121,.08);
  }
  .wallstrip .ghost{border:2px dashed rgba(27,53,121,.25)}
  .wallfacts{
    display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;
    font-size:.7rem;font-weight:800;letter-spacing:.04em;
  }
  .wallfacts span{
    background:rgba(27,53,121,.07);border-radius:99px;padding:6px 11px;color:var(--navy);
  }
  .wallnote{font-size:.8rem;line-height:1.5;margin-top:12px;opacity:.85}

  /* Buttons sitting on a white panel must not inherit the flood's
     white-on-transparent treatment, or they vanish. Every white panel on the
     result screen belongs in this list: .cardcta was added later and spent a
     build with an invisible white pill on white because it was not. */
  body.result-mode :is(.card,.cardcta,.wallcta) .btn,
  body.result-curlews :is(.card,.cardcta,.wallcta) .btn{
    background:#fff;border-color:var(--sky-line);color:var(--navy);text-align:center;
  }
  body.result-mode :is(.card,.cardcta,.wallcta) .btn.primary,
  body.result-curlews :is(.card,.cardcta,.wallcta) .btn.primary{
    background:var(--navy);border-color:var(--navy);color:#fff;
  }
  :is(.card,.cardcta,.wallcta) .stack .btn,
  :is(.card,.cardcta,.wallcta) .stack .btn.go{width:100%;margin:0}

  @media (min-width:900px){
    .stagewrap{max-width:22rem}
    .loggrid{grid-template-columns:repeat(4,1fr)}
  }

  @media (prefers-reduced-motion:reduce){
    .ptr.spin i{animation:none}
    .pullwrap.snap{transition:none}
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>

let current = 0;
let answers = [];
/* Worked out when the quiz finishes, held across the interstitial so the
   reveal does not have to score it again. */
let finished = null;
let shuffled = [];
let locked = false;

const app = document.getElementById("app");

/* A screen change is a new page, not a scroll. Without this you tap through
   from the foot of a long result and land halfway down the next screen. */
function toTop(){
  window.scrollTo(0, 0);
  if(document.scrollingElement) document.scrollingElement.scrollTop = 0;
}

function shuffle(a){
  const arr = a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function startQuiz(){
  current = 0;
  answers = [];
  finished = null;
  tallyCounted = false;
  shuffled = QUESTIONS.map(q => shuffle(q.options));
  document.body.className = "quiz";
  renderQuestion();
}

function pick(btn, patrol){
  if(locked) return;
  locked = true;
  btn.classList.add("picked");
  answers[current] = patrol;
  setTimeout(()=>{
    locked = false;
    current++;
    if(current < QUESTIONS.length){ renderQuestion(); }
    else { renderAlmost(); }
  }, 200);
}

function goBack(){
  if(locked) return;
  if(current === 0){ renderIntro(); return; }
  current--;
  answers.length = current;
  renderQuestion();
}

/* Returns the working, not just the answer: the four scores and whether a tie
   had to be broken. The result screen only wants the patrol, but the tally
   sends the rest so the quiz can be checked for bias later. */
function scoreDetail(){
  const totals = {wolves:0,bulls:0,curlews:0,ravens:0};
  answers.forEach((p,i)=>{ totals[p] += QUESTIONS[i].weight; });
  const max = Math.max(...Object.values(totals));
  const tied = Object.keys(totals).filter(p => totals[p] === max);
  let patrol = tied[0];
  if(tied.length === 1){
    patrol = tied[0];
  }else if(tied.includes(answers[0])){
    patrol = answers[0];
  }else{
    for(const p of answers){ if(tied.includes(p)){ patrol = p; break; } }
  }
  return {patrol: patrol, totals: totals, tied: tied};
}

function scoreResult(){ return scoreDetail().patrol; }

async function submitEmail(id){
  const input = document.getElementById("emailIn");
  const btn = document.getElementById("emailBtn");
  const note = document.getElementById("emailNote");
  const email = (input.value || "").trim();
  note.className = "micro";
  input.classList.remove("bad");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    note.textContent = "That email doesn't look quite right.";
    note.classList.add("err");
    input.classList.add("bad");
    return;
  }
  const target = apiUrl("/email") || EMAIL_ENDPOINT;
  if(!target){
    note.textContent = "Sign-up isn't switched on yet. Come and find us at Reunion instead.";
    note.classList.add("info");
    return;
  }
  btn.textContent = "Sending...";
  btn.disabled = true;
  try{
    const res = await fetch(target, {
      method:"POST",
      headers:{"Accept":"application/json","Content-Type":"application/json"},
      body: JSON.stringify({email:email, patrol:id, patrolName:PATROLS[id].name, source:"patrolfinder"})
    });
    if(!res.ok) throw new Error("send failed");
    document.getElementById("emailrow").outerHTML =
      '<p class="thanks">You\'re in. We\'ll be in touch about co-designing the Pavilion.</p>';
    note.textContent = "";
  }catch(_){
    note.textContent = "That didn't send. Try again in a moment.";
    btn.textContent = "Count me in";
    btn.disabled = false;
  }
}


/* ============================================================
   SHARED HELPERS
   ============================================================ */
const PATROL_HEX  = {wolves:"#2A5CAD", bulls:"#2F7D3F", curlews:"#F5B01E", ravens:"#C02D24"};
/* Curlews yellow is unreadable as type on cream, so cards ink it darker.
   The flood colour itself never changes: the patrol colours are historical. */
const PATROL_INK  = {wolves:"#2A5CAD", bulls:"#2A6E38", curlews:"#8A6100", ravens:"#B0271E"};
const PAPER = "#FAF5E9";
const NAVY  = "#1B3579";
const SERIF = '"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';
const SANS  = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const PATROL_IDS = ["wolves","bulls","curlews","ravens"];

/* Cream on the three dark floods, navy on Curlews yellow. */
function onFlood(id){ return id === "curlews" ? NAVY : PAPER; }

function apiUrl(path){
  return API_BASE ? API_BASE.replace(/\/+$/,"") + path : "";
}

function toast(msg, bad){
  const old = document.querySelector(".toast");
  if(old) old.remove();
  const t = document.createElement("p");
  t.className = "toast" + (bad ? " bad" : "");
  t.setAttribute("role","status");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.remove(); }, bad ? 6000 : 4000);
}

/* Photos come down seven days after the last day of Reunion. That promise is
   made to people before they upload, so the date is computed, never typed. */
function purgeDate(){
  const d = new Date(REUNION_ENDS + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + 7);
  return d;
}
/* "13 September" reads better on a chip than the full date, which is spelled
   out in the note underneath it. */
function purgeDateShort(){
  return purgeDate().toLocaleDateString("en-GB", {day:"numeric", month:"long", timeZone:"UTC"});
}

function purgeDateText(){
  return purgeDate().toLocaleDateString("en-GB", {day:"numeric", month:"long", year:"numeric", timeZone:"UTC"});
}

function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============================================================
   FEATURE SWITCHES
   The Jamboree Team can turn the wall, uploads or the whole card
   studio off from the console mid-event. Everything defaults to on
   so an unreachable API never blanks the app, and the last known
   answer is remembered so a returning phone gets the right screen
   with no flicker.
   ============================================================ */
const FLAGS = {wall:true, uploads:true, cards:true, moderate:false};

try{
  const saved = JSON.parse(localStorage.getItem("pf.flags") || "null");
  if(saved && typeof saved === "object"){
    ["wall","uploads","cards","moderate"].forEach(k => { if(k in saved) FLAGS[k] = !!saved[k]; });
  }
}catch(_){ /* private browsing, or nothing stored yet */ }

/* Hides anything marked with the switch it depends on. Called after every
   render, and again when the API answers. */
function applyFlags(){
  document.querySelectorAll("[data-needs]").forEach(el=>{
    el.hidden = !el.dataset.needs.split(" ").every(k => FLAGS[k] !== false);
  });
}

async function loadFlags(){
  if(!apiUrl("")) return FLAGS;
  try{
    const res = await fetch(apiUrl("/config"), {headers:{"Accept":"application/json"}});
    if(!res.ok) throw new Error("config");
    const data = await res.json();
    ["wall","uploads","cards","moderate"].forEach(k => { if(k in data) FLAGS[k] = !!data[k]; });
    try{ localStorage.setItem("pf.flags", JSON.stringify(FLAGS)); }catch(_){}
    applyFlags();
    /* If the wall went off while someone is standing on it, take them off it. */
    if(FLAGS.wall === false && document.querySelector(".logfilter")) renderIntro();
    if(FLAGS.cards === false && document.querySelector(".studio")) renderIntro();
  }catch(_){ /* keep what we had: an unreachable API is not a reason to hide things */ }
  return FLAGS;
}

/* ============================================================
   PATROL TALLY
   A count of outcomes and nothing else. No answers, no identity,
   no timestamps beyond the day. Drawn only from real numbers:
   with no API wired the bar simply does not appear.
   ============================================================ */
let tallyData = null;
let tallyCounted = false;

async function loadTally(){
  if(!apiUrl("")) return null;
  try{
    const res = await fetch(apiUrl("/tally"), {headers:{"Accept":"application/json"}});
    if(!res.ok) throw new Error("tally");
    const data = await res.json();
    if(data && typeof data === "object") tallyData = data;
    return tallyData;
  }catch(_){ return null; }
}

async function recordOutcome(id, detail){
  if(tallyCounted) return;          /* one count per finished quiz, not per re-render */
  tallyCounted = true;
  if(!apiUrl("")) return;
  try{
    /* answers is one patrol per question, in question order, which is exactly
       what a bias check needs: it says which option was picked without saying
       anything about who picked it. */
    const body = {patrol:id};
    if(detail){
      body.answers = detail.answers;
      body.scores = detail.totals;
      body.tied = detail.tied && detail.tied.length > 1 ? detail.tied : undefined;
    }
    const res = await fetch(apiUrl("/tally"), {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });
    if(res.ok){
      const data = await res.json().catch(()=>null);
      if(data && typeof data === "object") tallyData = data;
    }
  }catch(_){ /* offline at the campsite is normal; the count is not worth a fuss */ }
}

function tallyTotal(){
  if(!tallyData) return 0;
  return PATROL_IDS.reduce((n,p)=> n + (Number(tallyData[p]) || 0), 0);
}

/* Fills #tally once numbers exist. Called after the screen is on the page so
   the result never waits on the network. */
function paintTally(mine){
  const host = document.getElementById("tally");
  if(!host || !tallyData) return;
  const total = tallyTotal();
  if(total < 1) return;
  const segs = PATROL_IDS.map(p=>{
    const n = Number(tallyData[p]) || 0;
    const pct = total ? (n/total*100) : 0;
    return {p, n, pct};
  });
  host.innerHTML = `
    <p class="tiny">How the camp is splitting</p>
    <div class="tallybar" role="img" aria-label="${segs.map(s=>`${s.p}: ${s.n}`).join(", ")}">
      ${segs.map(s=>`<i class="seg-${s.p}" style="width:${s.pct.toFixed(1)}%"></i>`).join("")}
    </div>
    <div class="tallykey">
      ${segs.map(s=>`<span class="${s.p===mine?"me":""}"><i class="seg-${s.p}" style="background:${PATROL_HEX[s.p]}"></i>${PATROLS[s.p].name} <b>${Math.round(s.pct)}%</b></span>`).join("")}
    </div>
    <p class="micro">${total.toLocaleString("en-GB")} ${total === 1 ? "patrol" : "patrols"} found so far. Nothing we keep can identify you: just the answers themselves, so we can check the quiz is fair.</p>`;
}

/* ============================================================
   ANIMAL SILHOUETTES FOR CANVAS
   The four heads already live in the stylesheet as alpha masks.
   Rather than carry a second copy of ~100KB of base64, lift the
   data URI straight off the computed style and tint it.
   ============================================================ */
const headCache = {};
let fleurPromise = null;

/* The masthead fleur is a transparent PNG, so its alpha doubles as a mask.
   Filling that mask is the reversed (mono) mark, which is a permitted usage;
   it is not a recolour of the purple one. */
function loadFleur(){
  if(fleurPromise) return fleurPromise;
  fleurPromise = new Promise((resolve)=>{
    const el = document.querySelector(".mast .fleur");
    if(!el || !el.src){ resolve(null); return; }
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>resolve(null);
    img.src = el.src;
  });
  return fleurPromise;
}

function headDataUri(id){
  const probe = document.createElement("span");
  probe.className = "head head-" + id;
  probe.style.cssText = "position:absolute;left:-9999px;top:0;width:1px;height:1px";
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe);
  const raw = cs.webkitMaskImage || cs.maskImage || "";
  probe.remove();
  const m = raw.match(/url\(["']?(data:[^"')]+)["']?\)/);
  return m ? m[1] : null;
}

function loadHead(id){
  if(headCache[id]) return headCache[id];
  headCache[id] = new Promise((resolve)=>{
    const uri = headDataUri(id);
    if(!uri){ resolve(null); return; }
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>resolve(null);
    img.src = uri;
  });
  return headCache[id];
}

/* Draw the silhouette in one flat colour, fitted inside w x h. */
function drawHead(ctx, img, colour, x, y, w, h, alpha){
  if(!img) return;
  const scale = Math.min(w/img.width, h/img.height);
  const dw = img.width*scale, dh = img.height*scale;
  const off = document.createElement("canvas");
  off.width = Math.max(1, Math.round(dw));
  off.height = Math.max(1, Math.round(dh));
  const o = off.getContext("2d");
  o.drawImage(img, 0, 0, off.width, off.height);
  o.globalCompositeOperation = "source-in";
  o.fillStyle = colour;
  o.fillRect(0, 0, off.width, off.height);
  ctx.save();
  if(alpha != null) ctx.globalAlpha = alpha;
  ctx.drawImage(off, x + (w-dw)/2, y + (h-dh)/2, dw, dh);
  ctx.restore();
}

/* ============================================================
   CARD DRAWING
   Everything is expressed as a fraction of the frame, so the same
   routine draws the small on-screen preview and the full-size
   export with no second layout.
   ============================================================ */
/* The slider's old max. Past about three the photo is mush at card size. */
const ZOOM_MAX = 3;

const FORMATS = {
  profile:{ w:1080, h:1080, label:"Profile picture", sub:"Square",
            note:"Sized for a round profile picture. Everything important sits inside the circle." },
  /* Not offered in the studio. Every upload is rendered in this one shape so
     the wall reads as a wall rather than three designs cropped three ways. */
  wall:   { w:1080, h:1080, label:"Patrol wall", sub:"Square", wall:true, note:"" },
  post:   { w:1080, h:1350, label:"Instagram post", sub:"4:5",
            note:"The tallest portrait Instagram will show in the feed without cropping." },
  story:  { w:1080, h:1920, label:"Story", sub:"9:16",
            note:"Full screen, with room left top and bottom for Instagram's own buttons." }
};

/* How much of the card's height the cream panel takes. The panel is sized to
   the lines it has to hold, not the other way round: at 4:5 a shorter panel
   puts the rule through the traits, and the story needs a deeper panel than
   its share of the extra height because its type is scaled up. The wall card
   carries three lines instead of seven, so it needs less.

   One definition, because the drawing and the pan clamp both need it: they
   were separate numbers once and the story's clamp went on letting people pan
   the photo behind the panel after the panel grew. */
function panelFraction(fmt){
  return fmt === "wall" ? 0.26 : fmt === "story" ? 0.35 : 0.35;
}

/* Sets ctx.font, shrinking it until the line fits the space it has. Patrol
   names are short but "I'm a Curlew - which patrol are you?" is not. */
function fitFont(ctx, text, maxW, size, weight, family){
  let px = size;
  ctx.font = `${weight} ${px}px ${family}`;
  while(px > size*0.6 && ctx.measureText(text).width > maxW){
    px -= size*0.025;
    ctx.font = `${weight} ${px}px ${family}`;
  }
  return px;
}

/* The card is going to be looked at away from any link, so it carries the
   address in plain text. */
function cardUrlLine(){
  try{
    const u = new URL(SITE_URL);
    return (u.host + u.pathname).replace(/\/$/, "");
  }catch(_){ return "wsjpatrol.com"; }
}

function drawPhoto(ctx, img, x, y, w, h, st){
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const base = Math.max(w/img.width, h/img.height);
  const sc = base * st.zoom;
  const dw = img.width*sc, dh = img.height*sc;
  const cx = x + w/2 + st.ox*w;
  const cy = y + h/2 + st.oy*h;
  ctx.drawImage(img, cx - dw/2, cy - dh/2, dw, dh);
  ctx.restore();
}

/* Text set along a circle. Tops point inwards so the bottom of a
   badge reads the right way up. */
/* Text set around a circle. `outward` puts the tops of the letters away from
   the centre, which is what an arc across the top of a badge needs; the
   default points them inward, which is what an arc across the bottom needs so
   it reads without turning the badge over.

   The two cases also sweep opposite ways, and that is the part that is easy
   to get wrong: left-to-right on the page is a rising angle at the top of a
   circle and a falling one at the bottom. Getting it wrong does not look
   broken, it looks upside down, which is how "BROWNSEA ISLAND" shipped. */
function arcText(ctx, text, cx, cy, r, centreAngle, spacing, outward){
  const dir = outward ? 1 : -1;
  const chars = [...text];
  const widths = chars.map(c => ctx.measureText(c).width);
  const total = widths.reduce((a,b)=>a+b, 0) + spacing*(chars.length-1);
  let a = centreAngle - dir*(total/2)/r;
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  chars.forEach((ch,i)=>{
    const step = widths[i]/r;
    a += dir*step/2;
    ctx.save();
    ctx.translate(cx + r*Math.cos(a), cy + r*Math.sin(a));
    ctx.rotate(a + dir*Math.PI/2);
    ctx.fillText(ch, 0, 0);
    ctx.restore();
    a += dir*(step/2 + spacing/r);
  });
  ctx.restore();
}

/* The 120 postmark, redrawn for canvas. */
function drawPostmark(ctx, cx, cy, r, colour, alpha, onPhoto){
  ctx.save();
  if(onPhoto){
    const halo = ctx.createRadialGradient(cx, cy, r*0.2, cx, cy, r*1.7);
    halo.addColorStop(0, "rgba(0,0,0,0.34)");
    halo.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, r*1.7, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.strokeStyle = colour;
  ctx.fillStyle = colour;
  ctx.lineWidth = r*0.045;
  ctx.setLineDash([r*0.09, r*0.09]);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineWidth = r*0.027;
  ctx.beginPath(); ctx.arc(cx, cy, r*0.73, 0, Math.PI*2); ctx.stroke();
  /* Place and date both ride the band between the two rings, one over the top
     and one under the foot. The date used to be set flat below YEARS, where
     its ends ran straight through the inner ring. That leaves the middle of
     the stamp for the number, which is the thing anyone actually reads, so it
     is centred on the circle rather than sitting low in it. */
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.font = `800 ${r*0.50}px ${SANS}`;
  ctx.fillText("120", cx, cy + r*0.05);
  ctx.font = `700 ${r*0.15}px ${SANS}`;
  ctx.fillText("YEARS", cx, cy + r*0.29);
  ctx.font = `700 ${r*0.15}px ${SANS}`;
  arcText(ctx, "BROWNSEA ISLAND", cx, cy, r*0.86, -Math.PI/2, r*0.04, true);
  ctx.font = `700 ${r*0.14}px ${SANS}`;
  arcText(ctx, "1907 • 2027", cx, cy, r*0.86, Math.PI/2, r*0.05, false);
  ctx.restore();
}

/* A hand-torn paper edge rather than a ruled line. Deterministic, so the
   preview and the export tear in exactly the same places. */
function tornEdge(ctx, y, W, amp, seed){
  const steps = 26;
  ctx.lineTo(W, y);
  for(let i = steps; i >= 0; i--){
    const t = i/steps;
    const wobble = Math.sin(t*11.3 + seed)*0.55 + Math.sin(t*27.7 + seed*2.1)*0.45;
    ctx.lineTo(W*t, y + wobble*amp);
  }
}

/* The stitched animal roundel that marks the patrol. */
function drawStamp(ctx, headImg, id, cx, cy, r){
  ctx.save();
  /* Cream backing first, so the roundel separates from a busy photo and from
     its own flood colour alike. */
  ctx.fillStyle = PAPER;
  ctx.shadowColor = "rgba(0,0,0,0.25)";
  ctx.shadowBlur = r*0.22;
  ctx.beginPath(); ctx.arc(cx, cy, r*1.34, 0, Math.PI*2); ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.strokeStyle = PATROL_INK[id];
  ctx.lineWidth = r*0.07;
  ctx.setLineDash([r*0.17, r*0.15]);
  ctx.beginPath(); ctx.arc(cx, cy, r*1.17, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = PATROL_HEX[id];
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  drawHead(ctx, headImg, onFlood(id), cx - r*0.62, cy - r*0.56, r*1.24, r*1.12);
}

function drawCard(ctx, W, H, st){
  const id = st.patrol;
  const pt = PATROLS[id];
  const head = st.head;
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  if(st.fmt === "profile") drawProfileCard(ctx, W, H, st, id, pt, head);
  else drawPanelCard(ctx, W, H, st, id, pt, head);

  ctx.restore();
}

function drawProfileCard(ctx, W, H, st, id, pt, head){
  const S = Math.min(W, H), cx = W/2, cy = H/2;

  if(st.img){
    drawPhoto(ctx, st.img, 0, 0, W, H, st);
    /* Enough shade at the foot for the plate to sit on, whatever the photo. */
    const scrim = ctx.createLinearGradient(0, H*0.55, 0, H);
    scrim.addColorStop(0, "rgba(0,0,0,0)");
    scrim.addColorStop(1, "rgba(0,0,0,0.40)");
    ctx.fillStyle = scrim;
    ctx.fillRect(0, H*0.55, W, H*0.45);
  }else{
    ctx.fillStyle = PATROL_HEX[id];
    ctx.fillRect(0, 0, W, H);
    drawHead(ctx, head, onFlood(id), W*0.19, H*0.14, W*0.62, H*0.50, 0.96);
  }

  /* Cream rim, so the square reads as a badge and the circle reads as a rim. */
  const rimW = S*0.032;
  ctx.save();
  ctx.strokeStyle = PAPER;
  ctx.lineWidth = rimW;
  ctx.beginPath(); ctx.arc(cx, cy, S/2 - rimW/2, 0, Math.PI*2); ctx.stroke();
  ctx.restore();

  /* Patrol-colour arc plate across the foot of the badge. */
  const outerR = S/2 - rimW;
  const innerR = outerR - S*0.152;
  const half = 1.30;                       /* radians either side of straight down */
  /* Same rule as the result banners: the plate re-inks against what is behind
     it rather than sitting in one fixed colour. On a photo the patrol colour
     is the plate; on the patrol's own flood the plate goes cream. */
  const plate = st.img ? PATROL_HEX[id] : PAPER;
  const plateInk = st.img ? onFlood(id) : PATROL_INK[id];
  ctx.save();
  ctx.fillStyle = plate;
  ctx.beginPath();
  ctx.arc(cx, cy, outerR, Math.PI/2 - half, Math.PI/2 + half, false);
  ctx.arc(cx, cy, innerR, Math.PI/2 + half, Math.PI/2 - half, true);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = st.img ? 1 : 0.35;
  ctx.strokeStyle = st.img ? PAPER : PATROL_INK[id];
  ctx.lineWidth = S*0.007;
  ctx.beginPath();
  ctx.arc(cx, cy, innerR, Math.PI/2 - half, Math.PI/2 + half, false);
  ctx.stroke();
  ctx.restore();

  /* The name sits in the middle of the plate with the two marks either side of
     it, so nothing is laid over the photo. */
  ctx.save();
  ctx.fillStyle = plateInk;
  ctx.font = `700 ${S*0.078}px ${SERIF}`;
  arcText(ctx, pt.name.toUpperCase(), cx, cy, innerR + S*0.082, Math.PI/2, S*0.010, false);
  ctx.restore();

  /* Animal to the left of the name, Scouts fleur to the right. Angle increases
     anticlockwise on canvas, so the larger angle is the left-hand side. */
  const markR = (innerR + outerR)/2;
  /* Far enough inside the plate's ends that the marks' square bounding boxes
     clear the radial cut: at 1.02 against a 1.18 plate the wolf's snout was
     sliced off. */
  const markA = 1.05;
  const markH = S*0.082;
  const put = (img, angle) => {
    if(!img) return;
    const mx = cx + markR*Math.cos(angle);
    const my = cy + markR*Math.sin(angle);
    drawHead(ctx, img, plateInk, mx - markH/2, my - markH/2, markH, markH);
  };
  put(head, Math.PI/2 + markA);
  put(st.fleur, Math.PI/2 - markA);
}

function drawPanelCard(ctx, W, H, st, id, pt, head){
  const story = st.fmt === "story";
  const wall = st.fmt === "wall";
  const panelH = H*panelFraction(st.fmt);
  const panelTop = H - panelH;
  const photoH = panelTop + W*0.03;
  const pad = W*0.085;
  /* Story leaves the bottom strip clear of Instagram's own controls; the
     post format just wants an even margin. */
  const footRoom = story ? H*0.075 : W*0.055;
  /* The story is a third taller than the post and was being given the post's
     type sizes, so it spent its extra height on empty margin instead of on
     legibility. */
  const k = story ? 1.22 : 1;
  /* Spacing and type size are scaled separately. The story has a third more
     height to spend, but the glyphs share a 1080 canvas with the post, so
     type grows by less than the gaps between lines do. */
  const kt = story ? 1.12 : 1;

  if(st.img){
    drawPhoto(ctx, st.img, 0, 0, W, photoH, st);
  }else{
    ctx.fillStyle = PATROL_HEX[id];
    ctx.fillRect(0, 0, W, photoH);
    drawHead(ctx, head, onFlood(id), W*0.18, photoH*0.16, W*0.64, photoH*0.62, 0.95);
  }

  if(!wall){
    drawPostmark(ctx, W - pad - W*0.115, (story ? H*0.115 : W*0.16), W*0.115,
                 st.img ? PAPER : onFlood(id), st.img ? 0.95 : 0.5, !!st.img);
  }

  /* Torn cream panel. */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(W, H);
  tornEdge(ctx, panelTop, W, W*0.026, 1.7);
  ctx.closePath();
  ctx.fillStyle = PAPER;
  ctx.shadowColor = "rgba(0,0,0,0.28)";
  ctx.shadowBlur = W*0.03;
  ctx.shadowOffsetY = -W*0.006;
  ctx.fill();
  ctx.restore();

  /* Animal straddling the tear, half on the photo, half on the paper. */
  const stampR = W*0.115;
  drawStamp(ctx, head, id, W - pad - stampR, panelTop + W*0.012, stampR);

  /* One baseline rhythm, measured down from the top of the text block, scaled
     per format. The eyebrow sits well clear of the name now: at 4:5 the two
     were close enough to read as one crowded block. */
  /* The link is no longer a line in this stack - it sits in the bottom right
     corner - so the block ends at the dates and drops by the height the link
     used to take. That is what pulls the eyebrow clear of the torn edge,
     which wobbles by W*0.026 and could reach it. */
  const LINE = {eyebrow:0, name:0.116*k, tagline:0.170*k, rule:0.202*k,
                traits:0.248*k, dates:0.288*k};
  const topY = H - footRoom - W*LINE.dates;
  const wideW = W - pad*2;

  /* How far right a line may run before it meets the roundel. The roundel is
     a disc, so this depends on the line's own height: the eyebrow sits beside
     its widest part and the name well below it, where there is more room.
     A fixed exclusion left the eyebrow 20px clear of the disc on a 1080 card,
     a quarter of the page margin, which reads as a crash even though nothing
     actually overlaps. */
  const discCx = W - pad - stampR, discCy = panelTop + W*0.012, discR = stampR*1.34;
  const AIR = W*0.06;
  function roomFor(baseline, capH){
    let left = W;
    for(const y of [baseline - capH, baseline]){
      const dy = Math.abs(y - discCy);
      if(dy < discR) left = Math.min(left, discCx - Math.sqrt(discR*discR - dy*dy));
    }
    return Math.max(W*0.32, Math.min(wideW, left - AIR - pad));
  }
  const eyebrow = ("I'm " + pt.one + " — which patrol are you?").toUpperCase();
  const traits = pt.traits.join("  ·  ").toUpperCase();
  const dates = "BROWNSEA ISLAND 1907  →  GDAŃSK 2027";

  ctx.save();
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";

  /* Measured before anything else is drawn, because the two lines that end up
     beside it have to know how much width it leaves them. */
  const url = cardUrlLine();
  const urlSize = W*0.034;
  ctx.font = `800 ${urlSize}px ${SANS}`;
  const urlW = ctx.measureText(url).width;
  const urlPadX = W*0.030, urlPadY = W*0.019;
  const pillW = urlW + urlPadX*2, pillH = urlSize + urlPadY*2;
  const pillX = W - pad - pillW;
  /* Sat on the bottom two lines rather than under them: it is a corner badge
     now, not the last line of the stack. Centred on their ink rather than on
     their baselines, which sit a half cap-height low. */
  const pillMid = topY + W*(LINE.traits + LINE.dates)/2 - W*0.026*kt/2;
  const pillY = pillMid - pillH/2;
  const beside = Math.max(W*0.32, pillX - W*0.045 - pad);

  /* The wall card is looked at about 170px wide in a grid of them. Only the
     patrol name and the animal survive at that size, so it carries those and
     stops. Everything else would be noise pretending to be information. */
  if(wall){
    ctx.fillStyle = PATROL_INK[id];
    fitFont(ctx, pt.name, wideW - stampR*2.4, W*0.155, 700, SERIF);
    ctx.fillText(pt.name, pad, panelTop + W*0.150);
    ctx.fillStyle = NAVY;
    ctx.globalAlpha = 0.72;
    fitFont(ctx, "BROWNSEA 1907", wideW, W*0.030, 800, SANS);
    ctx.fillText("BROWNSEA 1907", pad, panelTop + W*0.205);
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }

  ctx.fillStyle = NAVY;
  ctx.globalAlpha = 0.8;
  const ebY = topY + W*LINE.eyebrow, ebCap = W*0.029*kt;
  fitFont(ctx, eyebrow, roomFor(ebY, ebCap), ebCap, 800, SANS);
  ctx.fillText(eyebrow, pad, ebY);
  ctx.globalAlpha = 1;

  ctx.fillStyle = PATROL_INK[id];
  const nameY = topY + W*LINE.name, nameCap = W*0.125*kt;
  fitFont(ctx, pt.name, roomFor(nameY, nameCap), nameCap, 700, SERIF);
  ctx.fillText(pt.name, pad, nameY);

  ctx.fillStyle = NAVY;
  ctx.globalAlpha = 0.9;
  const tagY = topY + W*LINE.tagline, tagCap = W*0.038*kt;
  fitFont(ctx, pt.tagline, roomFor(tagY, tagCap), tagCap, 600, SANS);
  ctx.fillText(pt.tagline, pad, tagY);
  ctx.globalAlpha = 1;

  ctx.strokeStyle = "rgba(27,53,121,0.2)";
  ctx.lineWidth = W*0.005;
  ctx.beginPath();
  ctx.moveTo(pad, topY + W*LINE.rule);
  ctx.lineTo(pad + W*0.42, topY + W*LINE.rule);
  ctx.stroke();

  ctx.fillStyle = NAVY;
  ctx.globalAlpha = 0.72;
  const trY = topY + W*LINE.traits, dtY = topY + W*LINE.dates, smallCap = W*0.026*kt;
  fitFont(ctx, traits, Math.min(beside, roomFor(trY, smallCap)), smallCap, 800, SANS);
  ctx.fillText(traits, pad, trY);
  fitFont(ctx, dates, Math.min(beside, roomFor(dtY, smallCap)), smallCap, 700, SANS);
  ctx.fillText(dates, pad, dtY);

  ctx.globalAlpha = 1;

  /* A pill rather than another line of small type. It contrasts on all four
     patrols without needing a colour that happens to suit one of them, and it
     reads as somewhere to go rather than a footnote. In the bottom right
     corner it also stops being something the eye has to step over on its way
     down the block. */
  ctx.font = `800 ${urlSize}px ${SANS}`;
  ctx.fillStyle = PATROL_HEX[id];
  if(ctx.roundRect){
    ctx.beginPath(); ctx.roundRect(pillX, pillY, pillW, pillH, pillH/2); ctx.fill();
  }else{
    ctx.fillRect(pillX, pillY, pillW, pillH);
  }
  ctx.fillStyle = onFlood(id);
  ctx.fillText(url, pillX + urlPadX, pillY + urlPadY + urlSize*0.78);
  ctx.restore();
}

/* ============================================================
   PATROL CARD STUDIO
   The photo is opened with FileReader/createImageBitmap and drawn
   straight onto a canvas in this tab. It is never sent anywhere
   unless the person separately chooses the patrol log.
   ============================================================ */
let studio = null;

function newStudioState(id, head, fleur){
  return { patrol:id, head:head, fleur:fleur || null, fmt:"profile", img:null, zoom:1, ox:0, oy:0 };
}

function clampPan(){
  if(!studio || !studio.img) { studio.ox = 0; studio.oy = 0; return; }
  const F = FORMATS[studio.fmt];
  const frameH = (studio.fmt === "profile") ? F.h
    : (F.h - F.h*panelFraction(studio.fmt) + F.w*0.03);
  const w = F.w, h = frameH;
  const img = studio.img;
  const sc = Math.max(w/img.width, h/img.height) * studio.zoom;
  const maxX = Math.max(0, (img.width*sc - w) / 2 / w);
  const maxY = Math.max(0, (img.height*sc - h) / 2 / h);
  studio.ox = Math.min(maxX, Math.max(-maxX, studio.ox));
  studio.oy = Math.min(maxY, Math.max(-maxY, studio.oy));
}

function paintPreview(){
  const c = document.getElementById("stage");
  if(!c || !studio) return;
  const F = FORMATS[studio.fmt];
  const W = 540, H = Math.round(540 * F.h / F.w);
  if(c.width !== W || c.height !== H){ c.width = W; c.height = H; }
  clampPan();
  drawCard(c.getContext("2d"), W, H, studio);
  const wrap = c.parentElement;
  wrap.classList.toggle("circlecrop", studio.fmt === "profile");
  const note = document.getElementById("stageNote");
  if(note) note.textContent = F.note;
}

async function openPhoto(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast("That file isn't a photo.", true); return; }
  try{
    let img;
    if(window.createImageBitmap){
      /* from-image honours the phone's rotation flag, so portraits stay upright */
      img = await createImageBitmap(file, {imageOrientation:"from-image"});
    }else{
      img = await new Promise((res, rej)=>{
        const el = new Image();
        el.onload = ()=>res(el);
        el.onerror = rej;
        el.src = URL.createObjectURL(file);
      });
    }
    studio.img = img;
    studio.zoom = 1; studio.ox = 0; studio.oy = 0;
    paintPreview();
    const rm = document.getElementById("removePhoto");
    if(rm) rm.hidden = false;
    toast("Photo loaded. It stays on this device.");
  }catch(_){
    toast("Couldn't open that photo. Try another one.", true);
  }
}

async function renderExport(){
  const F = FORMATS[studio.fmt];
  const c = document.createElement("canvas");
  c.width = F.w; c.height = F.h;
  drawCard(c.getContext("2d"), F.w, F.h, studio);
  return await new Promise(res => c.toBlob(res, "image/jpeg", 0.92));
}

function cardFilename(){
  return `im-${studio.patrol}-${studio.fmt}.jpg`;
}

async function saveCard(){
  try{
    const blob = await renderExport();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = cardFilename();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast("Saved to your device.");
  }catch(_){ toast("Couldn't save the card. Try sharing it instead.", true); }
}

/* Share the card itself, not just a link to the quiz. */
async function shareCard(blobIn, text){
  const blob = blobIn || await renderExport();
  const file = new File([blob], cardFilename(), {type:"image/jpeg"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], text:text, title:"WSJ 2027 UK — Which Brownsea Island patrol are you?"});
      return true;
    }catch(err){
      if(err && err.name === "AbortError") return true;   /* they changed their mind */
    }
  }
  return false;
}

/* ============================================================
   SHARE
   ============================================================ */
function shareUrlFor(id){
  try{
    const u = new URL(SITE_URL);
    u.search = "?patrol=" + id;
    return u.toString();
  }catch(_){
    const u = new URL(window.location.href);
    u.hash = ""; u.search = "?patrol=" + id;
    return u.toString();
  }
}

function shareTextFor(id){
  const pt = PATROLS[id];
  return `I'm ${pt.one}. ${pt.tagline} Which of the four 1907 Brownsea patrols are you? 120 years of Scouting, UK Pavilion, Poland 2027.`;
}

async function sharePatrol(id, btn){
  const text = shareTextFor(id);
  const url = shareUrlFor(id);
  const label = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Getting your card ready..."; }
  try{
    /* Build a card on the fly so what lands in the chat actually shows the
       patrol. Falls back to text and a link where files can't be shared. */
    const [head, fleur] = await Promise.all([loadHead(id), loadFleur()]);
    const saved = studio;
    studio = newStudioState(id, head, fleur);
    let blob = null;
    try{ blob = await renderExport(); }catch(_){}
    studio = saved;
    if(blob && await shareCard(blob, text + " " + url)) return;

    if(navigator.share){
      try{ await navigator.share({title:"WSJ 2027 UK — Which Brownsea Island patrol are you?", text:text, url:url}); return; }catch(err){
        if(err && err.name === "AbortError") return;
      }
    }
    if(navigator.clipboard){
      await navigator.clipboard.writeText(text + " " + url);
      toast("Copied. Paste it wherever you like.");
      return;
    }
    toast(text, false);
  }catch(_){
    toast("Sharing didn't work on this device. Screenshot works fine.", true);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = label; }
  }
}

/* ============================================================
   PATROL LOG
   Optional, public, and swept seven days after Reunion. Uploads
   are held for the Jamboree Team to release, so nothing appears
   on the wall unchecked.
   ============================================================ */
/* Show the wall rather than describing it. Four real cards are a better
   argument for joining in than any sentence. Falls back to dashed placeholders
   when the wall is empty or unreachable, which still reads as "space for you". */
async function paintWallStrip(){
  const strip = document.getElementById("wallStrip");
  if(!strip) return;
  strip.innerHTML = '<span class="ghost"></span><span class="ghost"></span><span class="ghost"></span><span class="ghost"></span>';
  if(!apiUrl("") || FLAGS.wall === false) return;
  try{
    const res = await fetch(apiUrl("/photos"), {headers:{"Accept":"application/json"}});
    const data = await res.json();
    const items = (Array.isArray(data) ? data : (data && data.items) || []).slice(0, 4);
    if(!items.length) return;
    strip.innerHTML = items.map(i =>
      `<img src="${esc(i.url)}" alt="" loading="lazy">`
    ).join("") + '<span class="ghost"></span>';
    strip.querySelectorAll("img").forEach(im=>{
      im.addEventListener("error", ()=>{ im.replaceWith(Object.assign(document.createElement("span"), {className:"ghost"})); });
    });
  }catch(_){ /* the placeholders already say the right thing */ }
}

async function uploadToLog(btn){
  const consent = document.getElementById("logConsent");
  if(!consent || !consent.checked){
    toast("Tick the box first, so we know you're happy for it to be public.", true);
    return;
  }
  if(FLAGS.uploads === false || FLAGS.wall === false){
    toast("Adding to the wall is switched off just now. Your card is still yours to save.", true);
    return;
  }
  if(!apiUrl("")){
    toast("The patrol log isn't switched on yet. Come and show us at the Pavilion instead.", true);
    return;
  }
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Uploading...";
  try{
    /* Rendered in the wall's own shape rather than whichever format happens to
       be selected, so the wall is one design instead of three cropped square. */
    const saved = studio.fmt;
    studio.fmt = "wall";
    let blob;
    try{ blob = await renderExport(); }
    finally{ studio.fmt = saved; }
    const fd = new FormData();
    fd.append("patrol", studio.patrol);
    fd.append("photo", blob, "wall-" + studio.patrol + ".jpg");
    const res = await fetch(apiUrl("/photos"), {method:"POST", body:fd});
    if(!res.ok) throw new Error("upload");
    const out = await res.json().catch(()=>({}));
    const queued = out && out.status === "pending";
    document.getElementById("logbox").innerHTML = queued
      ? `<p class="thanks">You're in the queue. The Jamboree Team put cards up through the day, and everything comes down on ${esc(purgeDateText())}.</p>`
      : `<p class="thanks">You're on the wall. Go and find the rest of your patrol on it. Everything comes down on ${esc(purgeDateText())}.</p>`;
    toast(queued ? "Sent to the patrol log." : "Added to the patrol log.");
  }catch(_){
    btn.disabled = false;
    btn.textContent = label;
    toast("That didn't upload. Try again in a moment.", true);
  }
}

async function reportPhoto(id, cardEl){
  cardEl.remove();
  toast("Hidden here, and flagged to the Jamboree Team.");
  if(!apiUrl("")) return;
  try{
    await fetch(apiUrl("/report"), {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id:id})
    });
  }catch(_){}
}

/* ============================================================
   PWA
   The app stays installable - manifest, icons, offline service
   worker - but says nothing about it. Browsers offer "Add to home
   screen" in their own menu, and a button of ours competing with
   that is one more thing on the screen at a busy stand.
   ============================================================ */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

          <p>Add a photo and put your patrol on your profile. Made on your phone, in a few taps, yours to keep.</p>
