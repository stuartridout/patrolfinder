name: Publish to GitHub Pages

# GitHub Pages serves this site from the gh-pages branch. This workflow
# republishes index.html to that branch whenever main changes. The
# Actions-native Pages deploy (configure-pages/deploy-pages) is not used
# because creating/updating the Pages site via API needs repo-admin,
# which the workflow token does not have; pushing gh-pages does not.

on:
  push:
    branches: [main, claude/publish-file-github-gx9pt5]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push the site to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          html=$(git hash-object -w index.html)
          empty=$(git hash-object -w --stdin </dev/null)
          tree=$(printf '100644 blob %s\t.nojekyll\n100644 blob %s\tindex.html\n' "$empty" "$html" | git mktree)
          commit=$(git commit-tree "$tree" -m "Publish site from $GITHUB_SHA")
          git push --force origin "$commit":refs/heads/gh-pages
