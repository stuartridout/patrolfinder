<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Baden-Powell in his Scout hat">
  <title>WSJ 2027 UK</title>
  <!-- Baden-Powell in his campaign hat. Traced from the silhouette Stuart
       supplied for this project, cropped to the head and shoulder and bled
       off the bottom edge. Not original artwork and not drawn from scratch:
       drawing it from scratch was tried, and at icon size a hand-drawn head
       in a wide-brimmed hat turns into a plague doctor's mask.

       This path is the mark. The eight PNGs in this folder are renders of it
       at two framings, both running the shoulder off the foot of the frame:
       width 0.86 of the box with its top at 0.1 for everything, and
       width 0.72 at 0.165 for the maskable icon, which is pulled in so the
       head clears its circular safe zone. Never hand-edit the PNGs. -->
  <defs><clipPath id="frame"><rect width="512" height="512" rx="112"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="#1B3579"/>
