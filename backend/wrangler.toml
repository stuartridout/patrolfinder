name = "patrolfinder-api"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
# Lock this to the site once it is live. "*" is fine while testing.
ALLOWED_ORIGIN = "https://wsjpatrol.com"
# The last day of Gilwell Reunion. Photos are deleted seven days later.
# Must match REUNION_ENDS in index.html.
REUNION_ENDS = "2026-09-06"

[[d1_databases]]
binding = "DB"
database_name = "patrolfinder"
database_id = "PUT-YOUR-D1-ID-HERE"

[[kv_namespaces]]
binding = "IMAGES"
id = "PUT-YOUR-KV-ID-HERE"

# Daily sweep. Every read filters on the cutoff too, so a missed run cannot
# leave a photo up past its date.
[triggers]
crons = ["17 3 * * *"]
